<!DOCTYPE html>
<html lang="vi" spellcheck="false">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Điều kiện đúc — TOYOTAKI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

<!--
  dieu-kien-duc.html — T320: Điều kiện đúc Bước 4 (spec SPEC_Dieu_kien_duc_MES.md).
  Danh sách phiếu (Mã SP × Máy) · Xem ?id=N (hoặc ?ma_may=&ma_sp= → lần hiệu lực) · Lập ?moi=1 · Sửa ?id=N&sua=1.
  Ghi qua hàm DB T319: duc_dk_luu / gui / kiem / duyet / huy_nhap, quyền duc_dk_quyen.
  Ảnh: bucket su-co-duc/dieu-kien-duc/ (nén như ảnh sự cố). Tệp PDF/Excel: bucket cong-viec/dieu-kien-duc/.
  T321 Bước 5: Lần mới (duc_dk_lan_moi → mở sửa nháp) · So sánh ?ss=A&voi=B (tô dòng khác) · In A4 dọc (#vIn + @media print, ô ký 3 bước)
  · Excel: xuất 1 phiếu (SheetJS, tải khi cần) — file xuất cũng là mẫu nhập; Nhập Excel ở form Lập/Sửa → điền form, bấm Lưu = nháp.
  Mẫu Excel: cột A = mã thông số (VL01…) / loại dụng cụ (DT, OL…) / nhãn "Máy", "Mã SP", "Lý do ban hành"; Chuẩn cột D, Ghi chú cột I, mã dụng cụ cột C.
-->
<style>
:root{--bg-page:#EEF1F5;--bg-panel:#FFFFFF;--bg-sunken:#F5F7FA;--bg-header:#1E293B;--border:#D9DFE5;--border-strong:#B8C1CC;--text:#0F172A;--text-muted:#64748B;--text-dim:#94A3B8;--accent:#0F5FA5;--accent-hover:#0A4681;--run-fg:#047857;--run-bg:#ECFDF5;--warn-fg:#B45309;--warn-bg:#FFFBEB;--alarm-fg:#B91C1C;--alarm-bg:#FEF2F2;--shadow-sm:0 1px 2px rgba(15,23,42,0.04);--shadow-lg:0 12px 32px rgba(15,23,42,0.16);}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg-page);min-height:100vh;color:var(--text);font-size:13px;line-height:1.35;-webkit-font-smoothing:antialiased}
body{padding:6px 6px 60px}
.wrap{margin:6px 0 0;display:flex;flex-direction:column;gap:6px}
header{background:var(--bg-header);color:#F1F5F9;border-radius:8px;padding:6px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-sm);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand .co{font-size:11px;letter-spacing:.08em;color:#94A3B8;text-transform:uppercase;font-weight:500}
.brand .title{font-size:14px;font-weight:700;color:#FFF}
.header-divider{width:1px;height:28px;background:#334155}
.sp{flex:1}
.btn{border:none;border-radius:5px;padding:7px 12px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--accent-hover)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:transparent;color:#F1F5F9;border:1px solid #475569}
.btn-ghost:hover{background:#334155}
.btn-outline{background:#fff;border:1.5px solid var(--border-strong);color:var(--text)}
.btn-outline:hover{background:var(--bg-sunken)}
.btn-ok{background:#16A34A}.btn-ok:hover{background:#15803D}
.btn-do{background:#fff;color:var(--alarm-fg);border:1.5px solid #FCA5A5}.btn-do:hover{background:var(--alarm-bg)}
.card{background:var(--bg-panel);border-radius:8px;box-shadow:var(--shadow-sm);border:1px solid var(--border);padding:10px 12px}
.card-title{font-size:11.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
select,input,textarea{border:1.5px solid var(--border-strong);border-radius:6px;padding:6px 8px;font-family:inherit;font-size:12.5px;background:#fff;color:var(--text);max-width:100%}
textarea{width:100%;min-height:54px;resize:vertical}
.filters input[type=search]{min-width:180px}
.chip{border:1px solid var(--border-strong);background:#fff;border-radius:100px;padding:5px 11px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-muted)}
.chip.on{background:var(--text);color:#fff;border-color:var(--text)}
.chip .n{display:inline-block;min-width:16px;margin-left:4px;border-radius:8px;background:#DC2626;color:#fff;font-size:11px;text-align:center}
.tw{overflow:auto;border:1px solid var(--border);border-radius:6px}
table.ds{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.ds th{position:sticky;top:0;z-index:1;background:var(--bg-sunken);color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:7px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
.ds td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.ds td small{display:block;color:var(--text-muted);font-size:11px}
.ds td.nw{white-space:nowrap}
.ds tr.row{cursor:pointer}
.ds tr.row:hover td{background:#F8FAFC}
.tt{display:inline-block;font-weight:700;font-size:11px;padding:1px 7px;border-radius:10px;white-space:nowrap;background:#E2E8F0;color:#334155}
.tt.cho_kiem,.tt.cho_duyet{background:#FEF3C7;color:#92400E}
.tt.hieu_luc{background:var(--run-bg);color:var(--run-fg)}
.tt.het_hieu_luc{background:#F1F5F9;color:var(--text-dim)}
.tt.chua{background:var(--alarm-bg);color:var(--alarm-fg)}
.toi{color:var(--warn-fg);font-weight:700;font-size:11px}
/* Phiếu */
.ph-dau{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph-dau h2{font-size:16px;font-weight:700}
.ph-dau .loai{font-size:11px;color:var(--text-muted);font-weight:600}
.buoc{display:flex;gap:0;margin-top:10px;flex-wrap:wrap}
.buoc .b{flex:1 1 120px;padding:6px 10px;border:1px solid var(--border);background:var(--bg-sunken);font-size:12px;min-width:0}
.buoc .b:first-child{border-radius:6px 0 0 6px}.buoc .b:last-child{border-radius:0 6px 6px 0}
.buoc .b+.b{border-left:none}
.buoc .b b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted)}
.buoc .b.xong{background:var(--run-bg);border-color:#A7F3D0}.buoc .b.xong b{color:var(--run-fg)}
.buoc .b.dang{background:var(--warn-bg);border-color:#FCD34D}.buoc .b.dang b{color:var(--warn-fg)}
.buoc .b small{display:block;color:var(--text-muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hop{border-radius:8px;padding:9px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.hop .t{flex:1 1 220px;font-weight:600}
.hop.vang{border:1.5px solid #FCD34D;background:var(--warn-bg)}
.hop.do{border:1.5px solid #FCA5A5;background:var(--alarm-bg);color:var(--alarm-fg)}
.hop ul{padding-left:18px;font-weight:500;flex-basis:100%}
.nut{display:flex;gap:6px;flex-wrap:wrap}
.luoi{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:8px}
table.ts{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.ts th{background:var(--bg-sunken);color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
.ts td{padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.ts td:first-child,.ts th:first-child{position:sticky;left:0;background:#fff;z-index:1;min-width:150px}
.ts th:first-child{background:var(--bg-sunken)}
.ts td.so,.ts td.gt{white-space:nowrap}
.ts td.so{text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px}
.ts td.cp{white-space:nowrap;color:var(--text-muted);font-size:11.5px}
.ts td.ngoai{background:#FEF9C3}
.ts .ma{color:var(--text-dim);font-size:11px;margin-right:4px}
.ts .bb{color:var(--alarm-fg);font-weight:700}
.ts input,.ts select{width:100%;min-width:90px;padding:4px 6px}
.ts input.so{text-align:right;width:96px;min-width:0}
.ts input.ngoai{background:#FEF9C3;border-color:#FACC15}
.i{display:inline-block;width:16px;height:16px;line-height:14px;text-align:center;border:1px solid var(--border-strong);border-radius:50%;font-size:11px;color:var(--text-muted);cursor:pointer;margin-left:4px;font-style:normal;user-select:none}
.dc{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px}
.dc .o{border:1px solid var(--border);border-radius:6px;padding:6px 8px;background:var(--bg-sunken)}
.dc .o b{display:block;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.dc .o select{width:100%;margin-top:3px}
.anh{display:flex;gap:6px;flex-wrap:wrap}
.anh .t{position:relative}
.anh img{width:96px;height:96px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:pointer;display:block}
.anh .x{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(15,23,42,.7);color:#fff;cursor:pointer;font-size:12px}
.tep{display:flex;flex-direction:column;gap:3px}
.tep a{color:var(--accent);font-weight:600;text-decoration:none}
.tep .x{border:none;background:none;color:var(--alarm-fg);cursor:pointer;margin-left:6px;font-size:12px}
.lan{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.lan a{font-size:11.5px;padding:2px 8px;border-radius:10px;border:1px solid var(--border-strong);color:var(--text);text-decoration:none}
.lan a.on{background:var(--text);color:#fff;border-color:var(--text)}
.ls{list-style:none;font-size:12px}
.ls li{padding:3px 0;border-bottom:1px dashed var(--border)}
.ls small{color:var(--text-muted)}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.empty{padding:18px;text-align:center;color:var(--text-dim)}
.hint{font-size:12px;color:var(--text-muted)}
details summary{cursor:pointer;font-size:11.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:200;max-width:min(560px,92vw);padding:11px 16px;border-radius:8px;font-size:13px;font-weight:600;display:none;box-shadow:var(--shadow-lg);white-space:pre-line}
#msg.err{background:var(--alarm-bg);color:var(--alarm-fg);border:1px solid #FCA5A5;display:block}
#msg.ok{background:var(--run-bg);color:var(--run-fg);border:1px solid #86EFAC;display:block}
#msg.inf{background:#fff;color:var(--text);border:1px solid var(--border-strong);display:block}
dialog.xn{position:fixed;inset:0;margin:auto;height:fit-content;border:0;border-radius:12px;padding:18px;width:min(420px,calc(100vw - 32px));box-shadow:0 12px 40px rgba(0,0,0,.25);font:500 14px/1.45 Inter,system-ui,sans-serif}
dialog.xn::backdrop{background:rgba(15,23,42,.45)}
dialog.xn p{white-space:pre-line;margin-bottom:12px}
dialog.xn .nut{justify-content:flex-end}
table.ss td.khac{background:#FEF9C3;font-weight:700}
table.ss tr.nh td{background:var(--bg-sunken);font-weight:700;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
table.ss.chi-khac tr.giong{display:none}
.ss-chon{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:8px;margin-top:8px}
.ss-chon .f small{color:var(--text-muted);font-size:11px}
#vIn{display:none}
@media print{
  @page{size:A4 portrait;margin:10mm}
  html,body{background:#fff!important;padding:0!important;min-height:0}
  body>*:not(#vIn){display:none!important}
  #vIn{display:block;font-size:9pt;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #vIn .in-dau{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:4px;margin-bottom:6px}
  #vIn .in-dau h1{font-size:15pt;letter-spacing:.02em}
  #vIn .in-dau small{font-size:8pt;letter-spacing:.1em}
  #vIn .in-so{text-align:right;font-weight:700;font-size:10.5pt}
  #vIn table{width:100%;border-collapse:collapse}
  #vIn th,#vIn td{border:1px solid #555;padding:2px 4px;text-align:left;vertical-align:top}
  #vIn .in-tt th{width:16%;background:#EEE}
  #vIn .in-luoi{columns:2;column-gap:5mm;margin-top:6px}
  #vIn .in-ts{break-inside:avoid;margin-bottom:5px}
  #vIn .in-ts .nh th{background:#DDD;font-size:9pt}
  #vIn .in-ts td.r{text-align:right;white-space:nowrap;font-weight:700}
  #vIn .in-ts td.n{white-space:nowrap}
  #vIn .in-ghi{font-size:7.5pt;color:#333;margin-top:2px}
  #vIn .in-chua{border:1.5px solid #000;padding:3px 6px;font-weight:700;text-align:center;margin-top:6px}
  #vIn .in-ky{display:grid;grid-template-columns:repeat(3,1fr);gap:5mm;margin-top:8px;break-inside:avoid}
  #vIn .ky{border:1px solid #555;padding:4px;text-align:center}
  #vIn .ky .cho{height:15mm}
  #vIn .in-chan{margin-top:4px;font-size:7.5pt;color:#555;text-align:right}
}
@media (max-width:640px){.filters input[type=search]{flex:1;min-width:0}.hide-m{display:none}.ts td:first-child,.ts th:first-child{min-width:120px;max-width:150px}}
</style>
</head>

<div class="wrap">

    <section class="card">
      <div class="filters">
        <select id="fLoai"><option value="">Nhôm + Kẽm</option><option value="nhom">Đúc nhôm</option><option value="kem">Đúc kẽm</option></select>
        <select id="fMay"><option value="">Mọi máy</option></select>
        <select id="fTt">
          <option value="">Hiện hành</option><option value="tat">Mọi lần</option>
          <option value="nhap">Nháp</option><option value="cho_kiem">Chờ kiểm tra</option><option value="cho_duyet">Chờ duyệt</option>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
const TT = { nhap: 'Nháp', cho_kiem: 'Chờ kiểm tra', cho_duyet: 'Chờ duyệt', hieu_luc: 'Hiệu lực', het_hieu_luc: 'Hết hiệu lực', chua: 'Chưa có phiếu' };
const NHOM = { VL: 'Vật liệu & rót', PE: 'Phun ép', NT: 'Nhiệt độ & thời gian', PT: 'Phụ trợ' };
const LOAI_DC = { DT: 'Đầu típ', OL: 'Ống liệu', PK: 'Piston kẽm', XM: 'Xéc-măng', CN: 'Cổ ngỗng', VP: 'Vòi phun' };
const DC_THEO_LOAI = { nhom: ['DT', 'OL'], kem: ['PK', 'VP', 'XM', 'CN'] };
const DC_BB = { nhom: ['DT', 'OL'], kem: ['PK', 'VP'] };
const LS_TEN = { lap: 'Lập', sua: 'Sửa', gui: 'Gửi', kiem_dong_y: 'Kiểm tra đồng ý', kiem_tra_lai: 'Kiểm tra trả lại', duyet_dong_y: 'Duyệt', duyet_tra_lai: 'Duyệt trả lại', het_hieu_luc: 'Hết hiệu lực', lan_moi: 'Lần mới' };

let TS = [], DC = [], MAY = [], SP = new Map(), NVL = [], DS = [], quyen = {}, uid = null;
let ed = null;   // phiếu đang sửa
const $ = id => document.getElementById(id);
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad(n){ return String(n).padStart(2, '0'); }
function fmtTs(ts){ if (!ts) return ''; const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); }
function fmtNgay(ts){ if (!ts) return ''; const d = new Date(ts); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); }
const soVi = v => (v == null || v === '') ? '' : String(Number(Number(v).toFixed(3))).replace('.', ',');
const docSo = s => { s = String(s ?? '').trim().replace(',', '.'); return s === '' ? null : (isFinite(Number(s)) ? Number(s) : NaN); };
let msgT = null;
function showMsg(t, cls){ const el = $('msg'); el.textContent = t; el.className = cls || 'ok'; clearTimeout(msgT); msgT = setTimeout(() => { el.className = ''; }, cls === 'err' ? 7000 : 4500); }
window.showToast = (t, loi) => showMsg(t, loi ? 'err' : 'ok');
function hoiXacNhan(nd, o){
  o = o || {};
  return new Promise(res => {
    const d = $('dlgXn'), ok = $('xnOk'), huy = $('xnHuy');
    $('xnNd').textContent = nd; ok.textContent = o.nutOk || 'Đồng ý';
    ok.className = 'btn' + (o.nguyHiem ? ' btn-do' : '');
    const xong = v => { ok.onclick = huy.onclick = d.oncancel = null; d.close(); res(v); };
    ok.onclick = () => xong(true); huy.onclick = () => xong(false); d.oncancel = e => { e.preventDefault(); xong(false); };
    d.showModal(); setTimeout(() => ok.focus(), 30);
  });
}
function loaiMay(ma){ const m = MAY.find(x => x.ma_may === ma); return m ? (m.loai_may === 'Đúc kẽm' ? 'kem' : 'nhom') : null; }
function tenLoai(l){ return l === 'kem' ? 'Đúc kẽm' : 'Đúc nhôm'; }
function ttHtml(t){ return '<span class="tt ' + t + '">' + esc(TT[t] || t) + '</span>'; }
function lsCuoi(p, viec){ const a = (p.lich_su || []).filter(e => viec.includes(e.viec)); return a[a.length - 1] || null; }
function nguoiLap(p){ const e = (p.lich_su || []).find(x => x.viec === 'lap' || x.viec === 'lan_moi'); return e ? e.nguoi : ''; }
function toiCho(p){
  if (p.trang_thai === 'cho_kiem') return !!quyen.kiem && p.nguoi_lap !== uid;
  if (p.trang_thai === 'cho_duyet') return !!quyen.duyet && p.nguoi_lap !== uid;
  if (p.trang_thai === 'nhap') return !!quyen.lap && p.nguoi_lap === uid;
  return false;
}
function tsApDung(loai){ return TS.filter(t => t.ap_dung === 'ca_hai' || t.ap_dung === loai); }
function goiY(t, loai){ return loai === 'kem' ? [t.goi_y_kem_min, t.goi_y_kem_max] : [t.goi_y_nhom_min, t.goi_y_nhom_max]; }
function ngoaiGoiY(t, loai, v){
  if (v == null || isNaN(v)) return false;
  const [a, b] = goiY(t, loai);
  return (a != null && v < Number(a)) || (b != null && v > Number(b));
}
function goiYChu(t, loai){
  const [a, b] = goiY(t, loai);
  if (a == null && b == null) return '';
  return 'Gợi ý HPDC ' + (a != null ? soVi(a) : '…') + ' – ' + (b != null ? soVi(b) : '…') + (t.don_vi ? ' ' + t.don_vi : '');
}
function batBuoc(t, loai){ return loai === 'kem' ? t.bat_buoc_kem : t.bat_buoc_nhom; }
function choPhep(t, v){
  if (v == null || isNaN(v)) return '';
  const n = Number(t.nguong_pct ?? 5), d = Math.abs(v) * n / 100;
  return soVi(v - d) + ' – ' + soVi(v + d) + ' (±' + soVi(n) + '%)';
}
function urlDi(qs){ history.pushState(null, '', 'dieu-kien-duc.html' + (qs ? '?' + qs : '')); route(); }
window.addEventListener('popstate', route);

// ── Tải dữ liệu chung ──────────────────────────────────────────────────────
async function taiChung(){
  const [ts, dc, may, nvl, q, ss] = await Promise.all([
    sb.from('duc_dk_thong_so').select('*').eq('hien', true).order('nhom').order('thu_tu'),
    sb.from('duc_dung_cu').select('ma,loai,ten,duong_kinh,chieu_dai,may_dung,hien').order('ma'),
    sb.from('master_machines').select('ma_may,loai_may,ma_sp_dung').in('loai_may', ['Đúc nhôm', 'Đúc kẽm']),
    sb.from('nvl_materials').select('ma_nvl,ten_nvl,nhom_vat_tu').eq('nhom_vat_tu', 'kim_loai').order('ma_nvl'),
    sb.rpc('duc_dk_quyen'),
    sb.auth.getSession(),
  ]);
  const loi = [ts, dc, may, nvl, q].find(r => r.error);
  if (loi) throw new Error(loi.error.message);
  const thuTuNhom = { VL: 1, PE: 2, NT: 3, PT: 4 };
  TS = (ts.data || []).sort((a, b) => (thuTuNhom[a.nhom] - thuTuNhom[b.nhom]) || (a.thu_tu - b.thu_tu));
  DC = dc.data || [];
  MAY = (may.data || []).sort((a, b) => a.ma_may.localeCompare(b.ma_may, 'vi', { numeric: true }));
  NVL = nvl.data || [];
  quyen = q.data || {};
  uid = ss.data && ss.data.session ? ss.data.session.user.id : null;
  const sp = await sbTaiHet(() => sb.from('master_products').select('ma_sp,ten_sp').order('ma_sp'));
  SP = new Map((sp.data || []).map(r => [r.ma_sp, r.ten_sp || '']));
  $('hLap').hidden = !quyen.lap;
}
async function taiDs(){
  const r = await sbTaiHet(() => sb.from('duc_dk_phieu').select('id,ma_sp,ma_may,lan,trang_thai,hieu_luc_tu,lap_luc,nguoi_lap,lich_su,cho_tu').order('id', { ascending: false }));
  if (r.error) throw new Error(r.error.message);
  DS = r.data || [];
}

// ── Danh sách ──────────────────────────────────────────────────────────────
function veLocDs(){
  const loai = $('fLoai').value, fm = $('fMay'), cu = fm.value;
  fm.innerHTML = '<option value="">Mọi máy</option>' + MAY.filter(m => !loai || loaiMay(m.ma_may) === loai)
    .map(m => '<option' + (m.ma_may === cu ? ' selected' : '') + '>' + esc(m.ma_may) + '</option>').join('');
  const n = DS.filter(toiCho).length;
  $('chipToi').hidden = !(quyen.lap || quyen.kiem || quyen.duyet);
  $('nToi').textContent = n || '';
}
function dongDs(){
  const loai = $('fLoai').value, may = $('fMay').value, tt = $('fTt').value, q = $('fQ').value.trim().toUpperCase();
  const toi = $('chipToi').classList.contains('on');
  const hopMay = m => (!may || m === may) && (!loai || loaiMay(m) === loai);
  let rows;
  if (tt === 'chua') {
    rows = [];
    MAY.filter(m => hopMay(m.ma_may)).forEach(m => (m.ma_sp_dung || []).forEach(sp => {
      if (DS.some(p => p.ma_may === m.ma_may && p.ma_sp === sp && p.trang_thai === 'hieu_luc')) return;
      const mo = DS.find(p => p.ma_may === m.ma_may && p.ma_sp === sp && ['nhap', 'cho_kiem', 'cho_duyet'].includes(p.trang_thai));
      rows.push(mo || { ao: true, ma_may: m.ma_may, ma_sp: sp, trang_thai: 'chua' });
    }));
  } else {
    rows = DS.filter(p => hopMay(p.ma_may) && (tt === 'tat' || (tt === '' ? p.trang_thai !== 'het_hieu_luc' : p.trang_thai === tt)));
  }
  if (toi) rows = rows.filter(p => !p.ao && toiCho(p));
  if (q) rows = rows.filter(p => p.ma_sp.includes(q));
  return rows.sort((a, b) => a.ma_may.localeCompare(b.ma_may, 'vi', { numeric: true }) || a.ma_sp.localeCompare(b.ma_sp) || ((b.lan || 0) - (a.lan || 0)));
}
function veDs(){
  const rows = dongDs();
  $('dsTitle').textContent = 'Danh sách (' + rows.length + ')';
  const tb = $('tbody');
  if (!rows.length) { tb.innerHTML = '<tr><td colspan="6" class="empty">Không có phiếu nào.</td></tr>'; return; }
  tb.innerHTML = rows.map(p => {
    const href = p.ao ? (quyen.lap ? 'moi=1&ma_may=' + encodeURIComponent(p.ma_may) + '&ma_sp=' + encodeURIComponent(p.ma_sp) : '') : 'id=' + p.id;
    return '<tr class="row" data-href="' + esc(href) + '">' +
      '<td class="nw"><b>' + esc(p.ma_may) + '</b></td>' +
      '<td class="nw">' + esc(p.ma_sp) + '<small>' + esc(SP.get(p.ma_sp) || '') + '</small></td>' +
      '<td>' + (p.lan || '') + '</td>' +
      '<td>' + ttHtml(p.trang_thai) + (p.ao && quyen.lap ? ' <small>Bấm để lập</small>' : '') + (!p.ao && toiCho(p) ? '<small class="toi">Chờ bạn</small>' : '') + '</td>' +
      '<td class="hide-m nw">' + esc(fmtNgay(p.hieu_luc_tu)) + '</td>' +
      '<td class="hide-m">' + esc(p.ao ? '' : nguoiLap(p)) + '</td></tr>';
  }).join('');
}

// ── Xem phiếu ──────────────────────────────────────────────────────────────
async function taiPhieu(id){
  const [p, g, d] = await Promise.all([
    sb.from('duc_dk_phieu').select('*').eq('id', id).maybeSingle(),
    sb.from('duc_dk_gia_tri').select('*').eq('id_phieu', id),
    sb.from('duc_dk_dung_cu').select('*').eq('id_phieu', id),
  ]);
  const loi = [p, g, d].find(r => r.error);
  if (loi) throw new Error(loi.error.message);
  if (!p.data) return null;
  const ph = p.data;
  ph.gt = {}; (g.data || []).forEach(r => { ph.gt[r.ma_ts] = r; });
  ph.dc = {}; (d.data || []).forEach(r => { ph.dc[r.loai] = r.ma_dung_cu; });
  return ph;
}
function hienDong(t, gt){ return !t.phu_thuoc || (gt[t.phu_thuoc] && gt[t.phu_thuoc].gia_tri_chu === 'co'); }
function giaTriTho(t, p){   // chữ thô (chưa esc)
  const g = p.gt[t.ma_ts];
  if (t.kieu === 'chon_nvl') return p.ma_nvl || '';
  if (!g) return '';
  if (t.kieu === 'co_khong') return g.gia_tri_chu === 'co' ? 'Có' : g.gia_tri_chu === 'khong' ? 'Không' : '';
  if (t.kieu === 'so') return soVi(g.chuan);
  return g.gia_tri_chu || '';
}
function giaTriXem(t, p){ return esc(giaTriTho(t, p)); }
function bangXem(p, loai){
  return '<div class="luoi">' + Object.keys(NHOM).map(nh => {
    const ds = tsApDung(loai).filter(t => t.nhom === nh && hienDong(t, p.gt));
    if (!ds.length) return '';
    return '<section class="card" style="padding:8px"><div class="card-title">' + nh + ' · ' + esc(NHOM[nh]) + '</div><div class="tw"><table class="ts">' +
      '<thead><tr><th>Thông số</th><th>Chuẩn</th><th>ĐV</th><th>Cho phép</th></tr></thead><tbody>' +
      ds.map(t => {
        const g = p.gt[t.ma_ts], v = g && t.kieu === 'so' ? Number(g.chuan) : null, gy = goiYChu(t, loai);
        const ngoai = t.kieu === 'so' && g && g.chuan != null && ngoaiGoiY(t, loai, v);
        return '<tr><td><span class="ma">' + t.ma_ts + '</span>' + esc(t.ten) + (batBuoc(t, loai) ? ' <span class="bb">*</span>' : '') +
            (gy ? '<i class="i" data-gy="' + esc(gy) + '">i</i>' : '') + (g && g.ghi_chu ? '<small class="hint">' + esc(g.ghi_chu) + '</small>' : '') + '</td>' +
          '<td class="' + (t.kieu === 'so' ? 'so' : 'gt') + (ngoai ? ' ngoai' : '') + '"' + (ngoai ? ' title="' + esc(gy) + '"' : '') + '>' + (giaTriXem(t, p) || '<span style="color:var(--text-dim)">—</span>') + '</td>' +
          '<td>' + esc(t.don_vi || '') + '</td>' +
          '<td class="cp">' + (t.kieu === 'so' && g && g.chuan != null ? esc(choPhep(t, v)) : '') + '</td></tr>';
      }).join('') + '</tbody></table></div></section>';
  }).join('') + '</div>';
}
function nguoiBuoc(p){
  return {
    lap: lsCuoi(p, ['gui']) || lsCuoi(p, ['lap', 'lan_moi']),
    kiem: ['cho_duyet', 'hieu_luc', 'het_hieu_luc'].includes(p.trang_thai) ? lsCuoi(p, ['kiem_dong_y']) : null,
    duyet: ['hieu_luc', 'het_hieu_luc'].includes(p.trang_thai) ? lsCuoi(p, ['duyet_dong_y']) : null,
  };
}
function buocHtml(p){
  const { lap, kiem, duyet } = nguoiBuoc(p);
  const o = (ten, e, xong, dang) => '<div class="b' + (xong ? ' xong' : dang ? ' dang' : '') + '"><b>' + (xong ? '✓ ' : '') + ten + '</b>' +
    (e ? '<small>' + esc(e.nguoi || '') + '</small><small>' + esc(fmtTs(e.luc)) + '</small>' : '<small>' + (dang ? 'Đang chờ' : '—') + '</small>') + '</div>';
  const daGui = p.trang_thai !== 'nhap';
  return '<div class="buoc">' + o('Lập', lap, daGui, !daGui) + o('Kiểm tra', kiem, !!kiem, p.trang_thai === 'cho_kiem') + o('Duyệt', duyet, !!duyet, p.trang_thai === 'cho_duyet') + '</div>';
}
function dcXem(p, loai){
  const ds = DC_THEO_LOAI[loai].filter(l => p.dc[l] || DC_BB[loai].includes(l));
  return '<div class="dc">' + ds.map(l => {
    const u = DC.find(x => x.ma === p.dc[l]);
    return '<div class="o"><b>' + LOAI_DC[l] + (DC_BB[loai].includes(l) ? ' *' : '') + '</b>' +
      (u ? '<span style="font-weight:700">' + esc(u.ma) + '</span> <span class="hint">Φ' + esc(soVi(u.duong_kinh)) + (u.chieu_dai ? ' · dài ' + esc(soVi(u.chieu_dai)) : '') + '</span>'
         : '<span style="color:var(--text-dim)">—</span>') + '</div>';

function anhTepXem(p){
  const a = (p.anh || []).map(u => '<div class="t"><img src="' + esc(u) + '" alt="" loading="lazy" data-anh="' + esc(u) + '"></div>').join('');
  const t = (p.tep || []).map(u => '<a href="' + esc(u) + '" target="_blank" rel="noopener">📎 ' + esc(tenTep(u)) + '</a>').join('');

function tenTep(u){ try { return decodeURIComponent(u.split('/').pop()).replace(/^[a-z0-9]+_[a-z0-9]{4}_/, ''); } catch (e) { return u; } }
async function veXem(id){

  else if ((choKiem || choDuyet) && p.nguoi_lap === uid)

  if (p.trang_thai === 'nhap') {
    const { data: th } = await sb.rpc('duc_dk_kiem_thieu', { p_id: p.id });
    if (th && th.length) hop += '<div class="hop vang"><span class="t">Còn thiếu / sai trước khi Gửi (' + th.length + ')</span><ul>' + th.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>';
  }
  v.innerHTML =

      '<span class="loai">' + tenLoai(loai) + ' · Lần ' + p.lan + (p.hieu_luc_tu ? ' · Hiệu lực từ ' + esc(fmtNgay(p.hieu_luc_tu)) : '') + '</span><span class="sp"></span>' +
      '<div class="nut">' + nut + '</div></div>' +

      buocHtml(p) + hop +

    if (act === 'xlsx') return xuatExcel(p).catch(err => showMsg('⛔ ' + (err.message || err), 'err'));

async function gui(p){
  if (!(await hoiXacNhan('Gửi phiếu ' + p.ma_may + ' · ' + p.ma_sp + ' (lần ' + p.lan + ') cho QLBP Đúc kiểm tra?', { nutOk: 'Gửi' }))) return;
  const { error } = await sb.rpc('duc_dk_gui', { p_id: p.id });
  if (error) return showMsg('⛔ ' + error.message, 'err');
  showMsg('✅ Đã gửi — QLBP Đúc được báo.');
  await taiDs(); veXem(p.id);
}
async function huyNhap(p){
  if (!(await hoiXacNhan('Xoá nháp ' + p.ma_may + ' · ' + p.ma_sp + ' (lần ' + p.lan + ')?', { nutOk: 'Xoá', nguyHiem: true }))) return;
  const { error } = await sb.rpc('duc_dk_huy_nhap', { p_id: p.id });
  if (error) return showMsg('⛔ ' + error.message, 'err');
  showMsg('Đã xoá nháp.');
  await taiDs(); urlDi('');
}
async function kiemDuyet(p, dongY){
  const laKiem = p.trang_thai === 'cho_kiem', viec = laKiem ? 'kiểm tra' : 'duyệt';
  const nd = p.ma_may + ' · ' + p.ma_sp + ' (lần ' + p.lan + ')';
  const gc = await hoiGhiChuDuyet(nd, dongY
    ? { tieuDe: 'Đồng ý ' + viec, nutOk: 'Đồng ý' }
    : { tieuDe: 'Trả lại phiếu', nutOk: 'Trả lại', nguyHiem: true, batBuoc: true, goiY: 'Lý do trả lại (bắt buộc)' });
  if (gc == null) return;
  const { error } = await sb.rpc(laKiem ? 'duc_dk_kiem' : 'duc_dk_duyet', { p_id: p.id, p_dong_y: dongY, p_ghi_chu: gc || null });
  if (error) return showMsg('⛔ ' + error.message, 'err');
  showMsg(!dongY ? 'Đã trả lại — người lập được báo.' : laKiem ? '✅ Đã kiểm tra — GĐSX được báo.' : '✅ Phiếu đã hiệu lực.');
  await taiDs(); veXem(p.id);
}

// ── Lập / sửa ──────────────────────────────────────────────────────────────
function dsSpMay(ma){ const m = MAY.find(x => x.ma_may === ma); return m ? (m.ma_sp_dung || []) : []; }
async function veSua(id, maMay, maSp){
  const v = $('vPhieu');
  if (!quyen.lap) { v.innerHTML = '<section class="card"><div class="empty">Chỉ bộ phận Kỹ thuật (hoặc admin) lập / sửa phiếu.</div></section>'; return; }
  if (id) {
    const p = await taiPhieu(id);
    if (!p) { v.innerHTML = '<section class="card"><div class="empty">Không tìm thấy phiếu.</div></section>'; return; }
    if (p.trang_thai !== 'nhap') { showMsg('Phiếu không còn là nháp — không sửa được.', 'err'); return urlDi('id=' + id); }
    ed = p;
  } else {
    ed = { id: null, ma_may: maMay || '', ma_sp: maSp || '', lan: null, ly_do: '', ma_nvl: null, anh: [], tep: [], gt: {}, dc: {} };
  }
  veForm();
}
function veForm(){
  const v = $('vPhieu'), p = ed, moi = !p.id;

function nenAnh(file){   // giống shared/su-co-anh.js: JPEG ≤1280px, chất lượng 0,82
  return new Promise((resolve, reject) => {
    const rd = new FileReader();
    rd.onerror = reject;
    rd.onload = ev => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const k = Math.min(1, 1280 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b => b ? resolve(b) : reject(new Error('Không nén được ảnh')), 'image/jpeg', 0.82);
      };
      img.src = ev.target.result;
    };
    rd.readAsDataURL(file);
  });
}

      ds.map(t => {
        const g = p.gt[t.ma_ts], v = t.kieu === 'so' && g && g.chuan != null ? Number(g.chuan) : null;
        return '<tr><td>' + t.ma_ts + ' ' + esc(t.ten) + (batBuoc(t, loai) ? ' *' : '') + (g && g.ghi_chu ? '<div class="in-ghi">' + esc(g.ghi_chu) + '</div>' : '') + '</td>' +
          '<td class="r">' + giaTriXem(t, p) + '</td><td class="n">' + esc(t.don_vi || '') + '</td><td class="n">' + (v != null ? esc(choPhep(t, v).replace(/ \(.*\)$/, '')) : '') + '</td></tr>';
      }).join('') + '</tbody></table>';
  }).join('');
  const dc = DC_THEO_LOAI[loai].filter(l => p.dc[l]).map(l => LOAI_DC[l] + ': ' + p.dc[l]).join(' · ');
  const ky = (ten, e) => '<div class="ky"><b>' + ten + '</b><div class="cho"></div><div>' + esc(e ? e.nguoi || '' : '') + '</div><small>' + esc(e ? fmtTs(e.luc) : '') + '</small></div>';
  $('vIn').innerHTML =
    '<div class="in-dau"><div><small>TOYOTAKI</small><h1>PHIẾU ĐIỀU KIỆN ĐÚC</h1></div><div class="in-so">' + esc(p.ma_may) + ' · ' + esc(p.ma_sp) + '<br>Lần ' + p.lan + ' · ' + esc(TT[p.trang_thai] || '') + '</div></div>' +
    '<table class="in-tt"><tr><th>Máy</th><td>' + esc(p.ma_may) + ' (' + tenLoai(loai) + ')</td><th>Hiệu lực từ</th><td>' + esc(fmtNgay(p.hieu_luc_tu)) + '</td></tr>' +
      '<tr><th>Mã SP</th><td>' + esc(p.ma_sp) + '</td><th>Tên SP</th><td>' + esc(SP.get(p.ma_sp) || '') + '</td></tr>' +
      '<tr><th>Dụng cụ</th><td colspan="3">' + esc(dc) + '</td></tr>' +
      (p.ly_do ? '<tr><th>Lý do</th><td colspan="3">' + esc(p.ly_do) + '</td></tr>' : '') + '</table>' +
    (p.trang_thai !== 'hieu_luc' ? '<div class="in-chua">BẢN ' + esc((TT[p.trang_thai] || '').toUpperCase()) + ' — KHÔNG DÙNG ĐỂ SẢN XUẤT</div>' : '') +
    '<div class="in-luoi">' + nhomHtml + '</div>' +
    '<div class="in-ghi">* bắt buộc · Cho phép = Chuẩn ± ngưỡng (mặc định 5%)</div>' +
    '<div class="in-ky">' + ky('Lập', nb.lap) + ky('Kiểm tra', nb.kiem) + ky('Duyệt', nb.duyet) + '</div>' +
    '<div class="in-chan">In lúc ' + esc(fmtTs(new Date())) + ' · MES Toyotaki</div>';
  window.print();
}

// Excel (SheetJS, tải khi cần). File xuất 1 phiếu cũng là mẫu để nhập lại.
let xlsxHua = null;
function napXlsx(){
  if (window.XLSX) return Promise.resolve();
  if (!xlsxHua) xlsxHua = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = res; s.onerror = () => { xlsxHua = null; rej(new Error('Không tải được thư viện Excel — kiểm tra mạng.')); };
    document.head.appendChild(s);
  });
  return xlsxHua;
}
const NHAN_XLSX = { may: 'Máy', sp: 'Mã SP', ly_do: 'Lý do ban hành' };
async function xuatExcel(p){
  if (!p.ma_may) return showMsg('Chọn Máy trước.', 'err');
  await napXlsx();
  const loai = loaiMay(p.ma_may) || 'nhom', nb = nguoiBuoc(p);
  const r = [
    ['PHIẾU ĐIỀU KIỆN ĐÚC — TOYOTAKI'],
    [NHAN_XLSX.may, p.ma_may], [NHAN_XLSX.sp, p.ma_sp || ''], ['Tên SP', SP.get(p.ma_sp) || ''], ['Loại máy', tenLoai(loai)],
    ['Lần', p.lan || ''], ['Trạng thái', p.id ? (TT[p.trang_thai] || '') : 'Mẫu'], [NHAN_XLSX.ly_do, p.ly_do || ''],
    [],
    ['Mã', 'Nhóm', 'Thông số', 'Chuẩn', 'ĐV', 'Cho phép', 'Gợi ý HPDC', 'Bắt buộc', 'Ghi chú'],
  ];
  tsApDung(loai).forEach(t => {
    const g = p.gt[t.ma_ts];
    const val = t.kieu === 'so' ? (g && g.chuan != null ? Number(g.chuan) : '') : giaTriTho(t, p);
    const pt = t.phu_thuoc ? TS.find(x => x.ma_ts === t.phu_thuoc) : null;
    r.push([t.ma_ts, NHOM[t.nhom], t.ten + (t.kieu === 'co_khong' ? ' (Có / Không)' : '') + (pt ? ' — khi ' + pt.ma_ts + ' = Có' : ''),
      val, t.don_vi || '', t.kieu === 'so' && val !== '' ? choPhep(t, val) : '', goiYChu(t, loai).replace('Gợi ý HPDC ', ''),
      batBuoc(t, loai) ? '*' : '', (g && g.ghi_chu) || '']);
  });
  r.push([]);
  r.push(['Loại', 'Dụng cụ', 'Mã dụng cụ', '', '', 'Mã dùng được cho máy']);
  DC_THEO_LOAI[loai].forEach(l => r.push([l, LOAI_DC[l] + (DC_BB[loai].includes(l) ? ' *' : ''), p.dc[l] || '', '', '',
    DC.filter(u => u.loai === l && u.hien && (u.may_dung || []).includes(p.ma_may)).map(u => u.ma).join(', ')]));
  if (p.id) {
    r.push([]);
    [['Lập', nb.lap], ['Kiểm tra', nb.kiem], ['Duyệt', nb.duyet]].forEach(([ten, e]) => r.push([ten, e ? e.nguoi || '' : '', e ? fmtTs(e.luc) : '']));
  }
  const ws = XLSX.utils.aoa_to_sheet(r);
  ws['!cols'] = [{ wch: 14 }, { wch: 20 }, { wch: 44 }, { wch: 14 }, { wch: 8 }, { wch: 22 }, { wch: 18 }, { wch: 9 }, { wch: 30 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'DK duc');
  const ten = ('DK_duc_' + p.ma_may + '_' + (p.ma_sp || 'mau') + (p.lan ? '_lan' + p.lan : '')).replace(/[^A-Za-z0-9_-]/g, '_');
  XLSX.writeFile(wb, ten + '.xlsx');
}
async function nhapExcel(file){
  await napXlsx();
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' });
  const tsMa = new Map(TS.map(t => [t.ma_ts, t]));
  const nhan = {}, gt = {}, dc = {};
  rows.forEach(r => {
    const a = String(r[0] ?? '').trim(), A = a.toUpperCase();
    if (Object.values(NHAN_XLSX).includes(a)) nhan[a] = String(r[1] ?? '').trim();
    else if (tsMa.has(A)) gt[A] = { v: r[3], gc: String(r[8] ?? '').trim() };
    else if (LOAI_DC[A]) dc[A] = String(r[2] ?? '').trim().toUpperCase();
  });
  if (!Object.keys(gt).length) throw new Error('File không đúng mẫu — không thấy mã thông số (VL01, PE01…) ở cột A. Bấm "Mẫu Excel" để lấy file mẫu.');
  docForm();
  const fMay = nhan[NHAN_XLSX.may] || '', fSp = (nhan[NHAN_XLSX.sp] || '').toUpperCase();
  if (ed.id) {
    if ((fMay && fMay !== ed.ma_may) || (fSp && fSp !== ed.ma_sp)) throw new Error('File là ' + (fMay || '?') + ' · ' + (fSp || '?') + ', khác phiếu đang sửa ' + ed.ma_may + ' · ' + ed.ma_sp + '.');
  } else {
    if (fMay) { if (!loaiMay(fMay)) throw new Error('Máy "' + fMay + '" trong file không phải máy Đúc nhôm / Đúc kẽm.'); if (fMay !== ed.ma_may) ed.dc = {}; ed.ma_may = fMay; }
    if (fSp) { if (!SP.has(fSp)) throw new Error('Mã SP "' + fSp + '" trong file không có trong danh mục.'); ed.ma_sp = fSp; }
    if (!ed.ma_may) throw new Error('File chưa ghi Máy — chọn Máy trên form rồi nhập lại.');
    const mo = ed.ma_sp && DS.find(x => x.ma_may === ed.ma_may && x.ma_sp === ed.ma_sp && ['nhap', 'cho_kiem', 'cho_duyet'].includes(x.trang_thai));
    if (mo) throw new Error(ed.ma_may + ' · ' + ed.ma_sp + ' đang có lần ' + mo.lan + ' (' + TT[mo.trang_thai] + ')' + (mo.trang_thai === 'nhap' ? ' — mở nháp đó rồi Nhập Excel.' : ' — chờ xử lý xong.'));
  }
  if (nhan[NHAN_XLSX.ly_do]) ed.ly_do = nhan[NHAN_XLSX.ly_do];
  const loai = loaiMay(ed.ma_may), cb = [];
  let n = 0;
  for (const [ma, o] of Object.entries(gt)) {
    const t = tsMa.get(ma);
    if (t.ap_dung !== 'ca_hai' && t.ap_dung !== loai) continue;
    const s = String(o.v ?? '').trim();
    if (t.kieu === 'chon_nvl') {
      if (!s) ed.ma_nvl = null;
      else if (NVL.some(x => x.ma_nvl === s)) { ed.ma_nvl = s; n++; }
      else cb.push(ma + ': mã NVL "' + s + '" không có trong danh mục');
      continue;
    }
    const g = { ma_ts: ma, ghi_chu: o.gc || null, chuan: null, gia_tri_chu: null };
    if (t.kieu === 'so') {
      if (s !== '') {
        const v = typeof o.v === 'number' ? o.v : docSo(s);
        if (isNaN(v)) { cb.push(ma + ': "' + s + '" không phải số — bỏ qua'); continue; }
        g.chuan = v;
      }
    } else if (t.kieu === 'co_khong') {
      const l = s.toLowerCase();
      g.gia_tri_chu = ['có', 'co', 'x', '1', 'true'].includes(l) ? 'co' : ['không', 'khong', '0', 'false'].includes(l) ? 'khong' : null;
      if (s && !g.gia_tri_chu) { cb.push(ma + ': "' + s + '" — ghi Có hoặc Không'); continue; }
    } else g.gia_tri_chu = s || null;
    ed.gt[ma] = g;
    if (g.chuan != null || g.gia_tri_chu) n++;
  }
  DC_THEO_LOAI[loai].forEach(l => {
    if (!(l in dc)) return;
    const m = dc[l];
    if (!m) { delete ed.dc[l]; return; }
    const u = DC.find(x => x.ma === m && x.loai === l);
    if (!u) { cb.push(LOAI_DC[l] + ' ' + m + ' không có trong danh mục'); return; }
    ed.dc[l] = m;
    if (!(u.may_dung || []).includes(ed.ma_may)) cb.push(m + ' chưa ghi dùng được cho ' + ed.ma_may);
  });
  veForm();
  showMsg((cb.length ? '⚠ ' : '✅ ') + 'Đã điền ' + n + ' thông số từ Excel — xem lại rồi bấm Lưu.' + (cb.length ? '\n• ' + cb.join('\n• ') : ''), cb.length ? 'err' : 'ok');
}
$('fileXlsx').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || !ed) return;
  try { await nhapExcel(f); } catch (err) { showMsg('⛔ ' + (err.message || err), 'err'); }
});

// ── Điều hướng ─────────────────────────────────────────────────────────────
async function route(){
  const P = new URLSearchParams(location.search);
  let id = P.get('id') ? Number(P.get('id')) : null;
  const moi = P.get('moi'), sua = P.get('sua'), ss = P.get('ss') ? Number(P.get('ss')) : null;
  if (ss && P.get('voi')) {
    $('hDs').hidden = false; $('vDs').hidden = true; $('vPhieu').hidden = false; ed = null;
    try { await veSoSanh(ss, Number(P.get('voi'))); window.scrollTo(0, 0); } catch (e) { showMsg('⛔ ' + (e.message || e), 'err'); }
    return;
  }
  if (!id && !moi && P.get('ma_may') && P.get('ma_sp')) {
    const cap = DS.filter(x => x.ma_may === P.get('ma_may') && x.ma_sp === P.get('ma_sp').toUpperCase()).sort((a, b) => b.lan - a.lan);
    const hl = cap.find(x => x.trang_thai === 'hieu_luc') || cap[0];
    if (hl) id = hl.id;
    else {
      $('vDs').hidden = true; $('vPhieu').hidden = false;
      $('vPhieu').innerHTML = '<section class="card"><div class="empty">' + esc(P.get('ma_may')) + ' · ' + esc(P.get('ma_sp')) + ' chưa có phiếu điều kiện đúc.' +
        (quyen.lap ? '<div style="margin-top:10px"><a class="btn" href="?moi=1&ma_may=' + encodeURIComponent(P.get('ma_may')) + '&ma_sp=' + encodeURIComponent(P.get('ma_sp')) + '">＋ Lập</a></div>' : '') + '</div></section>';
      return;
    }
  }
  $('hDs').hidden = !(id || moi);
  try {
    if (moi || (id && sua)) {
      $('vDs').hidden = true; $('vPhieu').hidden = false;
      await veSua(moi ? null : id, P.get('ma_may'), (P.get('ma_sp') || '').toUpperCase());
      if (moi && ed && ed.ma_may && ed.ma_sp) kiemCapMo();
    } else if (id) {
      $('vDs').hidden = true; $('vPhieu').hidden = false; ed = null;
      await veXem(id);
    } else {
      $('vPhieu').hidden = true; $('vDs').hidden = false; ed = null;
      veLocDs(); veDs();
    }
    window.scrollTo(0, 0);
  } catch (e) { showMsg('⛔ ' + (e.message || e), 'err'); }
}

  const a = e.target.closest('[data-href]');
  if (a) { e.preventDefault(); if (a.dataset.href) urlDi(a.dataset.href); return; }
  const h = e.target.closest('#hDs, #hLap');
  if (h && !e.ctrlKey && !e.metaKey) { e.preventDefault(); urlDi(h.id === 'hLap' ? 'moi=1' : ''); return; }
  if (e.target.closest('#chipToi')) { $('chipToi').classList.toggle('on'); veDs(); }
});
$('fLoai').addEventListener('change', () => { veLocDs(); veDs(); });
['fMay', 'fTt'].forEach(i => $(i).addEventListener('change', veDs));
$('fQ').addEventListener('input', veDs);
(async () => {
  try { await taiChung(); await taiDs(); }
  catch (e) { $('tbody').innerHTML = '<tr><td colspan="6" class="empty">Lỗi tải: ' + esc(e.message) + '</td></tr>'; $('vDs').hidden = false; return; }
  route();
})();
