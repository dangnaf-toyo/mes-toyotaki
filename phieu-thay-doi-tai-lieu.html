<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lập phiếu thay đổi tài liệu — Toyotaki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"></noscript>

<!--
  ============================================================================
  phieu-thay-doi-tai-lieu.html — T63. Lập phiếu thay đổi tài liệu (DCR):
  tạo mới / sửa đổi / huỷ 1 tài liệu, trả lời 3 câu hỏi leo thang (T1/T2/T3a)
  + "bản chất thay đổi" (T3b gộp cho cấp 1-4, hoặc "đổi nội dung kỹ thuật"
  cho tài liệu kỹ thuật), tính tầng rủi ro A/B/C ngay trên client để xem
  trước, rồi gọi RPC dcr_submit (server tính lại tầng, không tin client).

  Query params:
    ?category_id=X&loai=tao_moi           — tạo tài liệu mới thuộc category X
    ?document_id=Y&loai=sua_doi            — sửa đổi tài liệu Y đã có
    ?document_id=Y&loai=huy                — đề nghị huỷ tài liệu Y
  ============================================================================
-->

<style>
:root{--bg-page:#EEF1F5;--bg-panel:#FFFFFF;--bg-sunken:#F5F7FA;--bg-header:#1E293B;--border:#D9DFE5;--border-strong:#B8C1CC;--text:#0F172A;--text-muted:#64748B;--text-dim:#94A3B8;--accent:#0F5FA5;--accent-hover:#0A4681;--run-fg:#047857;--run-bg:#ECFDF5;--warn-fg:#B45309;--warn-bg:#FFFBEB;--alarm-fg:#B91C1C;--alarm-bg:#FEF2F2;--shadow-sm:0 1px 2px rgba(15,23,42,0.04);--shadow-md:0 4px 12px rgba(15,23,42,0.08);--shadow-lg:0 12px 32px rgba(15,23,42,0.16);}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg-page);color:var(--text);font-size:13px;line-height:1.35;-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;min-height:100vh;padding:6px;gap:6px}
header{background:var(--bg-header);color:#F1F5F9;border-radius:8px;padding:6px 14px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-sm);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand .co{font-size:9px;letter-spacing:.08em;color:#94A3B8;text-transform:uppercase;font-weight:500}
.brand .title{font-size:14px;font-weight:700;letter-spacing:-.01em;color:#FFF}
.brand .sub{font-size:11px;color:#94A3B8}
.header-clock{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;padding:0 10px;line-height:1.15}
.header-clock .date{font-size:10px;color:#94A3B8}
.header-clock .time{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:#FFF;letter-spacing:-.02em}
.btn{padding:6px 12px;border-radius:5px;border:none;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:background .12s;display:inline-flex;align-items:center;gap:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#FFF}
.btn-primary:hover:not(:disabled){background:var(--accent-hover)}
.btn-ghost{background:transparent;color:#F1F5F9;border:1px solid #475569}
.btn-ghost:hover:not(:disabled){background:#334155}
.btn-outline{background:transparent;border:1px solid var(--border-strong);color:var(--text);padding:5px 10px;border-radius:5px;font-family:inherit;font-size:11px;font-weight:500;cursor:pointer}
.btn-outline:hover{background:var(--bg-sunken)}

.main{display:flex;gap:6px;flex:1;min-height:0}
.panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;min-height:0}
.panel-head{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-head h2{font-size:13px;font-weight:700}
.panel-body{flex:1;overflow-y:auto;padding:14px}

.col-form{flex:1;min-width:0}
.col-preview{flex:0 0 320px}

.field{margin-bottom:14px}
.field label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:5px}
.field input[type=text],.field textarea,.field select{width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:6px;font-family:inherit;font-size:12.5px;outline:none}
.field input:disabled{background:var(--bg-sunken);color:var(--text-muted)}
.field textarea{resize:vertical;min-height:60px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,95,165,.1)}
.hint{font-size:11px;color:var(--text-dim);margin-top:4px}

.readonly-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.readonly-row .field{flex:1;min-width:180px;margin-bottom:0}

.radio-group{display:flex;flex-direction:column;gap:8px}
.radio-opt{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--border);border-radius:7px;padding:9px 10px;cursor:pointer}
.radio-opt:hover{background:var(--bg-sunken)}
.radio-opt.checked{border-color:var(--accent);background:#EFF6FF}
.radio-opt input{margin-top:2px}
.radio-opt .txt{font-size:12.5px}

.check-item{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--border);border-radius:7px;padding:9px 10px;margin-bottom:8px;cursor:pointer}
.check-item:hover{background:var(--bg-sunken)}
.check-item.checked{border-color:var(--warn-fg);background:var(--warn-bg)}
.check-item input{margin-top:2px}
.check-item .txt{font-size:12.5px}
.check-item .sub{font-size:10.5px;color:var(--text-muted);margin-top:2px}

.section-title{font-size:12px;font-weight:700;margin:18px 0 8px;padding-top:10px;border-top:1px solid var(--border)}
.section-title:first-child{margin-top:0;padding-top:0;border-top:none}

.tier-badge{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace}
.tier-badge.A{background:var(--alarm-bg);color:var(--alarm-fg)}
.tier-badge.B{background:var(--warn-bg);color:var(--warn-fg)}
.tier-badge.C{background:var(--run-bg);color:var(--run-fg)}
.tier-box{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-sunken)}
.tier-box .desc{font-size:11.5px;color:var(--text-muted);line-height:1.5}
.tier-box .desc b{color:var(--text)}

.msg-inline{font-size:11.5px;color:var(--alarm-fg);margin-top:8px}
.toast{position:fixed;bottom:20px;right:20px;background:#0F172A;color:#F1F5F9;padding:10px 16px;border-radius:6px;font-size:12px;box-shadow:var(--shadow-lg);display:none;z-index:200;align-items:center;gap:10px;max-width:400px}
.toast.show{display:flex}
.toast.error{background:#B91C1C}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <div class="co">Toyotaki</div>
      <div class="title">📝 Lập phiếu thay đổi tài liệu</div>
      <div class="sub" id="hdrSub">—</div>
    </div>
    <button class="btn btn-ghost" onclick="window.location.href='danh-sach-phieu-thay-doi.html'">← Danh sách phiếu</button>
    <div class="header-clock">
      <span class="date" id="clock-date">—</span>
      <span class="time" id="clock-time">--:--:--</span>
    </div>
  </header>

  <div class="main">
    <div class="panel col-form">
      <div class="panel-head"><h2 id="formTitle">Phiếu thay đổi tài liệu</h2></div>
      <div class="panel-body" id="formBody">
        <div style="color:var(--text-dim);font-size:12px">Đang tải…</div>
      </div>
    </div>

    <div class="panel col-preview">
      <div class="panel-head"><h2>Xem trước phân tầng</h2></div>
      <div class="panel-body" id="previewBody">
        <div class="tier-box">
          <span class="tier-badge C" id="tierBadge">C</span>
          <div class="desc" id="tierDesc">Chưa tick câu hỏi nào → mặc định tầng C.</div>
        </div>
        <div style="margin-top:16px">
          <button class="btn btn-primary" id="submitBtn" style="width:100%;justify-content:center" onclick="submitDcr()" disabled>Nộp phiếu</button>
          <div class="msg-inline" id="submitMsg" style="display:none"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="toast-text"></span></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="shared/supabase-client.js"></script>
<script src="shared/navbar.js"></script>
<script>
function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let toastTimer;
function toast(text, isErr){
  const el = document.getElementById('toast');
  document.getElementById('toast-text').textContent = text;
  el.classList.toggle('error', !!isErr);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}
function startClock(){
  function tick(){
    const d = new Date();
    document.getElementById('clock-date').textContent = d.toLocaleDateString('vi-VN');
    document.getElementById('clock-time').textContent = d.toLocaleTimeString('vi-VN', { hour12: false });
  }
  tick(); setInterval(tick, 1000);
}

const params = new URLSearchParams(window.location.search);
const qCategoryId = params.get('category_id');
const qDocumentId = params.get('document_id');
const qLoai = params.get('loai') || 'tao_moi'; // tao_moi | sua_doi | huy

const LOAI_LABELS = { tao_moi: 'Tạo tài liệu mới', sua_doi: 'Sửa đổi tài liệu', huy: 'Đề nghị huỷ tài liệu' };

const state = {
  session: null,
  category: null,      // {id, ten, cap}
  document: null,       // {id, ten_tai_lieu, ma_sp, category_id} — null nếu tao_moi
  p1Threshold: null,    // ngưỡng chi phí P1 (vnd)
  answers: {
    t1: false, t2: false, t3a: false,
    doiNoiDung: false,        // radio "đổi lưu trình / đổi nội dung kỹ thuật"
    t3c: '',
  },
};

// ── Tính tầng client-side (chỉ để xem trước — server dcr_submit tự tính lại,
// không tin dữ liệu này). Công thức theo đặc tả: có T1 hoặc T2 hoặc T3a hoặc
// (không phải kỹ thuật và chọn "đổi lưu trình") hoặc có mã thay đổi liên
// quan → tầng A; ngược lại nếu chọn "đổi cách làm/tiêu chí…" → tầng B; còn
// lại → tầng C.
function computeEffectiveT3a(){
  // Mã thay đổi thiết kế/quá trình liên quan luôn kéo phiếu lên tầng A —
  // dcr_submit không có tham số riêng cho việc này nên ta gộp vào p_t3a
  // trước khi gọi RPC (xem submitDcr()).
  return state.answers.t3a || !!state.answers.t3c.trim();
}
function isNonTech(){ return state.category && state.category.cap !== 'ky_thuat'; }
function computeTier(){
  const t3a = computeEffectiveT3a();
  const t3b = isNonTech() && state.answers.doiNoiDung; // chỉ cấp 1-4 mới có T3b
  if (state.answers.t1 || state.answers.t2 || t3a || t3b) return 'A';
  if (state.answers.doiNoiDung) return 'B';
  return 'C';
}

const TIER_DESC = {
  A: (t1) => `<b>Tầng A</b> — rủi ro cao. Không cần xác nhận điểm sử dụng song song trước; duyệt tuần tự: Ban giám đốc${t1 ? ' → Khách hàng (đính kèm chứng từ)' : ''} → KSTL kiểm hình thức, cấp mã trước phát hành.`,
  B: () => `<b>Tầng B</b> — rủi ro trung bình. Các bộ phận có quyền trên loại tài liệu này xác nhận song song, sau đó Người duyệt được ủy quyền → KSTL kiểm hình thức.`,
  C: () => `<b>Tầng C</b> — rủi ro thấp. Không cần xác nhận điểm sử dụng, Người duyệt được ủy quyền duyệt nhanh 1 bước rồi phát hành.`,
};

function renderPreview(){
  const tier = computeTier();
  const badge = document.getElementById('tierBadge');
  badge.className = 'tier-badge ' + tier;
  badge.textContent = tier;
  document.getElementById('tierDesc').innerHTML = TIER_DESC[tier](state.answers.t1);
}

function renderRadioGroup(){
  const nonTech = isNonTech();
  const optA = nonTech
    ? 'Sửa câu chữ, thêm biểu mẫu, không đổi lưu trình'
    : 'Sửa câu chữ, định dạng, không đổi nội dung kỹ thuật';
  const optB = nonTech
    ? 'Đổi lưu trình hoặc trách nhiệm liên bộ phận'
    : 'Đổi cách làm, tiêu chí, thông số, tần suất, thứ tự thao tác';
  return `
    <div class="radio-group" id="radioGroup">
      <label class="radio-opt" data-val="false">
        <input type="radio" name="doiNoiDung" value="false" checked>
        <span class="txt">${escapeHtml(optA)}</span>
      </label>
      <label class="radio-opt" data-val="true">
        <input type="radio" name="doiNoiDung" value="true">
        <span class="txt">${escapeHtml(optB)}</span>
      </label>
    </div>`;
}

function renderForm(){
  const nonTech = isNonTech();
  const catName = state.category ? state.category.ten : '—';
  const maSp = state.document ? (state.document.ma_sp || '') : '';
  document.getElementById('formTitle').textContent = LOAI_LABELS[qLoai] || 'Phiếu thay đổi tài liệu';
  document.getElementById('hdrSub').textContent = (state.document ? state.document.ten_tai_lieu + ' — ' : '') + catName;

  const p1Text = state.p1Threshold != null ? (Number(state.p1Threshold).toLocaleString('vi-VN') + ' đ') : '—';

  document.getElementById('formBody').innerHTML = `
    <div class="readonly-row">
      <div class="field">
        <label>Loại tài liệu</label>
        <input type="text" value="${escapeHtml(catName)}" disabled>
      </div>
      ${state.document && state.document.ma_sp ? `
      <div class="field">
        <label>Mã sản phẩm</label>
        <input type="text" value="${escapeHtml(state.document.ma_sp)}" disabled>
      </div>` : ''}
      <div class="field">
        <label>Loại yêu cầu</label>
        <input type="text" value="${escapeHtml(LOAI_LABELS[qLoai] || qLoai)}" disabled>
      </div>
    </div>

    <div class="field">
      <label>Tiêu đề phiếu ${qLoai === 'tao_moi' ? '(cũng là tên tài liệu mới)' : ''} <span style="color:#DC2626">*</span></label>
      <input type="text" id="f-tieude" placeholder="VD: Cập nhật dung sai bản vẽ chi tiết A"
        value="${state.document ? escapeHtml('Sửa đổi: ' + state.document.ten_tai_lieu) : ''}">
    </div>

    ${qLoai === 'tao_moi' && state.category && state.category.cap === 'ky_thuat' ? `
    <div class="field">
      <label>Mã sản phẩm liên quan (nếu có)</label>
      <input type="text" id="f-masp" placeholder="Để trống nếu là tài liệu hệ thống không gắn mã SP">
    </div>` : ''}

    <div class="field">
      <label>Nội dung trước thay đổi</label>
      <textarea id="f-truoc" placeholder="Mô tả nội dung/hiện trạng trước khi thay đổi…"></textarea>
    </div>
    <div class="field">
      <label>Nội dung sau thay đổi</label>
      <textarea id="f-sau" placeholder="Mô tả nội dung/dự kiến sau khi thay đổi…"></textarea>
    </div>
    <div class="field">
      <label>Lý do thay đổi</label>
      <textarea id="f-lydo" placeholder="Lý do cần thay đổi…"></textarea>
    </div>

    <div class="section-title">Bản chất thay đổi</div>
    ${renderRadioGroup()}

    <div class="section-title">Câu hỏi leo thang</div>
    <label class="check-item" data-key="t1">
      <input type="checkbox" id="f-t1">
      <div><div class="txt">Khách hàng phải phê duyệt hoặc được thông báo trước khi áp dụng</div></div>
    </label>
    <label class="check-item" data-key="t2">
      <input type="checkbox" id="f-t2">
      <div><div class="txt">Chi phí phát sinh vượt ngưỡng do Ban giám đốc đặt</div>
        <div class="sub">Ngưỡng hiện tại: ${p1Text}</div></div>
    </label>
    <label class="check-item" data-key="t3a">
      <input type="checkbox" id="f-t3a">
      <div><div class="txt">Chạm đặc tính đặc biệt, an toàn hoặc luật định</div></div>
    </label>

    <div class="field" style="margin-top:14px">
      <label>Mã thay đổi thiết kế/quá trình liên quan (nếu có)</label>
      <input type="text" id="f-t3c" placeholder="VD: ECN-2026-014, WI-71103…">
      <div class="hint">Có giá trị ở ô này sẽ tự đẩy phiếu lên tầng A (coi như chạm đặc tính đặc biệt).</div>
    </div>
  `;

  // Wire events
  document.querySelectorAll('#radioGroup .radio-opt').forEach(opt => {
    opt.addEventListener('click', () => {
      document.querySelectorAll('#radioGroup .radio-opt').forEach(o => o.classList.remove('checked'));
      opt.classList.add('checked');
      opt.querySelector('input').checked = true;
      state.answers.doiNoiDung = opt.dataset.val === 'true';
      renderPreview();
    });
  });
  document.querySelector('#radioGroup .radio-opt[data-val="false"]').classList.add('checked');

  ['t1','t2','t3a'].forEach(key => {
    const cb = document.getElementById('f-' + key);
    const item = cb.closest('.check-item');
    cb.addEventListener('change', () => {
      state.answers[key] = cb.checked;
      item.classList.toggle('checked', cb.checked);
      renderPreview();
    });
  });
  document.getElementById('f-t3c').addEventListener('input', (e) => {
    state.answers.t3c = e.target.value;
    renderPreview();
  });

  document.getElementById('submitBtn').disabled = false;
  renderPreview();
}

async function loadP1(){
  const { data } = await sb.from('document_config_params').select('gia_tri').eq('ma', 'P1').maybeSingle();
  state.p1Threshold = data ? data.gia_tri : null;
}

async function loadContext(){
  await loadP1();

  if (qLoai === 'tao_moi'){
    if (!qCategoryId){ toast('Thiếu category_id để tạo tài liệu mới.', true); return false; }
    const { data, error } = await sb.from('doc_categories').select('id, ten, cap').eq('id', qCategoryId).maybeSingle();
    if (error || !data){ toast('Không tải được loại tài liệu.', true); return false; }
    state.category = data;
    return true;
  }

  if (!qDocumentId){ toast('Thiếu document_id.', true); return false; }
  const { data, error } = await sb.from('documents')
    .select('id, ten_tai_lieu, ma_sp, category_id, doc_categories(id, ten, cap)')
    .eq('id', qDocumentId).maybeSingle();
  if (error || !data){ toast('Không tải được tài liệu: ' + (error ? error.message : 'không tìm thấy'), true); return false; }
  state.document = { id: data.id, ten_tai_lieu: data.ten_tai_lieu, ma_sp: data.ma_sp, category_id: data.category_id };
  state.category = data.doc_categories;
  return true;
}

async function submitDcr(){
  const tieude = (document.getElementById('f-tieude').value || '').trim();
  const msg = document.getElementById('submitMsg');
  msg.style.display = 'none';
  if (!tieude){ msg.style.display = 'block'; msg.textContent = 'Cần nhập tiêu đề phiếu.'; return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;

  const nonTech = isNonTech();
  const t3b = nonTech && state.answers.doiNoiDung;
  // Gộp "mã thay đổi liên quan" (t3c) vào t3a để đảm bảo lên tầng A đúng đặc
  // tả — dcr_submit không có tham số riêng để tính tầng từ t3c, chỉ lưu nó
  // làm ghi chú tra ngược (t3c_ma_thay_doi).
  const effectiveT3a = computeEffectiveT3a();
  const maspEl = document.getElementById('f-masp');

  try {
    const { data, error } = await sb.rpc('dcr_submit', {
      p_document_id: state.document ? state.document.id : null,
      p_category_id: state.category.id,
      p_loai_yeu_cau: qLoai,
      p_tieu_de: tieude,
      p_ma_sp: maspEl ? (maspEl.value.trim() || null) : (state.document ? state.document.ma_sp : null),
      p_noi_dung_truoc: document.getElementById('f-truoc').value.trim() || null,
      p_noi_dung_sau: document.getElementById('f-sau').value.trim() || null,
      p_ly_do: document.getElementById('f-lydo').value.trim() || null,
      p_t1: state.answers.t1,
      p_t2: state.answers.t2,
      p_t3a: effectiveT3a,
      p_t3b: t3b,
      p_t3c_ma_thay_doi: state.answers.t3c.trim() || null,
      p_doi_noi_dung_ky_thuat: state.answers.doiNoiDung,
    });
    if (error) throw error;
    toast('Đã nộp phiếu.');
    window.location.href = 'phieu-thay-doi-chi-tiet.html?id=' + encodeURIComponent(data);
  } catch (e) {
    msg.style.display = 'block'; msg.textContent = 'Lỗi: ' + e.message;
    btn.disabled = false;
  }
}

async function main(){
  startClock();
  const session = await MesAuth.requireAuth();
  state.session = session;
  const ok = await loadContext();
  if (!ok) return;
  renderForm();
}
main();
</script>
