<html lang="vi">
<head>

<title>In Tem Đúc — TOYOTAKI</title>
<!--
  intem.html — bản web tĩnh (Supabase) thay Web App Google Apps Script
  "Intem QR" (D:\Project\MES\Intem QR\Code.gs + Index.html). Đọc công khai,
  GHI (in tem mới/lưu sửa/xoá) bắt buộc đăng nhập Supabase Auth.

  CẬP NHẬT 2026-08-14 (theo yêu cầu tối ưu hoá):
  1) Tách 2 tab riêng biệt: "In Tem" (tạo tem mới) và "Tra cứu Tem" (tìm tem
     đã in để xem/sửa/in lại/xoá) — trước đây gộp chung 1 form.
  2) Tra cứu tem: ngoài gõ tay Tag No, thêm quét QR trực tiếp bằng camera
     (jsQR + getUserMedia, cùng cách chuyencongdoan.html đã dùng) — tự tra
     cứu ngay khi đọc được mã, không cần gõ tay.
  3) "Nguyên liệu" tự điền theo master_products.nguyen_lieu khi chọn mã SP
     (cột mới, quản lý qua quan-ly-danh-muc.html tab Sản phẩm) — vẫn sửa tay
     được sau khi tự điền, không khoá cứng.
  4) Chủng loại "Sản phẩm đang phát triển" in tem nền đen chữ trắng (trước
     luôn nền trắng chữ đen bất kể chủng loại). Tag No tự phân biệt qua tiền
     tố D-TKD (đang phát triển) / TKD (hàng loạt) — dùng lại để suy ra chủng
     loại khi tra cứu/in lại tem cũ (KHÔNG có cột loai_sp riêng trong
     duc_tem, xem migration_phase4_step2_intem.sql).
  - Thư viện tạo mã QR (qrcode-generator) tải từ CDN, giữ nguyên 100% logic
    vẽ SVG (buildQrRects/buildLabelSvg) so với bản gốc.
  - Nhận prefill qua query string (?maSP=..&tenSP=..&mayDuc=..&nguoiTT=..&soKhuon=..)
    khi mở từ nút "🖨" trên duc-dashboard.html — đổ vào tab "In Tem".
-->
<style>

body{font-family:Arial,sans-serif;background:#f0f2f5;

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

label{font-size:11px;font-weight:700;color:#555;

<script>
var masterData = [];   // [{ma, ten, nguyenLieu}]
var masterMap = {};    // ma_sp -> {ten, nguyenLieu}
var currentTagNo = "";
var PREFILL = Object.fromEntries(new URLSearchParams(location.search));

function getTodayString(){
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function g(id){ return document.getElementById(id).value.trim(); }

// =============================================================================
// TABS
// =============================================================================
function switchTab(tab){
  const isPrint = tab === 'print';
  document.getElementById('tabBtnPrint').classList.toggle('active', isPrint);
  document.getElementById('tabBtnSearch').classList.toggle('active', !isPrint);
  document.getElementById('panelPrint').style.display = isPrint ? 'block' : 'none';
  document.getElementById('panelSearch').style.display = isPrint ? 'none' : 'block';
  if (!isPrint) { stopCamera(); }
}
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('tabBtnPrint').addEventListener('click', () => switchTab('print'));
  document.getElementById('tabBtnSearch').addEventListener('click', () => switchTab('search'));
});

// =============================================================================
// MASTER DATA
// =============================================================================
async function loadMaster(){
  const [prod, may, nv] = await Promise.all([
    sb.from('master_products').select('ma_sp,ten_sp,nguyen_lieu,so_khuon').order('ma_sp'),
    sb.from('master_machines').select('ma_may').order('ma_may'),
    sb.from('master_employees').select('ten_nhan_vien').order('ten_nhan_vien'),
  ]);
  if (prod.error) throw new Error('Không tải được danh mục SP: ' + prod.error.message);
  if (may.error) throw new Error('Không tải được danh mục máy: ' + may.error.message);
  if (nv.error) throw new Error('Không tải được danh mục nhân sự: ' + nv.error.message);

  masterData = (prod.data || []).map(r => ({ ma: r.ma_sp, ten: r.ten_sp || '', nguyenLieu: r.nguyen_lieu || '', soKhuon: r.so_khuon || '' }));
  masterMap = {};
  masterData.forEach(m => { masterMap[m.ma] = m; });
  buildSelects(masterData, (may.data||[]).map(r=>r.ma_may), (nv.data||[]).map(r=>r.ten_nhan_vien));
}

function fillOptions(sel, values, placeholder){
  sel.innerHTML = '<option value="">' + placeholder + '</option>';
  values.forEach(v => { sel.innerHTML += '<option value="' + v + '">' + v + '</option>'; });
}

function buildSelects(items, mays, nguois){
  ['maSP', 's_maSP'].forEach(id => {
    const sel = document.getElementById(id);
    sel.innerHTML = '<option value="">-- Chọn mã SP --</option>';
    items.forEach(item => { sel.innerHTML += '<option value="'+item.ma+'">'+item.ma+'</option>'; });
  });
  ['mayDuc', 's_mayDuc'].forEach(id => fillOptions(document.getElementById(id), mays, '-- Chọn máy --'));
  ['nguoiTT', 's_nguoiTT'].forEach(id => fillOptions(document.getElementById(id), nguois, '-- Chọn người --'));
}

/** prefix '' = tab In Tem, 's_' = tab Tra cứu — tự điền tên SP + nguyên liệu
    (khoá cứng, mỗi mã SP chỉ có đúng 1 nguyên liệu) + số khuôn (SP nào chạy
    nhiều khuôn cùng lúc thì hiện chip cho người dùng chọn 1 trong số đó). */
function onMaChange(prefix){
  var ma = document.getElementById(prefix + "maSP").value;
  var item = masterMap[ma];
  document.getElementById(prefix + "tenSP").value = item ? item.ten : "";
  document.getElementById(prefix + "nguyenLieu").value = item ? item.nguyenLieu : "";
  populateSoKhuonChips(prefix, item ? item.soKhuon : "");
}

/** Danh sách khuôn của 1 mã SP lưu dạng "KPH #13-14, KPH #15-16" (text, xem
    migration_phase_S7_sokhuon_real.sql) -- chỉ 1 khuôn thì điền thẳng vào ô,
    nhiều khuôn thì hiện chip để chọn (ô vẫn sửa tay được nếu cần khuôn khác). */
function populateSoKhuonChips(prefix, soKhuonRaw){
  var chipsEl = document.getElementById(prefix + "soKhuon-chips");
  var inputEl = document.getElementById(prefix + "soKhuon");
  var molds = String(soKhuonRaw || "").split(",").map(function(s){ return s.trim(); }).filter(Boolean);

  if (molds.length <= 1){
    chipsEl.innerHTML = "";
    inputEl.value = molds[0] || "";
    return;
  }

  chipsEl.innerHTML = molds.map(function(mk){
    return '<button type="button" class="chip-opt" data-mk="' + mk.replace(/"/g,'&quot;') + '">' + mk + '</button>';
  }).join("");
  [].forEach.call(chipsEl.querySelectorAll(".chip-opt"), function(btn){
    btn.addEventListener("click", function(){
      inputEl.value = btn.dataset.mk;
      [].forEach.call(chipsEl.querySelectorAll(".chip-opt"), function(b){ b.classList.toggle("sel", b === btn); });
    });
  });
  inputEl.value = molds[0];
  chipsEl.querySelector(".chip-opt").classList.add("sel");
}

function applyPrefill(){
  if (!PREFILL || !PREFILL.maSP) return;
  document.getElementById("maSP").value = PREFILL.maSP;
  onMaChange('');
  if (!document.getElementById("tenSP").value && PREFILL.tenSP) {
    document.getElementById("tenSP").value = PREFILL.tenSP;
  }
  if (PREFILL.soKhuon) document.getElementById("soKhuon").value = PREFILL.soKhuon;
  if (PREFILL.mayDuc)  document.getElementById("mayDuc").value = PREFILL.mayDuc;
  if (PREFILL.nguoiTT) document.getElementById("nguoiTT").value = PREFILL.nguoiTT;
  var slEl = document.getElementById("soLuong");
  if (slEl) slEl.focus();
}

// =============================================================================
// TRA CỨU TEM
// =============================================================================
/** Suy ra chủng loại từ tiền tố Tag No — duc_tem không có cột loai_sp riêng
    (xem migration_phase4_step2_intem.sql: D-TKD = đang phát triển, TKD = hàng loạt). */
function loaiSpFromTagNo(tagNo){
  return String(tagNo || '').toUpperCase().startsWith('D-TKD') ? 'phattrien' : 'hangloat';
}

function temRowToClient(r){
  return {
    tagNo: r.tag_no || "", tenSP: r.ten_sp || "", maSP: r.ma_sp || "",
    soLuong: r.so_luong || "", lotNo: r.lot || "", soKhuon: r.so_khuon || "",
    nguyenLieu: r.nguyen_lieu || "", mayDuc: r.may_duc_chi_thi || "",
    ghiChu: r.ghi_chu || "", nguoiTT: r.nguoi_tt || "",
    loaiSP: loaiSpFromTagNo(r.tag_no),
  };
}

function fillFormFromTem(t){
  if(!t) return;
  currentTagNo = t.tagNo || "";
  document.getElementById("searchTag").value = currentTagNo;

async function findTem(){
  var tagNo = g("searchTag");
  if(!tagNo) return err("Nhập Tag No để tra cứu");
  showMsg("⏳ Đang tra cứu tem...","wait");
  const { data, error } = await sb.from('duc_tem').select('*').ilike('tag_no', tagNo);
  if (error) return err("Lỗi tra cứu: " + error.message);
  if (!data || !data.length) return err("Không tìm thấy tem");
  fillFormFromTem(temRowToClient(data[0]));

  const realTagNo = data[0].tag_no;
  const { data: children } = await sb.from('duc_tem_tach').select('tag_no_con,so_luong_con,thoi_diem').eq('tag_no_cha', realTagNo).order('thoi_diem');
  var histEl = document.getElementById("tachHistoryHint");
  histEl.textContent = (children && children.length)
    ? "Đã tách: " + children.map(c => c.tag_no_con + " (" + c.so_luong_con + ")").join(", ")
    : "";

  showMsg("✅ Đã tìm thấy tem " + data[0].tag_no, "ok", 3000);
}

async function requireLoginOrRedirect(){
  const session = await MesAuth.getSession();
  if (!session){
    err("Cần đăng nhập trước khi thao tác. Đang chuyển sang trang đăng nhập…");
    setTimeout(() => { window.location.href = 'shared/login.html?returnTo=' + encodeURIComponent(window.location.href); }, 1200);
    return false;
  }
  return true;
}

async function saveTemEdit(){

async function tachTem(){
  if(!currentTagNo) return err("Tìm tem trước khi tách");
  if (!(await requireLoginOrRedirect())) return;
  var sl = g("tachSoLuong"), lyDo = g("tachLyDo");
  if(!sl||isNaN(sl)||+sl<=0) return err("Số lượng tách phải > 0");
  var nguoi = g("s_nguoiTT") || (await MesAuth.getSession())?.user?.email || "";

  showMsg("⏳ Đang tách tem...","wait");
  const { data: tagCon, error } = await sb.rpc('duc_tach_tem', {
    p_tag_no_cha: currentTagNo, p_so_luong_tach: Number(sl), p_ly_do: lyDo, p_nguoi: nguoi,
  });
  if (error) return err("Lỗi tách tem: " + error.message);

  document.getElementById("tachSoLuong").value = "";
  document.getElementById("tachLyDo").value = "";
  showMsg("✅ Đã tách tem con " + tagCon + " — đang mở cửa sổ in...", "ok", 5000);

  const { data: conData } = await sb.from('duc_tem').select('*').eq('tag_no', tagCon);
  if (conData && conData[0]){
    var r = conData[0];
    var ngayISO = String(r.ngay || "");
    var parts = ngayISO.split("-");
    var ngayQR = parts.length === 3 ? (parts[0]+"/"+parts[1]+"/"+parts[2]) : ngayISO;
    var ngayHienThi = parts.length === 3 ? (parts[2]+"/"+parts[1]+"/"+parts[0]) : ngayISO;
    var qr = [r.tag_no, r.ten_sp, r.ma_sp, r.so_luong, ngayQR, r.lot || ngayHienThi, r.so_khuon, r.nguyen_lieu, r.may_duc_chi_thi].join(">\n");
    openPrint({
      ok: true, tagNo: r.tag_no, qr: qr, ngay: ngayHienThi, tenSP: r.ten_sp, maSP: r.ma_sp,
      soLuong: r.so_luong, lotNo: r.lot || ngayHienThi, soKhuon: r.so_khuon || "", nguyenLieu: r.nguyen_lieu || "",
      mayDuc: r.may_duc_chi_thi, nguoiTT: r.nguoi_tt || "", ghiChu: r.ghi_chu || "",
      loaiSP: loaiSpFromTagNo(r.tag_no),
    });
  }
  findTem();
}

// ─── Quét QR trực tiếp qua camera — dùng thư viện html5-qrcode (mebjas), tự
// ưu tiên BarcodeDetector phần cứng khi trình duyệt hỗ trợ (Chrome Android),
// tự xử lý lấy nét/độ phân giải/khung quét — đọc ổn định hơn hẳn vòng lặp
// jsQR tự viết trước đây (camera hiện hình nhưng không giải mã được). Mở
// toàn màn hình khi quét cho dễ căn mã QR. ──────────────────────────────────
let html5QrCode = null;
let scanningActive = false;

// Dùng lại DUY NHẤT 1 instance Html5Qrcode cho mọi lần quét — tạo mới +
// clear() mỗi lần (cách làm ban đầu) làm trình duyệt (đặc biệt Edge) tích
// rác bộ nhớ camera/canvas dần dần, crash tab sau vài lần quét liên tiếp.
function getScanner(){
  if (!html5QrCode) html5QrCode = new Html5Qrcode("qrReaderDiv");
  return html5QrCode;
}

async function openCameraForSearch(){
  document.getElementById("msg").style.display = "none";
  if (typeof Html5Qrcode !== "function"){
    err("Lỗi tải thư viện đọc QR (html5-qrcode) — kiểm tra kết nối mạng rồi tải lại trang.");
    return;
  }
  document.getElementById("qrModal").classList.add("show");
  const scanner = getScanner();
  scanningActive = true;
  try {
    await scanner.start(
      { facingMode: "environment" },
      { fps: 8, qrbox: { width: 260, height: 260 } },
      onScanSuccessForSearch,
      () => { /* chưa thấy mã trong frame này — bỏ qua, thử tiếp frame sau */ }
    );
  } catch(e){
    scanningActive = false;
    await closeQrModal();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      showMsg("📷 Trình duyệt không hỗ trợ camera trực tiếp — mở chế độ chụp ảnh…", "wait");
      document.getElementById("qrFileInput").click();
      return;
    }
    err("Không mở được camera: " + e + ". Kiểm tra đã cho phép quyền Camera cho trang này chưa.");
  }
}

async function closeQrModal(){
  document.getElementById("qrModal").classList.remove("show");
  scanningActive = false;
  if (html5QrCode && html5QrCode.isScanning){
    try { await html5QrCode.stop(); } catch(e){ /* đã dừng rồi hoặc chưa start xong — bỏ qua */ }
  }
}

function stopCamera(){ closeQrModal(); }

async function onScanSuccessForSearch(decodedText){
  if (!scanningActive) return; // đã xử lý/đóng rồi — bỏ qua các lần callback bắn muộn
  scanningActive = false;
  showMsg("🔎 Đã đọc được mã: " + decodedText.slice(0, 50) + "…", "wait");
  try {
    await closeQrModal();
    onQrDecodedForSearch(decodedText);
  } catch(e){
    err("Lỗi xử lý dữ liệu vừa quét: " + (e && e.message ? e.message : e));
  }
}

/* Fallback chụp ảnh tĩnh — chỉ dùng khi trình duyệt không hỗ trợ getUserMedia. */
function onFileChosenForSearch(evt){
  showMsg("⏳ Đang xử lý ảnh vừa chụp…", "wait");
  const file = evt.target.files && evt.target.files[0];
  if (!file) { err("Không nhận được ảnh (có thể bạn đã huỷ chụp)."); return; }
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    try {
      const canvas = document.getElementById("scanCanvas");
      const ctx = canvas.getContext("2d");
      const w = img.width, h = img.height;
      canvas.width = w; canvas.height = h;
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const data = ctx.getImageData(0, 0, w, h);
      const code = jsQR(data.data, data.width, data.height);
      if (code && code.data) onQrDecodedForSearch(code.data);
      else err("Không đọc được mã QR trong ảnh vừa chụp — chụp lại, đảm bảo mã QR rõ nét và nằm giữa khung ảnh.");
    } catch(e){ err("Lỗi xử lý ảnh: " + e.message); }
    evt.target.value = "";
  };
  img.onerror = () => { URL.revokeObjectURL(url); err("Không đọc được ảnh vừa chụp. Vui lòng thử lại."); };
  img.src = url;
}

function onQrDecodedForSearch(text){
  const tagNo = String(text).split(">")[0].trim();
  if (!tagNo){ err("Mã QR không đúng định dạng tem TOYOTAKI."); return; }
  document.getElementById("searchTag").value = tagNo;
  findTem();
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById("btnScanSearch").addEventListener("click", openCameraForSearch);
  document.getElementById("btnCloseQrModal").addEventListener("click", stopCamera);
  document.getElementById("qrFileInput").addEventListener("change", onFileChosenForSearch);
  document.getElementById("searchTag").addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    findTem();
  });
});

async function inTem(){
  if (!(await requireLoginOrRedirect())) return;
  var ma=g("maSP"),sl=g("soLuong"),may=g("mayDuc"),nguoi=g("nguoiTT"),loai=g("loaiSP");
  if(!ma)   return err("Chọn Mã sản phẩm");
  if(!sl||isNaN(sl)||+sl<=0) return err("Số lượng phải > 0");
  if(!may)  return err("Chọn Máy đúc");
  if(!nguoi)return err("Chọn Người thao tác");
  if(!loai) loai="hangloat";

  setBtn(true);
  showMsg("⏳ Đang sinh Tag No và ghi dữ liệu...","wait");

  var now = new Date();
  var pad2 = n => String(n).padStart(2,"0");
  var ngayISO = now.getFullYear()+"-"+pad2(now.getMonth()+1)+"-"+pad2(now.getDate());
  var ngay = pad2(now.getDate())+"/"+pad2(now.getMonth()+1)+"/"+now.getFullYear();
  var ngayQR = now.getFullYear()+"/"+pad2(now.getMonth()+1)+"/"+pad2(now.getDate());
  var lotNoInput = g("lotNo");
  var lotNo = lotNoInput ? lotNoInput.split("-").reverse().join("/") : ngay;
  var tenSP = g("tenSP"), soKhuon = g("soKhuon"), nguyenLieu = g("nguyenLieu"), ghiChu = g("ghiChu");

  try {
    const { data: tagNo, error } = await sb.rpc('duc_ghi_tem', {
      p_loai_sp: loai, p_ten_sp: tenSP, p_ma_sp: ma, p_so_luong: Number(sl),
      p_ngay: ngayISO, p_lot: lotNoInput || ngay, p_so_khuon: soKhuon,
      p_nguyen_lieu: nguyenLieu, p_may_duc: may, p_ghi_chu: ghiChu,
      p_ngay_gio_in: now.toISOString(), p_nguoi_tt: nguoi,
    });
    setBtn(false);
    if (error) { err("Lỗi server: " + error.message); return; }

    var qr = [tagNo, tenSP, ma, sl, ngayQR, lotNoInput || ngay, soKhuon, nguyenLieu, may].join(">\n");
    var d = { tagNo: tagNo, qr: qr, ngay: ngay, tenSP: tenSP, maSP: ma, soLuong: sl,
              lotNo: lotNoInput || ngay, soKhuon: soKhuon, nguyenLieu: nguyenLieu,
              mayDuc: may, nguoiTT: nguoi, ghiChu: ghiChu, loaiSP: loai };
    showMsg("✅ " + tagNo + " — đang mở cửa sổ in...", "ok", 5000);
    openPrint(d);
  } catch (e) {
    setBtn(false);
    err("Lỗi: " + e.message);
  }
}

function openPrint(d){
  var svg = buildLabelSvg(d);
  var bg = d.loaiSP === 'phattrien' ? '#000' : '#fff';
  var css=[
    "@page{size:72mm 100mm;margin:0}",
    "*{margin:0;padding:0;box-sizing:border-box}",
    "html,body{width:72mm;height:100mm;background:"+bg+"}",
    "svg{display:block;width:72mm;height:100mm}",
    ".pbtn{position:fixed;bottom:14px;right:14px;background:#C87941;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:bold;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}",
    "@media print{.pbtn{display:none}}"
  ].join("");
  var popupHtml =
    "<!DOCTYPE html><html lang=\"vi\"><head><meta charset=\"UTF-8\">"
    +"<title>Tem: "+d.tagNo+"</title>"
    +"<style>"+css+"</style></head><body>"
    +svg
    +'<button class="pbtn" onclick="window.print()">🖨 In ngay</button>'
    +'<script>setTimeout(function(){window.print();},150);<\/script>'
    +"</body></html>";
  var w=window.open("","_blank","width=430,height=720,scrollbars=yes");
  if(!w){err("Trình duyệt chặn popup — vào Settings cho phép popup rồi thử lại");return;}
  w.document.open(); w.document.write(popupHtml); w.document.close();
}

function buildQrRects(data, sizeMm, bgColor, fgColor){
  var qr = qrcode(0, "M");
  qr.addData(data);
  qr.make();
  var n = qr.getModuleCount();
  var cell = sizeMm / n;
  var out = '<rect x="0" y="0" width="'+sizeMm+'" height="'+sizeMm+'" fill="'+bgColor+'"/>';
  for (var r=0; r<n; r++){
    for (var c=0; c<n; c++){
      if (qr.isDark(r,c)){
        out += '<rect x="'+(c*cell).toFixed(3)+'" y="'+(r*cell).toFixed(3)+'" width="'+cell.toFixed(3)+'" height="'+cell.toFixed(3)+'" fill="'+fgColor+'"/>';
      }
    }
  }
  return out;
}

function svgEsc(s){
  s = String(s==null?"":s);
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function buildLabelSvg(d){
  var W=72, H=100;
  // Sản phẩm đang phát triển -> tem nền đen chữ trắng (dễ phân biệt bằng mắt
  // với tem hàng loạt trên cùng dây chuyền). Mã QR luôn giữ ô nền trắng
  // riêng bên trong (buildQrRects) để đảm bảo máy quét đọc được bất kể nền
  // tem là màu gì.
  var dark = d.loaiSP === 'phattrien';

function clearAll(){
  ["soLuong","soKhuon","nguyenLieu","ghiChu"].forEach(function(i){ document.getElementById(i).value=""; });
  document.getElementById("soKhuon-chips").innerHTML = "";
  document.getElementById("lotNo").value = getTodayString();
  document.getElementById("maSP").value="";
  document.getElementById("tenSP").value="";
  document.getElementById("mayDuc").value="";
  document.getElementById("nguoiTT").value="";
  document.getElementById("loaiSP").value="hangloat";
  document.getElementById("msg").style.display="none";
  document.getElementById("maSP").focus();
}
function setBtn(v){
  var b=document.getElementById("btnIn");
  b.disabled=v;
  b.textContent=v?"⏳ Đang xử lý...":"🖨 In Tem";
}
var msgToken = 0;
function showMsg(t,cls,autoHideMs){
  var el=document.getElementById("msg");
  el.textContent=t;el.className=cls;el.style.display="block";
  msgToken += 1;
  var myToken = msgToken;
  if (autoHideMs){
    setTimeout(function(){ if (myToken === msgToken){ el.style.display="none"; } }, autoHideMs);
  }
}
function err(t){ showMsg("❌ "+t,"err"); }

// Hiện lỗi JS bất kỳ ngay trên màn hình (điện thoại khó xem console) — cùng
// cách chuyencongdoan.html đã dùng để chẩn đoán lỗi camera/quét QR khi test
// thực tế trên điện thoại.
window.addEventListener("error", (e) => { err("Lỗi JS: " + e.message); });
window.addEventListener("unhandledrejection", (e) => {
  const m = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
  // Cảnh báo vô hại của trình duyệt khi video bị dừng/thay thế đúng lúc
  // play() đang chờ (xảy ra bình thường khi đóng camera quét QR) — bỏ qua.
  if (/play\(\) request was interrupted/i.test(m)) return;
  err("Lỗi JS (promise): " + m);
});

(async function init(){
  try {
    await loadMaster();
    document.getElementById("lotNo").value = getTodayString();
    document.getElementById("loading").style.display="none";
    applyPrefill();
    document.getElementById("mainWrap").style.display="block";
  } catch (e) {
    document.getElementById("loading").style.display="none";
    err("Không tải được dữ liệu: " + e.message);
  }
})();
</script>
