<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>In Tem Đúc — TOYOTAKI</title>
<!--
  intem.html — bản web tĩnh (Supabase) thay Web App Google Apps Script
  "Intem QR" (D:\Project\MES\Intem QR\Code.gs + Index.html). Đọc công khai,
  GHI (in tem mới/lưu sửa/xoá) bắt buộc đăng nhập Supabase Auth.

  ĐÃ CHỦ ĐÍCH ĐƠN GIẢN HOÁ (ghi rõ để không tưởng là thiếu sót):
  - "Nguyên liệu" đổi từ dropdown gợi ý (đọc cột E sheet KHSX Master) sang ô
    nhập tay tự do: cột nguyên liệu theo từng mã SP chưa có trong bảng
    Supabase master_products. Trường này vốn không bắt buộc ở bản gốc, không
    ảnh hưởng tính đúng đắn dữ liệu ghi (duc_ghi_tem nhận text tự do).
  - Thư viện tạo mã QR (qrcode-generator) trước đây nhúng base64 ngay trong
    file vì chạy trong sandbox Apps Script (chặn CDN ngoài) — ở đây tải thẳng
    từ CDN, cùng phiên bản/API, giữ nguyên 100% logic vẽ SVG (buildQrRects/
    buildLabelSvg) so với bản gốc.
  - Nhận prefill qua query string (?maSP=..&tenSP=..&mayDuc=..&nguoiTT=..&soKhuon=..)
    khi mở từ nút "🖨" trên duc-dashboard.html — giữ đúng hành vi bản gốc.
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f2f5;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;padding:16px 12px 40px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:16px;width:100%;max-width:500px}
.hdr-left{display:flex;align-items:center;gap:10px}
.hdr h1{font-size:16px;font-weight:700;color:#1a1a2e;line-height:1.2}
.hdr p{font-size:10px;color:#999;margin-top:2px}
.auth-info{font-size:11px;color:#667}
.auth-info a{color:#C87941;text-decoration:none;font-weight:600}
.card{background:#fff;border-radius:14px;
  box-shadow:0 2px 16px rgba(0,0,0,.08);
  padding:24px 20px;width:100%;max-width:500px}
.card-ttl{font-size:12px;font-weight:700;color:#C87941;
  text-transform:uppercase;letter-spacing:.5px;
  margin-bottom:18px;padding-bottom:9px;
  border-bottom:2px solid #f5e6d7}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg.full{grid-column:1/-1}
label{font-size:11px;font-weight:700;color:#555;
  text-transform:uppercase;letter-spacing:.4px}
.req::after{content:" *";color:#e53}
input,select,textarea{border:1.5px solid #ddd;border-radius:7px;
  padding:8px 10px;font-size:13px;color:#1a1a2e;
  width:100%;transition:border-color .2s;font-family:inherit;background:#fff}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:#C87941;
  box-shadow:0 0 0 3px rgba(200,121,65,.12)}
input[disabled],select[disabled]{background:#f7f7f7;color:#888}
textarea{resize:vertical;min-height:48px}
.btns{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:12px;border:none;border-radius:9px;
  font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-p{background:#C87941;color:#fff}
.btn-p:hover:not(:disabled){background:#a85e2a;transform:translateY(-1px)}
.btn-p:disabled{opacity:.5;cursor:not-allowed}
.btn-s{background:#f0f2f5;color:#555}
.btn-s:hover{background:#e2e5ea}
.btn-s:disabled{opacity:.5;cursor:not-allowed}
#msg{margin-top:12px;padding:11px 14px;border-radius:7px;
  font-size:13px;display:none}
.err{background:#fff0f0;color:#c00;border:1px solid #fcc;display:block!important}
.ok{background:#f0fff4;color:#1a7a3a;border:1px solid #c3e6cb;display:block!important}
.wait{background:#fff8f0;color:#C87941;border:1px solid #f5e6d7;display:block!important}
.loading-overlay{display:flex;align-items:center;justify-content:center;
  padding:30px;color:#C87941;font-size:14px;gap:10px}
.spin{width:20px;height:20px;border:3px solid #f5e6d7;
  border-top-color:#C87941;border-radius:50%;
  animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-left">
    <div><h1>🏷️ In Tem Sản Phẩm — Đúc</h1><p>CÔNG TY CỔ PHẦN CÔNG NGHIỆP TOYOTAKI</p></div>
  </div>
  <div class="auth-info" id="authInfo">…</div>
</div>
<div class="card">
  <div class="card-ttl">Thông tin tem</div>

  <div id="loading" class="loading-overlay">
    <div class="spin"></div> Đang tải dữ liệu...
  </div>

  <div id="formWrap" style="display:none">
    <div class="fg full" style="margin-bottom:12px">
      <label for="searchTag">Tra cứu theo Tag No</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="searchTag" type="text" placeholder="Nhập Tag No">
        <button class="btn btn-s" type="button" style="flex:none;padding:8px 14px" onclick="findTem()">🔎 Tìm</button>
      </div>
    </div>
    <div class="btns" style="margin-top:8px">
      <button class="btn btn-s" type="button" onclick="saveTemEdit()">💾 Lưu thay đổi</button>
      <button class="btn btn-s" type="button" onclick="reprintTem()">🖨 In lại</button>
      <button class="btn btn-s" type="button" onclick="deleteTem()">🗑 Xóa tem</button>
    </div>
    <div class="grid" style="margin-top:16px">
      <div class="fg">
        <label class="req" for="maSP">Mã sản phẩm</label>
        <select id="maSP" onchange="onMaChange()"></select>
      </div>
      <div class="fg">
        <label for="tenSP">Tên sản phẩm</label>
        <input id="tenSP" type="text" placeholder="Tự điền theo mã" disabled>
      </div>
      <div class="fg">
        <label class="req" for="soLuong">Số lượng / thùng</label>
        <input id="soLuong" type="number" placeholder="Pcs" min="1">
      </div>
      <div class="fg">
        <label for="lotNo">Ngày sản xuất</label>
        <input id="lotNo" type="date">
      </div>
      <div class="fg">
        <label for="soKhuon">Số khuôn</label>
        <input id="soKhuon" type="text" placeholder="VD V45-46">
      </div>
      <div class="fg">
        <label for="nguyenLieu">Nguyên liệu</label>
        <input id="nguyenLieu" type="text" placeholder="Nhập tự do (tuỳ chọn)">
      </div>
      <div class="fg">
        <label class="req" for="mayDuc">Máy đúc</label>
        <select id="mayDuc"></select>
      </div>
      <div class="fg">
        <label class="req" for="nguoiTT">Người thao tác</label>
        <select id="nguoiTT"></select>
      </div>
      <div class="fg full">
        <label for="ghiChu">Ghi chú</label>
        <textarea id="ghiChu" placeholder="VD: Đúc mẫu"></textarea>
      </div>
      <div class="fg full">
        <label class="req" for="loaiSP">Chủng loại sản phẩm</label>
        <select id="loaiSP">
          <option value="hangloat" selected>Sản phẩm sản xuất hàng loạt</option>
          <option value="phattrien">Sản phẩm đang phát triển</option>
        </select>
      </div>
    </div>
    <div class="btns">
      <button class="btn btn-s" onclick="clearAll()">🗑 Xóa</button>
      <button class="btn btn-p" id="btnIn" onclick="inTem()">🖨 In Tem</button>
    </div>
  </div>

  <div id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="shared/supabase-client.js"></script>
<script>
var masterData = [];   // [{ma, ten}]
var currentTagNo = "";
var PREFILL = Object.fromEntries(new URLSearchParams(location.search));

function getTodayString(){
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function setDefaultLotNo(){
  var el = document.getElementById("lotNo");
  if (el && !el.value) el.value = getTodayString();
}
function g(id){ return document.getElementById(id).value.trim(); }

async function loadMaster(){
  const [prod, may, nv] = await Promise.all([
    sb.from('master_products').select('ma_sp,ten_sp').order('ma_sp'),
    sb.from('master_machines').select('ma_may').order('ma_may'),
    sb.from('master_employees').select('ten_nhan_vien').order('ten_nhan_vien'),
  ]);
  if (prod.error) throw new Error('Không tải được danh mục SP: ' + prod.error.message);
  if (may.error) throw new Error('Không tải được danh mục máy: ' + may.error.message);
  if (nv.error) throw new Error('Không tải được danh mục nhân sự: ' + nv.error.message);

  masterData = (prod.data || []).map(r => ({ ma: r.ma_sp, ten: r.ten_sp || '' }));
  buildSelects(masterData, (may.data||[]).map(r=>r.ma_may), (nv.data||[]).map(r=>r.ten_nhan_vien));
}

function buildSelects(items, mays, nguois){
  var sel = document.getElementById("maSP");
  sel.innerHTML = '<option value="">-- Chọn mã SP --</option>';
  items.forEach(function(item){ sel.innerHTML += '<option value="'+item.ma+'">'+item.ma+'</option>'; });

  var maySel = document.getElementById("mayDuc");
  maySel.innerHTML = '<option value="">-- Chọn máy --</option>';
  mays.forEach(function(m){ maySel.innerHTML += '<option>'+m+'</option>'; });

  var nguoiSel = document.getElementById("nguoiTT");
  nguoiSel.innerHTML = '<option value="">-- Chọn người --</option>';
  nguois.forEach(function(n){ nguoiSel.innerHTML += '<option>'+n+'</option>'; });
}

function applyPrefill(){
  if (!PREFILL || !PREFILL.maSP) return;
  document.getElementById("maSP").value = PREFILL.maSP;
  onMaChange();
  if (!document.getElementById("tenSP").value && PREFILL.tenSP) {
    document.getElementById("tenSP").value = PREFILL.tenSP;
  }
  if (PREFILL.soKhuon) document.getElementById("soKhuon").value = PREFILL.soKhuon;
  if (PREFILL.mayDuc)  document.getElementById("mayDuc").value = PREFILL.mayDuc;
  if (PREFILL.nguoiTT) document.getElementById("nguoiTT").value = PREFILL.nguoiTT;
  var slEl = document.getElementById("soLuong");
  if (slEl) slEl.focus();
}

function fillFormFromTem(t){
  if(!t) return;
  currentTagNo = t.tagNo || "";
  document.getElementById("searchTag").value = currentTagNo;
  document.getElementById("maSP").value = t.maSP || "";
  document.getElementById("tenSP").value = t.tenSP || "";
  document.getElementById("soLuong").value = t.soLuong || "";
  document.getElementById("lotNo").value = t.lotNo ? String(t.lotNo).split("/").reverse().join("-") : getTodayString();
  document.getElementById("soKhuon").value = t.soKhuon || "";
  document.getElementById("nguyenLieu").value = t.nguyenLieu || "";
  document.getElementById("mayDuc").value = t.mayDuc || "";
  document.getElementById("nguoiTT").value = t.nguoiTT || "";
  document.getElementById("ghiChu").value = t.ghiChu || "";
  document.getElementById("loaiSP").value = t.loaiSP || "hangloat";
}

function temRowToClient(r){
  return {
    tagNo: r.tag_no || "", tenSP: r.ten_sp || "", maSP: r.ma_sp || "",
    soLuong: r.so_luong || "", lotNo: r.lot || "", soKhuon: r.so_khuon || "",
    nguyenLieu: r.nguyen_lieu || "", mayDuc: r.may_duc_chi_thi || "",
    ghiChu: r.ghi_chu || "", nguoiTT: r.nguoi_tt || "", loaiSP: "hangloat",
  };
}

async function findTem(){
  var tagNo = g("searchTag");
  if(!tagNo) return err("Nhập Tag No để tra cứu");
  showMsg("⏳ Đang tra cứu tem...","wait");
  const { data, error } = await sb.from('duc_tem').select('*').ilike('tag_no', tagNo);
  if (error) return err("Lỗi tra cứu: " + error.message);
  if (!data || !data.length) return err("Không tìm thấy tem");
  fillFormFromTem(temRowToClient(data[0]));
  showMsg("✅ Đã tìm thấy tem " + data[0].tag_no, "ok", 3000);
}

async function requireLoginOrRedirect(){
  const session = await MesAuth.getSession();
  if (!session){
    err("Cần đăng nhập trước khi thao tác. Đang chuyển sang trang đăng nhập…");
    setTimeout(() => { window.location.href = 'shared/login.html?returnTo=' + encodeURIComponent(window.location.href); }, 1200);
    return false;
  }
  return true;
}

async function saveTemEdit(){
  if(!currentTagNo) return err("Tìm tem trước khi sửa");
  if (!(await requireLoginOrRedirect())) return;
  var ma=g("maSP"),sl=g("soLuong"),may=g("mayDuc"),nguoi=g("nguoiTT");
  if(!ma) return err("Chọn Mã sản phẩm");
  if(!sl||isNaN(sl)||+sl<=0) return err("Số lượng phải > 0");
  if(!may) return err("Chọn Máy đúc");
  if(!nguoi) return err("Chọn Người thao tác");

  var patch = {
    ten_sp: g("tenSP"), ma_sp: ma,
    so_luong: Number(sl), so_luong_tt: Number(sl),
    lot: g("lotNo"),
    so_khuon: g("soKhuon"), so_khuon_tt: g("soKhuon"),
    nguyen_lieu: g("nguyenLieu"),
    may_duc_chi_thi: may, may_tt: may,
    ghi_chu: g("ghiChu"), nguoi_tt: nguoi,
  };
  showMsg("⏳ Đang lưu thay đổi...","wait");
  const { error } = await sb.from('duc_tem').update(patch).ilike('tag_no', currentTagNo);
  if (error) return err("Lỗi lưu: " + error.message);
  showMsg("✅ Đã lưu thay đổi cho tem " + currentTagNo, "ok", 3000);
}

async function reprintTem(){
  if(!currentTagNo) return err("Tìm tem trước khi in lại");
  showMsg("⏳ Đang chuẩn bị in lại...","wait");
  const { data, error } = await sb.from('duc_tem').select('*').ilike('tag_no', currentTagNo);
  if (error) return err("Lỗi in lại: " + error.message);
  if (!data || !data.length) return err("Không tìm thấy tem");
  var r = data[0];

  var ngayISO = String(r.ngay || "");
  var parts = ngayISO.split("-");
  var ngayQR = parts.length === 3 ? (parts[0]+"/"+parts[1]+"/"+parts[2]) : ngayISO;
  var ngayHienThi = parts.length === 3 ? (parts[2]+"/"+parts[1]+"/"+parts[0]) : ngayISO;
  var lotNo = r.lot || ngayHienThi;
  var qr = [r.tag_no, r.ten_sp, r.ma_sp, r.so_luong, ngayQR, lotNo, r.so_khuon, r.nguyen_lieu, r.may_duc_chi_thi].join(">\n");

  var d = {
    ok: true, tagNo: r.tag_no, qr: qr, ngay: ngayHienThi,
    tenSP: r.ten_sp, maSP: r.ma_sp, soLuong: r.so_luong,
    lotNo: lotNo, soKhuon: r.so_khuon || "", nguyenLieu: r.nguyen_lieu || "",
    mayDuc: r.may_duc_chi_thi, nguoiTT: r.nguoi_tt || "", ghiChu: r.ghi_chu || "",
  };
  showMsg("✅ Đang in lại tem " + r.tag_no, "ok", 3000);
  openPrint(d);
}

async function deleteTem(){
  if(!currentTagNo) return err("Tìm tem trước khi xóa");
  if(!window.confirm("Xóa tem "+currentTagNo+" khỏi database?")) return;
  if (!(await requireLoginOrRedirect())) return;
  showMsg("⏳ Đang xóa tem...","wait");
  const { error } = await sb.from('duc_tem').delete().ilike('tag_no', currentTagNo);
  if (error) return err("Lỗi xóa: " + error.message);
  clearAll();
  showMsg("✅ Đã xóa tem " + currentTagNo, "ok", 3000);
}

function onMaChange(){
  var ma = document.getElementById("maSP").value;
  var item = masterData.find(function(x){return x.ma===ma;});
  document.getElementById("tenSP").value = item ? item.ten : "";
}

async function inTem(){
  if (!(await requireLoginOrRedirect())) return;
  var ma=g("maSP"),sl=g("soLuong"),may=g("mayDuc"),nguoi=g("nguoiTT"),loai=g("loaiSP");
  if(!ma)   return err("Chọn Mã sản phẩm");
  if(!sl||isNaN(sl)||+sl<=0) return err("Số lượng phải > 0");
  if(!may)  return err("Chọn Máy đúc");
  if(!nguoi)return err("Chọn Người thao tác");
  if(!loai) loai="hangloat";

  setBtn(true);
  showMsg("⏳ Đang sinh Tag No và ghi dữ liệu...","wait");

  var now = new Date();
  var pad2 = n => String(n).padStart(2,"0");
  var ngayISO = now.getFullYear()+"-"+pad2(now.getMonth()+1)+"-"+pad2(now.getDate());
  var ngay = pad2(now.getDate())+"/"+pad2(now.getMonth()+1)+"/"+now.getFullYear();
  var ngayQR = now.getFullYear()+"/"+pad2(now.getMonth()+1)+"/"+pad2(now.getDate());
  var lotNoInput = g("lotNo");
  var lotNo = lotNoInput ? lotNoInput.split("-").reverse().join("/") : ngay;
  var tenSP = g("tenSP"), soKhuon = g("soKhuon"), nguyenLieu = g("nguyenLieu"), ghiChu = g("ghiChu");

  try {
    const { data: tagNo, error } = await sb.rpc('duc_ghi_tem', {
      p_loai_sp: loai, p_ten_sp: tenSP, p_ma_sp: ma, p_so_luong: Number(sl),
      p_ngay: ngayISO, p_lot: lotNoInput || ngay, p_so_khuon: soKhuon,
      p_nguyen_lieu: nguyenLieu, p_may_duc: may, p_ghi_chu: ghiChu,
      p_ngay_gio_in: now.toISOString(), p_nguoi_tt: nguoi,
    });
    setBtn(false);
    if (error) { err("Lỗi server: " + error.message); return; }

    var qr = [tagNo, tenSP, ma, sl, ngayQR, lotNoInput || ngay, soKhuon, nguyenLieu, may].join(">\n");
    var d = { tagNo: tagNo, qr: qr, ngay: ngay, tenSP: tenSP, maSP: ma, soLuong: sl,
              lotNo: lotNoInput || ngay, soKhuon: soKhuon, nguyenLieu: nguyenLieu,
              mayDuc: may, nguoiTT: nguoi, ghiChu: ghiChu };
    showMsg("✅ " + tagNo + " — đang mở cửa sổ in...", "ok", 5000);
    openPrint(d);
  } catch (e) {
    setBtn(false);
    err("Lỗi: " + e.message);
  }
}

function openPrint(d){
  var svg = buildLabelSvg(d);
  var css=[
    "@page{size:72mm 100mm;margin:0}",
    "*{margin:0;padding:0;box-sizing:border-box}",
    "html,body{width:72mm;height:100mm;background:#fff}",
    "svg{display:block;width:72mm;height:100mm}",
    ".pbtn{position:fixed;bottom:14px;right:14px;background:#C87941;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:bold;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}",
    "@media print{.pbtn{display:none}}"
  ].join("");
  var popupHtml =
    "<!DOCTYPE html><html lang=\"vi\"><head><meta charset=\"UTF-8\">"
    +"<title>Tem: "+d.tagNo+"</title>"
    +"<style>"+css+"</style></head><body>"
    +svg
    +'<button class="pbtn" onclick="window.print()">🖨 In ngay</button>'
    +'<script>setTimeout(function(){window.print();},150);<\/script>'
    +"</body></html>";
  var w=window.open("","_blank","width=430,height=720,scrollbars=yes");
  if(!w){err("Trình duyệt chặn popup — vào Settings cho phép popup rồi thử lại");return;}
  w.document.open(); w.document.write(popupHtml); w.document.close();
}

function buildQrRects(data, sizeMm){
  var qr = qrcode(0, "M");
  qr.addData(data);
  qr.make();
  var n = qr.getModuleCount();
  var cell = sizeMm / n;
  var out = '<rect x="0" y="0" width="'+sizeMm+'" height="'+sizeMm+'" fill="#ffffff"/>';
  for (var r=0; r<n; r++){
    for (var c=0; c<n; c++){
      if (qr.isDark(r,c)){
        out += '<rect x="'+(c*cell).toFixed(3)+'" y="'+(r*cell).toFixed(3)+'" width="'+cell.toFixed(3)+'" height="'+cell.toFixed(3)+'" fill="#000000"/>';
      }
    }
  }
  return out;
}

function svgEsc(s){
  s = String(s==null?"":s);
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function clearAll(){
  ["soLuong","soKhuon","nguyenLieu","ghiChu"].forEach(function(i){ document.getElementById(i).value=""; });
  document.getElementById("lotNo").value = getTodayString();
  document.getElementById("maSP").value="";
  document.getElementById("tenSP").value="";
  document.getElementById("mayDuc").value="";
  document.getElementById("nguoiTT").value="";
  document.getElementById("loaiSP").value="hangloat";
  document.getElementById("searchTag").value="";
  currentTagNo = "";
  document.getElementById("msg").style.display="none";
  document.getElementById("maSP").focus();
}
function setBtn(v){
  var b=document.getElementById("btnIn");
  b.disabled=v;
  b.textContent=v?"⏳ Đang xử lý...":"🖨 In Tem";
}
var msgToken = 0;
function showMsg(t,cls,autoHideMs){
  var el=document.getElementById("msg");
  el.textContent=t;el.className=cls;el.style.display="block";
  msgToken += 1;
  var myToken = msgToken;
  if (autoHideMs){
    setTimeout(function(){ if (myToken === msgToken){ el.style.display="none"; } }, autoHideMs);
  }
}
function err(t){ showMsg("❌ "+t,"err"); }

async function initAuthStatus(){
  const bar = document.getElementById("authInfo");
  const email = await MesAuth.getCurrentUserEmail();
  if (email){
    bar.innerHTML = `👤 ${email} · <a href="#" id="mesSignOut">Đăng xuất</a>`;
    document.getElementById('mesSignOut').addEventListener('click', (e) => { e.preventDefault(); MesAuth.signOut(); });
  } else {
    bar.innerHTML = `<a href="shared/login.html">Đăng nhập</a>`;
  }
}

(async function init(){
  try {
    await loadMaster();
    document.getElementById("loading").style.display="none";
    setDefaultLotNo();
    applyPrefill();
    document.getElementById("formWrap").style.display="block";
  } catch (e) {
    document.getElementById("loading").style.display="none";
    err("Không tải được dữ liệu: " + e.message);
  }
  initAuthStatus();
})();
</script>
