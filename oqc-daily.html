<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OQC — Kiểm tra xuất hàng</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#172033;font:14px Arial}.top{background:#1e293b;color:white;padding:14px 20px;display:flex;gap:16px;align-items:center}.top a{color:#bfdbfe}.wrap{max-width:1500px;margin:auto;padding:16px}.panel{background:white;border-radius:10px;margin-bottom:14px;box-shadow:0 2px 8px #0001}.head{padding:13px 16px;border-bottom:1px solid #ddd;font-weight:800}.body{padding:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:bold;color:#475569}input,select,textarea,button{font:inherit}input,select,textarea{padding:9px;border:1px solid #aab4c2;border-radius:6px}.ro{background:#f1f5f9}.btn{border:0;border-radius:6px;padding:9px 14px;font-weight:bold;cursor:pointer}.primary{background:#1769aa;color:white}.secondary{background:#e2e8f0}.msg{padding:10px;margin-bottom:10px;border-radius:6px;display:none}.err{display:block;background:#fee2e2;color:#991b1b}.okmsg{display:block;background:#dcfce7;color:#166534}.defect-table input{width:120px;text-align:right}.group td{background:#e0f2fe;font-weight:bold;color:#075985}.total-row{font-size:16px;font-weight:bold;background:#fff7ed}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card{background:#f8fafc;padding:12px;border-radius:8px}.card b{font-size:22px;display:block}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border-bottom:1px solid #e2e8f0;padding:8px;text-align:left}th{background:#f8fafc}.bar{height:18px;background:#e2e8f0;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:#dc2626}@media(max-width:900px){.grid,.cards{grid-template-columns:1fr 1fr}}
</style></head><body><div class="top"><b>OQC — KIỂM TRA XUẤT HÀNG</b><a href="oqc.html">Đóng pallet OQC</a><a href="khsx-tuan.html">KHSX tuần</a><span id="who" style="margin-left:auto"></span></div><main class="wrap"><div id="msg" class="msg"></div>
<section class="panel"><div class="head">Nhập kiểm tra xuất hàng</div><div class="body"><form id="form"><div class="grid">
<div class="field"><label>Ngày kiểm tra</label><input type="date" id="date" required></div><div class="field"><label>Ca</label><select id="shift"><option>Ca 1</option><option>Ca 2</option><option>Ca 3</option></select></div>
<div class="field"><label>Mã sản phẩm / Model</label><select id="code" required><option value="">-- Chọn Model --</option></select></div><div class="field"><label>Tên sản phẩm</label><input id="name" class="ro" readonly></div>
<div class="field"><label>Mã nhân viên kiểm tra</label><input id="inspectorCode" list="employees" required autocomplete="off" placeholder="Nhập mã hoặc tên NV"><datalist id="employees"></datalist></div><div class="field"><label>Tên người kiểm</label><input id="inspectorName" class="ro" readonly></div>
<div class="field"><label>Tổng kiểm</label><input type="number" min="0" step="1" id="total" required></div><div class="field"><label>Tổng NG (từ bảng lỗi)</label><input id="ng" class="ro" readonly></div>
<div class="field"><label>OK</label><input id="ok" class="ro" readonly></div><div class="field"><label>% OK</label><input id="okPct" class="ro" readonly></div><div class="field"><label>% NG</label><input id="ngPct" class="ro" readonly></div><div class="field"><label>KHSX / Đã kiểm / Còn lại</label><input id="plan" class="ro" readonly></div></div>
<h3>Chi tiết lỗi</h3><div style="overflow:auto"><table class="defect-table"><thead><tr><th>Nhóm lỗi</th><th>Tên lỗi</th><th>Chi tiết / kích thước</th><th>SL NG</th></tr></thead><tbody id="defects"></tbody><tfoot><tr class="total-row"><td colspan="3">Tổng NG</td><td id="defectTotal">0</td></tr></tfoot></table></div><br>
<div class="field"><label>Ghi chú</label><textarea id="note"></textarea></div><br><button class="btn primary" id="save">Lưu record</button> <button type="button" class="btn secondary" onclick="resetForm()">Làm mới</button></form></div></section>
<section class="panel"><div class="head">Thống kê OQC</div><div class="body"><div class="grid"><div class="field"><label>Xem nhanh</label><select id="period" onchange="setPeriod(this.value)"><option value="day">Hôm nay</option><option value="week">Tuần này</option><option value="month">Tháng này</option><option value="custom" selected>Khoảng ngày</option></select></div><div class="field"><label>Từ ngày</label><input type="date" id="from"></div><div class="field"><label>Đến ngày</label><input type="date" id="to"></div><div class="field"><label>Mã/Tên SP</label><input id="filterProduct"></div><div class="field"><label>Người kiểm</label><input id="filterInspector"></div><div class="field"><label>Ca</label><select id="filterShift"><option value="">Tất cả</option><option>Ca 1</option><option>Ca 2</option><option>Ca 3</option></select></div><div><button class="btn primary" type="button" onclick="loadStats()">Xem</button> <button class="btn secondary" type="button" onclick="exportExcel()">Xuất Excel</button></div></div><br><div class="cards" id="cards"></div><div class="grid"><div><h3>Pareto lỗi</h3><div id="pareto"></div></div><div><h3>Top sản phẩm NG</h3><div id="topProducts"></div></div><div style="grid-column:span 2"><h3>Xu hướng NG theo ngày</h3><div id="trend"></div></div></div><h3>Chi tiết record</h3><div style="overflow:auto"><table><thead><tr><th>Ngày giờ</th><th>Ca</th><th>Model</th><th>Tên SP</th><th>Mã NV</th><th>Người kiểm</th><th>Tổng</th><th>OK</th><th>NG</th><th>%NG</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="shared/supabase-client.js"></script><script src="shared/navbar.js"></script><script>
const $=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let identity='',catalog=[],dataRows=[],productMap={},employeeMap={},editing=null;
const localDate=(d=new Date())=>{d=new Date(d-d.getTimezoneOffset()*60000);return d.toISOString().slice(0,10)};function message(s,bad=false){$('msg').textContent=s;$('msg').className='msg '+(bad?'err':'okmsg')}
async function init(){await MesAuth.requireAuth();identity=await MesAuth.getCurrentUserIdentity()||'';$('who').textContent=identity;$('date').value=localDate();$('from').value=localDate(new Date(Date.now()-30*864e5));$('to').value=localDate();const [p,e,c]=await Promise.all([sb.from('master_products').select('ma_sp,ten_sp').order('ma_sp'),sb.from('master_employees').select('ma_nv,ten_nhan_vien').order('ten_nhan_vien'),sb.from('quality_defect_catalog').select('*').contains('processes',['OQC']).eq('is_active',true).order('sort_order')]);if(p.error)return message(p.error.message,true);if(c.error)return message('Chưa chạy migration T38 danh mục lỗi dùng chung: '+c.error.message,true);(p.data||[]).forEach(x=>productMap[x.ma_sp]=x.ten_sp||'');$('code').innerHTML+=Object.keys(productMap).map(x=>'<option value="'+E(x)+'">'+E(x)+' — '+E(productMap[x])+'</option>').join('');(e.data||[]).forEach(x=>employeeMap[x.ma_nv||x.ten_nhan_vien]=x.ten_nhan_vien);$('employees').innerHTML=Object.keys(employeeMap).map(x=>'<option value="'+E(x)+'"></option>').join('');catalog=c.data||[];renderDefects();calc();loadStats()}
function renderDefects(){const groups=['NG ngoại quan','NG kích thước','NG khác'];$('defects').innerHTML=groups.map(g=>{const rows=catalog.filter(x=>x.defect_group===g);if(!rows.length)return'';return '<tr class="group"><td colspan="4">'+E(g)+'</td></tr>'+rows.map(x=>'<tr><td>'+E(g)+'</td><td>'+E(x.label)+'</td><td><input class="detail" data-code="'+E(x.code)+'" placeholder="VD: Ø10, mặt C..."></td><td><input class="defect" data-code="'+E(x.code)+'" data-label="'+E(x.label)+'" data-group="'+E(g)+'" type="number" min="0" step="1" value="0"></td></tr>').join('')}).join('');document.querySelectorAll('.defect').forEach(x=>x.oninput=calc)}
function calc(){const t=Number($('total').value)||0,n=[...document.querySelectorAll('.defect')].reduce((s,x)=>s+(Number(x.value)||0),0),o=t-n;$('ng').value=n;$('defectTotal').textContent=n;$('ok').value=o>=0?o:'';$('okPct').value=t&&o>=0?(o/t*100).toLocaleString('vi-VN',{maximumFractionDigits:2})+'%':'0%';$('ngPct').value=t?(n/t*100).toLocaleString('vi-VN',{maximumFractionDigits:2})+'%':'0%'}$('total').oninput=calc;
$('code').onchange=()=>{$('name').value=productMap[$('code').value]||'';loadPlan()};$('inspectorCode').oninput=()=>{$('inspectorName').value=employeeMap[$('inspectorCode').value]||$('inspectorCode').value};
function defectsPayload(){return [...document.querySelectorAll('.defect')].filter(x=>Number(x.value)>0).map(x=>({code:x.dataset.code,label:x.dataset.label,group:x.dataset.group,detail:document.querySelector('.detail[data-code="'+CSS.escape(x.dataset.code)+'"]').value.trim(),qty:Number(x.value)}))}
$('form').onsubmit=async ev=>{ev.preventDefault();const total=Number($('total').value),ng=Number($('ng').value);if(!Number.isInteger(total)||total<=0||ng>total)return message('Tổng kiểm phải lớn hơn 0 và Tổng NG từ bảng lỗi không được vượt Tổng kiểm.',true);const d={inspection_date:$('date').value,shift:$('shift').value,product_code:$('code').value,product_name:$('name').value,inspector_code:$('inspectorCode').value.trim(),inspector_name:$('inspectorName').value.trim(),total_qty:total,defects:defectsPayload(),note:$('note').value};$('save').disabled=true;const {error}=await sb.rpc('oqc_save_daily_inspection',{p_id:editing,p_data:d,p_actor:identity});$('save').disabled=false;if(error)return message(error.message,true);message(editing?'Đã cập nhật và lưu lịch sử.':'Đã lưu kiểm tra OQC.');resetForm();loadStats()};
function resetForm(){editing=null;$('form').reset();$('date').value=localDate();renderDefects();calc()}async function loadPlan(){const code=$('code').value,d=$('date').value;if(!code||!d)return $('plan').value='';const x=new Date(d+'T00:00:00'),day=['cn','t2','t3','t4','t5','t6','t7'][x.getDay()],mon=new Date(x);mon.setDate(x.getDate()-((x.getDay()+6)%7));const [p,o]=await Promise.all([sb.from('cd_khsx_tuan_plan').select(day).eq('tuan_bat_dau',localDate(mon)).eq('cong_doan','OQC').eq('ma_sp',code).maybeSingle(),sb.from('oqc_daily_inspection').select('total_qty').eq('inspection_date',d).eq('product_code',code)]);const plan=Number(p.data?.[day])||0,checked=(o.data||[]).reduce((s,r)=>s+Number(r.total_qty),0);$('plan').value=plan.toLocaleString('vi-VN')+' / '+checked.toLocaleString('vi-VN')+' / '+Math.max(0,plan-checked).toLocaleString('vi-VN')}
function setPeriod(v){const now=new Date(),f=new Date(now);if(v==='week')f.setDate(now.getDate()-((now.getDay()+6)%7));else if(v==='month')f.setDate(1);else if(v==='custom')return;$('from').value=localDate(f);$('to').value=localDate(now);loadStats()}
async function loadStats(){const {data,error}=await sb.from('oqc_daily_inspection').select('*').gte('inspection_date',$('from').value).lte('inspection_date',$('to').value).order('created_at',{ascending:false});if(error)return message(error.message,true);const fp=$('filterProduct').value.toLowerCase(),fi=$('filterInspector').value.toLowerCase(),fs=$('filterShift').value;dataRows=(data||[]).filter(r=>(!fp||(r.product_code+' '+r.product_name).toLowerCase().includes(fp))&&(!fi||(r.inspector_code+' '+r.inspector_name).toLowerCase().includes(fi))&&(!fs||r.shift===fs));renderStats()}
function renderStats(){const t=dataRows.reduce((s,r)=>s+Number(r.total_qty),0),o=dataRows.reduce((s,r)=>s+Number(r.ok_qty),0),n=dataRows.reduce((s,r)=>s+Number(r.ng_qty),0);$('cards').innerHTML=[['Tổng kiểm',t],['OK',o],['NG',n],['%OK',t?(o/t*100).toFixed(2)+'%':'0%'],['%NG',t?(n/t*100).toFixed(2)+'%':'0%']].map(x=>'<div class="card">'+x[0]+'<b>'+x[1]+'</b></div>').join('');const dm={},pm={},tm={};dataRows.forEach(r=>{(r.defects||[]).forEach(x=>dm[x.label]=(dm[x.label]||0)+Number(x.qty));const p=pm[r.product_code]||(pm[r.product_code]={ng:0,total:0});p.ng+=Number(r.ng_qty);p.total+=Number(r.total_qty);tm[r.inspection_date]=(tm[r.inspection_date]||0)+Number(r.ng_qty)});const ds=Object.entries(dm).sort((a,b)=>b[1]-a[1]),max=ds[0]?.[1]||1;$('pareto').innerHTML=ds.map(([k,v])=>'<div>'+E(k)+' — '+v+'<div class="bar"><i style="width:'+(v/max*100)+'%"></i></div></div>').join('');$('topProducts').innerHTML=Object.entries(pm).sort((a,b)=>b[1].ng/b[1].total-a[1].ng/a[1].total).slice(0,10).map(([k,v])=>'<div>'+E(k)+' — '+v.ng+' NG / '+v.total+'</div>').join('');$('trend').innerHTML=Object.entries(tm).sort().map(([d,v])=>'<span style="display:inline-block;padding:8px;margin:3px;background:#fee2e2">'+d+': <b>'+v+' NG</b></span>').join('');$('rows').innerHTML=dataRows.map(r=>'<tr><td>'+new Date(r.created_at).toLocaleString('vi-VN')+'</td><td>'+E(r.shift)+'</td><td>'+E(r.product_code)+'</td><td>'+E(r.product_name)+'</td><td>'+E(r.inspector_code)+'</td><td>'+E(r.inspector_name)+'</td><td>'+r.total_qty+'</td><td>'+r.ok_qty+'</td><td>'+r.ng_qty+'</td><td>'+(r.total_qty?(r.ng_qty/r.total_qty*100).toFixed(2):0)+'%</td><td><button onclick="editRow('+r.id+')">Sửa</button></td></tr>').join('')}
function editRow(id){const r=dataRows.find(x=>x.id===id);if(!r)return;editing=id;$('date').value=r.inspection_date;$('shift').value=r.shift;$('code').value=r.product_code;$('name').value=r.product_name;$('inspectorCode').value=r.inspector_code;$('inspectorName').value=r.inspector_name;$('total').value=r.total_qty;$('note').value=r.note||'';renderDefects();(r.defects||[]).forEach(d=>{const q=document.querySelector('.defect[data-code="'+CSS.escape(d.code)+'"]'),z=document.querySelector('.detail[data-code="'+CSS.escape(d.code)+'"]');if(q)q.value=d.qty;if(z)z.value=d.detail||''});calc();scrollTo({top:0,behavior:'smooth'})}
function exportExcel(){const out=dataRows.map(r=>({Ngày:r.inspection_date,Ca:r.shift,Model:r.product_code,'Tên SP':r.product_name,'Mã NV':r.inspector_code,'Người kiểm':r.inspector_name,'Tổng kiểm':r.total_qty,OK:r.ok_qty,NG:r.ng_qty,'%OK':r.total_qty?r.ok_qty/r.total_qty:0,'%NG':r.total_qty?r.ng_qty/r.total_qty:0,...Object.fromEntries((r.defects||[]).map(x=>[(x.label+(x.detail?' — '+x.detail:'')),x.qty]))}));const ws=XLSX.utils.json_to_sheet(out),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'OQC');XLSX.writeFile(wb,'thong-ke-oqc.xlsx')}init();
</script></body></html>
