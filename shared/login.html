<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — MES Toyotaki</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #1a2744 0%, #2d3e5f 100%);
  }
  .box {
    background: #fff; border-radius: 12px; padding: 40px 32px; width: 100%; max-width: 360px;
    box-shadow: 0 10px 40px rgba(0,0,0,.25);
  }
  h1 { font-size: 20px; margin: 0 0 4px; color: #1a2744; }
  p.sub { margin: 0 0 24px; color: #667; font-size: 13px; }
  label { display: block; font-size: 13px; color: #445; margin-bottom: 6px; font-weight: 600; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid #ccd; border-radius: 8px; font-size: 14px;
    margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: #C87941; }
  button {
    width: 100%; padding: 11px; border: none; border-radius: 8px; background: #C87941; color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  button:hover:not(:disabled) { background: #b56a35; }
  .msg { margin-top: 14px; font-size: 13px; text-align: center; min-height: 18px; }
  .msg.error { color: #c0392b; }
  .msg.ok { color: #1a7a3c; }
</style>
</head>
<body>
  <div class="box">
    <h1>MES Toyotaki</h1>
    <p class="sub">Đăng nhập để tiếp tục</p>
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username">
      <label for="password">Mật khẩu</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit" id="submitBtn">Đăng nhập</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const returnTo = params.get('returnTo') || '../index.html';

    // Nếu đã đăng nhập sẵn, chuyển thẳng đi luôn (không bắt đăng nhập lại)
    MesAuth.getSession().then(session => {
      if (session) window.location.href = returnTo;
    });

    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      msg.className = 'msg';
      msg.textContent = 'Đang đăng nhập...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        msg.className = 'msg error';
        msg.textContent = 'Sai email hoặc mật khẩu.';
        submitBtn.disabled = false;
        return;
      }

      msg.className = 'msg ok';
      msg.textContent = 'Đăng nhập thành công, đang chuyển trang...';
      window.location.href = returnTo;
    });
  </script>
</body>
</html>
