<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duyệt cảnh báo IPQC</title>
<style>
:root{--nav:#172238;--blue:#1769aa;--red:#b42318;--amber:#b54708;--green:#067647;--line:#d0d5dd;--muted:#667085}*{box-sizing:border-box}body{margin:0;background:#f2f4f7;color:#101828;font:14px Arial,sans-serif}header{background:var(--nav);color:white;padding:15px 22px;display:flex;align-items:center;gap:15px}header a{color:#cce5ff}main{max-width:1500px;margin:auto;padding:18px}.panel{background:white;border:1px solid var(--line);border-radius:10px;margin-bottom:15px;overflow:hidden}.head{padding:13px 16px;font-weight:bold;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.body{padding:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:bold;color:#475467}.full{grid-column:1/-1}.two{grid-column:span 2}input,select,textarea{padding:9px;border:1px solid #98a2b3;border-radius:6px;background:#fff;color:#101828;font:inherit}textarea{min-height:64px}.reason-box{padding:12px;background:#f9fafb;border:1px solid var(--line);border-radius:8px}.hidden{display:none!important}.btn{padding:9px 13px;border:0;border-radius:6px;font-weight:bold;cursor:pointer}.primary{background:var(--blue);color:white}.approve{background:var(--green);color:white}.reject{background:var(--red);color:white}.override{background:#7f56d9;color:white}.secondary{background:#e4e7ec}.notice{padding:12px;border-radius:7px;font-weight:800;text-align:center}.blocked{background:#fee4e2;color:var(--red)}.allowed{background:#d1fadf;color:var(--green)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px;border-bottom:1px solid #eaecf0;text-align:left;vertical-align:top}th{color:#475467;background:#f9fafb}.chip{padding:3px 7px;border-radius:12px;background:#f2f4f7;white-space:nowrap}.actions{display:flex;gap:6px;flex-wrap:wrap}.audit{border-left:3px solid #98a2b3;padding:5px 10px;margin:6px 0}.help{color:var(--muted);font-size:12px}@media(max-width:900px){.grid{grid-template-columns:1fr}.two,.full{grid-column:auto}}
</style></head><body>
<header><b>TOYOTAKI — DUYỆT CẢNH BÁO IPQC</b><a href="qc-manager.html">← QC Giám sát</a><span id="who" style="margin-left:auto">Đang kiểm tra đăng nhập...</span></header>
<main>
<section class="panel"><div class="head"><span>Tạo yêu cầu tiếp tục sản xuất</span><button class="btn secondary" onclick="resetForm()">Làm mới</button></div><div class="body">
<div class="notice blocked">CHƯA ĐƯỢC PHÉP TIẾP TỤC SẢN XUẤT</div><br>
<form id="requestForm"><div class="grid">
<input type="hidden" id="checkpointId">
<div class="field"><label>Máy *</label><input id="machine" required></div><div class="field"><label>Công đoạn *</label><input id="process" required></div>
<div class="field"><label>Mã sản phẩm *</label><input id="productCode" required></div><div class="field"><label>LOT *</label><input id="lotNo" required></div>
<div class="field two"><label>Nội dung cảnh báo *</label><textarea id="warningContent" required></textarea></div>
<div class="field"><label>Giá trị thực tế</label><input id="actualValue"></div><div class="field"><label>Mức cảnh báo</label><select id="warningLevel"><option value="NG">Đã NG</option><option value="RISK">Nguy cơ NG</option><option value="EARLY_WARNING">Xu hướng tiến gần NG</option></select></div>
<div class="field"><label>Tiêu chuẩn Min</label><input id="standardMin"></div><div class="field"><label>Tiêu chuẩn Max</label><input id="standardMax"></div>
<div class="field two"><label>Loại lý do *</label><select id="reasonType" onchange="reasonChanged()"><option value="TIME">1. Tiếp tục chạy theo thời gian</option><option value="PLAN_QTY">2. Chạy đủ sản lượng KHSX</option><option value="DOWNSTREAM_REWORK">3. Công đoạn sau sửa/lựa hàng</option><option value="EARLY_WARNING">4. Xu hướng tiến gần NG</option></select></div>
<div class="field two"><label>Lý do đề nghị chi tiết *</label><textarea id="reasonDetail" required></textarea></div>
<div id="timeFields" class="reason-box full grid"><div class="field"><label>Cách giới hạn</label><select id="timeMode" onchange="reasonChanged()"><option value="until">Chạy đến giờ</option><option value="hours">Chạy thêm số giờ</option></select></div><div class="field" id="untilField"><label>Được chạy đến *</label><input type="datetime-local" id="allowedUntil"></div><div class="field hidden" id="hoursField"><label>Số giờ được chạy thêm *</label><input type="number" min=".1" step=".1" id="allowedHours"></div></div>
<div id="qtyFields" class="reason-box full hidden grid"><div class="field"><label>Số lượng được chạy thêm (pcs) *</label><input type="number" min="1" id="allowedQty"></div><div class="field"><label>Sản lượng thực tế hiện tại</label><input type="number" min="0" id="producedCurrent" value="0"></div></div>
<div id="repairFields" class="reason-box full hidden grid"><div class="field"><label>Công đoạn/BP chịu trách nhiệm sửa *</label><input id="repairDepartment"></div><div class="field two"><label>Nội dung xử lý *</label><textarea id="treatmentContent"></textarea></div><div class="field"><label>Thời hạn hoàn thành *</label><input type="datetime-local" id="treatmentDeadline"></div></div>
</div><br><button class="btn primary" id="createBtn">Gửi yêu cầu phê duyệt</button></form></div></section>
<section class="panel"><div class="head"><span>Danh sách yêu cầu và tình trạng phê duyệt</span><button class="btn secondary" onclick="loadRequests()">Làm mới</button></div><div class="body"><div class="table-wrap"><table><thead><tr><th>Yêu cầu / cảnh báo</th><th>Máy / SP / LOT</th><th>Lý do & phạm vi</th><th>Duyệt</th><th>Hiệu lực</th><th>Thao tác</th></tr></thead><tbody id="requests"></tbody></table></div></div></section>
<section class="panel hidden" id="auditPanel"><div class="head"><span>Lịch sử audit — không thể xóa</span><button class="btn secondary" onclick="document.getElementById('auditPanel').classList.add('hidden')">Đóng</button></div><div class="body" id="auditBody"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="shared/supabase-client.js"></script><script src="shared/navbar.js"></script>
<script>
let identity='',session=null,rows=[]; const $=id=>document.getElementById(id),v=id=>$(id).value.trim(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function reasonChanged(){const t=v('reasonType'),tm=v('timeMode');$('timeFields').classList.toggle('hidden',t!=='TIME');$('qtyFields').classList.toggle('hidden',!['PLAN_QTY','DOWNSTREAM_REWORK'].includes(t));$('repairFields').classList.toggle('hidden',t!=='DOWNSTREAM_REWORK');$('untilField').classList.toggle('hidden',tm!=='until');$('hoursField').classList.toggle('hidden',tm!=='hours');}
function iso(id){return v(id)?new Date(v(id)).toISOString():null}
function scope(r){if(r.approved_scope)return r.approved_scope;if(r.reason_type==='TIME')return r.allowed_until?'Đề nghị chạy đến '+new Date(r.allowed_until).toLocaleString('vi-VN'):'Đề nghị chạy thêm '+r.allowed_hours+' giờ';if(r.reason_type==='PLAN_QTY')return 'Đề nghị chạy thêm '+Number(r.allowed_qty).toLocaleString('vi-VN')+' pcs để đủ KHSX';if(r.reason_type==='DOWNSTREAM_REWORK')return 'Đề nghị chạy '+Number(r.allowed_qty).toLocaleString('vi-VN')+' pcs; '+r.repair_department+' sửa/lựa';return 'Cảnh báo sớm — yêu cầu điều chỉnh trước khi NG';}
function remaining(r){if(r.status!=='Đang có hiệu lực')return '—';const parts=[];if(r.expired_at){const ms=new Date(r.expired_at)-Date.now();parts.push(ms<=0?'Đã hết giờ':Math.floor(ms/3600000)+' giờ '+Math.floor(ms%3600000/60000)+' phút')}if(r.allowed_qty!=null)parts.push(Math.max(0,Number(r.allowed_qty)-(Number(r.produced_current)-Number(r.produced_at_request)))+' pcs còn lại');return parts.join(' / ')||'Theo điều kiện duyệt'}
async function init(){session=await MesAuth.getSession();if(!session){location.href='shared/login.html?returnTo='+encodeURIComponent(location.href);return}identity=await MesAuth.getCurrentUserIdentity()||session.user.email;$('who').textContent=identity;const q=new URLSearchParams(location.search);['checkpointId','machine','process','productCode','lotNo','warningContent','actualValue','standardMin','standardMax','warningLevel'].forEach(id=>{if(q.has(id))$(id).value=q.get(id)});reasonChanged();loadRequests()}
$('requestForm').addEventListener('submit',async e=>{e.preventDefault();const type=v('reasonType');const d={checkpoint_id:v('checkpointId'),machine:v('machine'),process:v('process'),product_code:v('productCode'),lot_no:v('lotNo'),warning_content:v('warningContent'),actual_value:v('actualValue'),standard_min:v('standardMin'),standard_max:v('standardMax'),warning_level:v('warningLevel'),reason_type:type,reason_detail:v('reasonDetail'),allowed_until:type==='TIME'&&v('timeMode')==='until'?iso('allowedUntil'):null,allowed_hours:type==='TIME'&&v('timeMode')==='hours'?v('allowedHours'):null,allowed_qty:['PLAN_QTY','DOWNSTREAM_REWORK'].includes(type)?v('allowedQty'):null,produced_current:v('producedCurrent')||0,repair_department:type==='DOWNSTREAM_REWORK'?v('repairDepartment'):null,treatment_content:type==='DOWNSTREAM_REWORK'?v('treatmentContent'):null,treatment_deadline:type==='DOWNSTREAM_REWORK'?iso('treatmentDeadline'):null};if(type==='TIME'&&!d.allowed_until&&!Number(d.allowed_hours))return alert('Nhập giờ kết thúc hoặc số giờ được chạy thêm');if(['PLAN_QTY','DOWNSTREAM_REWORK'].includes(type)&&!Number(d.allowed_qty))return alert('Nhập số lượng cần chạy thêm');if(type==='DOWNSTREAM_REWORK'&&(!d.repair_department||!d.treatment_content||!d.treatment_deadline))return alert('Nhập đủ bộ phận sửa, nội dung xử lý và thời hạn');$('createBtn').disabled=true;const {error}=await sb.rpc('duc_ipqc_create_continue_request',{p_data:d,p_actor:identity});$('createBtn').disabled=false;if(error)return alert('Không tạo được yêu cầu: '+error.message);alert('Đã gửi yêu cầu. CHƯA ĐƯỢC PHÉP tiếp tục sản xuất cho đến khi duyệt đủ.');resetForm();loadRequests()});
function resetForm(){$('requestForm').reset();reasonChanged()}
async function loadRequests(){await sb.rpc('duc_ipqc_refresh_continue_request',{p_request_id:null});const {data,error}=await sb.from('duc_ipqc_continue_request').select('*,duc_ipqc_continue_approval(*)').order('created_at',{ascending:false}).limit(200);if(error){$('requests').innerHTML='<tr><td colspan="6">'+esc(error.message)+' — hãy chạy migration T36.</td></tr>';return}rows=data||[];render()}
function render(){$('requests').innerHTML=rows.map(r=>{const ap=(r.duc_ipqc_continue_approval||[]).sort((a,b)=>a.step_no-b.step_no);const approved=ap.filter(x=>x.decision).map(x=>x.approval_level+': '+x.decision).join('<br>')||'Chưa cấp nào duyệt';const waiting=ap.find(x=>!x.decision);const live=r.status==='Đang có hiệu lực';const pending=!['Từ chối','Đã hủy','Đang có hiệu lực','Hết hiệu lực'].includes(r.status);return '<tr><td><b>'+esc(r.request_code)+'</b><br><span class="chip">'+esc(r.status)+'</span><br>'+esc(r.warning_content)+'<br>Thực tế: '+esc(r.actual_value||'—')+' · Min/Max: '+esc(r.standard_min||'—')+'/'+esc(r.standard_max||'—')+'<br>Người đề nghị: '+esc(r.requester_name)+'</td><td><b>'+esc(r.machine)+'</b> / '+esc(r.process)+'<br>'+esc(r.product_code)+' / LOT '+esc(r.lot_no)+'</td><td>'+esc(r.reason_detail)+'<br><b>'+esc(scope(r))+'</b></td><td>'+approved+'<br><b>Đang chờ: '+esc(waiting?waiting.approval_level:'—')+'</b></td><td><div class="notice '+(live?'allowed':'blocked')+'">'+(live?'ĐƯỢC PHÉP TIẾP TỤC CÓ ĐIỀU KIỆN':'CHƯA ĐƯỢC PHÉP TIẾP TỤC SẢN XUẤT')+'</div><br>'+esc(remaining(r))+'</td><td><div class="actions">'+(pending?'<button class="btn approve" onclick="decide('+r.id+',\'Duyệt\')">Duyệt bước hiện tại</button><button class="btn reject" onclick="decide('+r.id+',\'Từ chối\')">Từ chối</button><button class="btn override" onclick="decide('+r.id+',\'Phê duyệt trực tiếp\')">GĐSX duyệt trực tiếp</button><button class="btn secondary" onclick="cancelRequest('+r.id+')">Hủy yêu cầu</button>':'')+(live&&r.allowed_qty!=null?'<button class="btn secondary" onclick="production('+r.id+','+r.produced_current+')">Cập nhật sản lượng</button>':'')+'<button class="btn secondary" onclick="audit('+r.id+')">Lịch sử</button></div></td></tr>'}).join('')||'<tr><td colspan="6">Chưa có yêu cầu.</td></tr>'}
async function decide(id,d){const note=prompt(d==='Phê duyệt trực tiếp'?'Bắt buộc nhập lý do phê duyệt trực tiếp:':'Ghi chú quyết định:');if(note===null)return;if(d==='Phê duyệt trực tiếp'&&!note.trim())return alert('Bắt buộc nhập lý do override');const {error}=await sb.rpc('duc_ipqc_decide_continue_request',{p_request_id:id,p_decision:d,p_actor:identity,p_note:note});if(error)return alert(error.message);loadRequests()}
async function production(id,current){const qty=prompt('Nhập tổng sản lượng thực tế hiện tại:',current);if(qty===null)return;if(!Number.isFinite(Number(qty))||Number(qty)<0)return alert('Sản lượng không hợp lệ');const {error}=await sb.rpc('duc_ipqc_update_continue_production',{p_request_id:id,p_produced_current:Number(qty),p_actor:identity});if(error)return alert(error.message);loadRequests()}
async function cancelRequest(id){const reason=prompt('Nhập lý do hủy yêu cầu:');if(reason===null)return;if(!reason.trim())return alert('Bắt buộc nhập lý do hủy');const {error}=await sb.rpc('duc_ipqc_cancel_continue_request',{p_request_id:id,p_actor:identity,p_reason:reason});if(error)return alert(error.message);loadRequests()}
async function audit(id){const {data,error}=await sb.from('duc_ipqc_continue_audit').select('*').eq('request_id',id).order('created_at',{ascending:false});if(error)return alert(error.message);$('auditPanel').classList.remove('hidden');$('auditBody').innerHTML=(data||[]).map(a=>'<div class="audit"><b>'+esc(a.action)+'</b> — '+new Date(a.created_at).toLocaleString('vi-VN')+' — '+esc(a.actor_name)+'<br><span class="help">'+esc(JSON.stringify(a.detail))+'</span></div>').join('');$('auditPanel').scrollIntoView({behavior:'smooth'})}
setInterval(()=>{render()},30000);init();
</script></body></html>
