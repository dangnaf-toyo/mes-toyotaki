<!DOCTYPE html>
<html lang="vi">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<!--
  bavia-tem-xuat-hang.html — T130. Tổ Bavia quét QR tem Đúc để ghi nhận sản
  lượng (SL OK mặc định = SL còn trên tem, sửa được + khai báo NG theo loại).
  Phần OK cộng vào "đang gom" theo mã SP; đủ SL/thùng (Danh mục SP → SL/thùng
  theo công đoạn → Bavia) thì server tự tạo tem thành phẩm (Tag No TP…) và
  trang in ngay TEM XUẤT HÀNG theo mẫu khách:
    - FCC: Phiếu quản lý lô sản phẩm (A4 dọc, 2 phiếu/tờ).
    - Astemo / Soji / Mikasa / Cosmos: TEM HÀNG (A4 ngang, 4 tem/tờ).
  Mẫu theo các file "Excel file/Tem xuất hàng *.xlsx", thêm QR + Tag No để
  OQC / Nhập kho / Xuất hàng quét tiếp và truy xuất ngược về tem Đúc.
  Chỉ mã có Bavia là công đoạn SX cuối (sau Bavia là OQC / Nhập kho).
  RPC: bavia_xh_ghi_nhan / bavia_xh_dong_thung_le / bavia_xh_huy_ghi_nhan /
  bavia_xh_du_lieu_in / bavia_xh_thong_tin_ma — supabase/migration_phase_T130_bavia_tem_xuat_hang.sql.
-->
<style>
:root{
  --bg-page:#EEF1F5;--bg-panel:#FFFFFF;--bg-sunken:#F5F7FA;--border:#D9DFE5;--border-strong:#B8C1CC;
  --text:#0F172A;--text-muted:#64748B;--text-dim:#94A3B8;--accent:#0F5FA5;--accent-hover:#0A4681;
  --ok-fg:#047857;--ok-bg:#ECFDF5;--ok-bd:#A7E3C6;--warn-fg:#B45309;--warn-bg:#FFFBEB;--warn-bd:#F5DFB0;
  --alarm-fg:#B91C1C;--alarm-bg:#FEF2F2;--alarm-bd:#FCA5A5;--shadow-sm:0 1px 2px rgba(15,23,42,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg-page);color:var(--text);font-size:14px;line-height:1.35;-webkit-font-smoothing:antialiased}
body{padding:8px 8px 40px}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:start}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
@media (max-width:860px){.wrap{grid-template-columns:1fr}}
.card{background:var(--bg-panel);border-radius:11px;box-shadow:var(--shadow-sm);border:1px solid var(--border);padding:11px 13px}
.card h2{font-size:11.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.card h2 .sp{flex:1}
label{display:block;font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:3px}
select,input[type=text],input[type=number]{width:100%;padding:9px 10px;border:1.5px solid var(--border-strong);border-radius:8px;font-family:inherit;font-size:15px;font-weight:600;background:#fff;color:var(--text);outline:none}
select:focus,input:focus{border-color:var(--accent)}
.btn{border:none;border-radius:9px;padding:11px 14px;font-family:inherit;font-size:14.5px;font-weight:800;cursor:pointer;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--accent-hover)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
.btn.ghost:hover{background:#EFF6FF}
.btn.ok{background:#047857}.btn.ok:hover{background:#065F46}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:7px}
.btn.danger{background:#fff;color:var(--alarm-fg);border:1.5px solid var(--alarm-bd)}
.row{display:flex;gap:8px;align-items:center}
.row > input{flex:1;min-width:0}
.muted{font-size:12px;color:var(--text-muted)}
.hint{font-size:11.5px;color:var(--text-dim);margin-top:5px;line-height:1.4}
.msg{display:none;padding:9px 12px;border-radius:9px;font-weight:600;font-size:13.5px;grid-column:1/-1}
.msg.show{display:block}
.msg.ok{background:var(--ok-bg);color:var(--ok-fg);border:1px solid var(--ok-bd)}
.msg.err{background:var(--alarm-bg);color:var(--alarm-fg);border:1px solid var(--alarm-bd)}
.msg.warn{background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn-bd)}
.scan-input{font-family:'JetBrains Mono',monospace;font-size:17px!important}
.tem{display:none;margin-top:10px;border:1.5px solid var(--border);border-radius:10px;padding:10px;background:var(--bg-sunken)}
.tem.show{display:block}
.tem .kv{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:3px 10px;font-size:12.5px}
.tem .kv .k{color:var(--text-muted);font-weight:600}
.tem .kv .v{font-weight:700;font-family:'JetBrains Mono',monospace;font-size:12.5px;word-break:break-word}
.tem .bad{margin-top:8px;color:var(--alarm-fg);font-weight:700;font-size:13px}
.tem .f{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ng-row{display:grid;grid-template-columns:minmax(0,1fr) 92px 34px;gap:6px;margin-top:6px}
.ng-row button{border:1.5px solid var(--border-strong);background:#fff;border-radius:8px;font-weight:800;color:var(--alarm-fg);cursor:pointer}
.sum-line{margin-top:8px;font-size:12.5px;font-weight:600;color:var(--text-muted)}
.sum-line b{color:var(--text)}
.gom{border:1px solid var(--border);border-radius:10px;padding:9px 10px;margin-top:8px}
.gom:first-of-type{margin-top:0}
.gom .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gom .h .ma{font-weight:800;font-family:'JetBrains Mono',monospace}
.gom .h .kh{font-size:12px;color:var(--text-muted)}
.gom .h .n{margin-left:auto;font-family:'JetBrains Mono',monospace;font-weight:800}
.bar{height:9px;border-radius:5px;background:#E2E8F0;margin:6px 0;overflow:hidden}
.bar i{display:block;height:100%;background:#0F5FA5;border-radius:5px}
.gom .it{display:flex;align-items:center;gap:8px;font-size:12px;padding:3px 0;border-top:1px dashed var(--border)}
.gom .it .t{font-family:'JetBrains Mono',monospace;font-weight:600}
.gom .it .sp{flex:1}
.lst{max-height:360px;overflow:auto}
.li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--border);font-size:12.5px}
.li:last-child{border-bottom:none}
.li .t{font-family:'JetBrains Mono',monospace;font-weight:700}
.li .sp{flex:1;min-width:0}
.li .s{font-size:11.5px;color:var(--text-muted)}
.li.huy{opacity:.5;text-decoration:line-through}
.tag-le{font-size:10.5px;font-weight:700;color:var(--warn-fg);background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:6px;padding:0 5px}
.empty{color:var(--text-dim);font-style:italic;font-size:12.5px;padding:6px 0}
.opt{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12.5px;margin-top:8px}
.opt label{display:flex;align-items:center;gap:5px;margin:0;font-size:12.5px;color:var(--text);font-weight:600}
.opt input[type=number]{width:62px;padding:5px 7px;font-size:13px}
.qr-modal{position:fixed;inset:0;background:rgba(15,23,42,.75);display:none;align-items:center;justify-content:center;z-index:500;padding:14px}
.qr-modal.show{display:flex}
.qr-box{background:#fff;border-radius:12px;padding:12px;width:min(420px,100%)}
#qrReaderDiv{width:100%}
</style>
</head>
<body>
<div class="wrap" id="mainUI" style="display:none">
  <div class="msg" id="msg"></div>

  <div class="col">
    <div class="card">
      <h2><span class="sp">① Quét tem Đúc</span></h2>
      <div class="row">
        <input type="text" id="scanInput" class="scan-input" placeholder="Quét QR / nhập Tag No tem Đúc…" autocomplete="off" autofocus>
        <button class="btn ghost" id="btnCam" type="button" title="Quét bằng camera">📷</button>
      </div>
      <div class="opt">
        <label><input type="checkbox" id="optAuto"> Tự ghi nhận nguyên SL tem khi quét (không NG)</label>
      </div>

      <div class="tem" id="temBox">
        <div class="kv" id="temKv"></div>
        <div class="bad" id="temBad" hidden></div>
        <div id="temForm">
          <div class="f">
            <div><label for="slOk">Số lượng OK (pcs)</label><input type="number" id="slOk" min="0" inputmode="numeric"></div>
            <div><label>&nbsp;</label><button class="btn ghost" type="button" id="btnAddNg" style="width:100%">＋ Thêm NG</button></div>
          </div>
          <div id="ngRows"></div>
          <div class="sum-line" id="sumLine"></div>
          <div class="row" style="margin-top:10px">
            <button class="btn ok" type="button" id="btnGhi" style="flex:1">✅ Ghi nhận</button>
            <button class="btn ghost" type="button" id="btnBo">Bỏ qua</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2><span class="sp">② Đang gom thùng</span><button class="btn ghost sm" type="button" id="btnReload">↻</button></h2>
      <div id="gomList"><div class="empty">Đang tải…</div></div>
      <div class="hint">Đủ SL/thùng là tự in tem. Hết lô / cuối ca: bấm <b>Đóng thùng lẻ</b> để in thùng thiếu. Quét nhầm: bấm ✖ ở lần quét chưa vào thùng nào.</div>
    </div>
  </div>

  <div class="col">
    <div class="card">
      <h2><span class="sp">③ Tem xuất hàng đã in hôm nay</span></h2>
      <div class="opt" style="margin:0 0 6px">
        <label>Số bản in / thùng <input type="number" id="optBan" min="1" max="6" value="1"></label>
        <label><input type="checkbox" id="optTuIn" checked> Tự mở hộp in khi đủ thùng</label>
      </div>
      <div class="lst" id="temList"><div class="empty">Đang tải…</div></div>
    </div>

    <div class="card">
      <h2><span class="sp">Các lần quét hôm nay</span></h2>
      <div class="lst" id="scanList"><div class="empty">Đang tải…</div></div>
    </div>
  </div>
</div>

<div class="qr-modal" id="qrModal">
  <div class="qr-box">
    <div id="qrReaderDiv"></div>
    <div class="row" style="margin-top:8px">
      <button class="btn ghost" type="button" id="btnFile" style="flex:1">🖼 Chọn ảnh QR</button>
      <button class="btn" type="button" id="btnCloseCam" style="flex:1">Đóng</button>
    </div>
    <input type="file" id="qrFile" accept="image/*" hidden>
    <canvas id="scanCanvas" hidden></canvas>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="shared/supabase-client.js"></script>
<script src="shared/navbar.js"></script>
<script>
// Bộ mã lỗi NG — dùng chung danh sách của Bảng điều khiển Bavia (cong-doan-dashboard.html NG_CODES).
const NG_TYPES = ['Rỗ khí','Thiếu nhôm bề mặt','Lõm pin','Biến dạng','Dính dầu','Nhăn','Bẩn nhôm','Va đập','Rạn nứt',
  'Sản phẩm rơi','NG kích thước','Thiếu nhôm cạnh răng','Mờ lot mark','Ba trấu','Bề lõm sâu','Dính nhôm','Bong nhôm',
  'Tạp chất','Xước bề mặt','Mỏng cuống','Phồng nhôm','Lỗi, lõm','Bavia sót','Khác'];

// Tên khách in trên tem (theo file mẫu Excel) — khớp theo ten_khach_hang trong Danh mục SP.
const KHACH = [
  { re: /cosmos/i, ten: 'CÔNG TY TNHH CÔNG NGHỆ COSMOS', nguoiKiem: false },
  { re: /mikasa/i, ten: 'CÔNG TY TNHH MIKASA VIỆT NAM', nguoiKiem: true, partNo: true },
  { re: /soji/i,   ten: 'CÔNG TY CỔ PHẦN ĐIỆN TỬ SOJI', nguoiKiem: false },
  { re: /astemo/i, ten: null, nguoiKiem: false },
];
const NHA_SX = 'Công ty Cổ Phần Công Nghiệp Toyotaki<br>KCN Khai Quang, P. Vĩnh Phúc, T. Phú Thọ, Việt Nam';
const LOGO = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iODIiIGhlaWdodD0iNzciIHZpZXdCb3g9IjAgMCA4MiA3NyIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHBhdGggZmlsbC1ydWxlPSJldmVub2RkIiBjbGlwLXJ1bGU9ImV2ZW5vZGQiIGQ9Ik0yMC42MTE5IDIwLjU3OTlWNTEuMTAzM0gyNS4yMTcxVjE2LjEyNDlIMFYwLjg2MDM1Mkg0NC4xMTI2VjMxLjMwMzhMNDcuNzc4NyAyNy42NDcyTDY1LjgwNjQgNTEuMTAzM0g3MS43NjkzTDUxLjE1MzYgMjQuMjgwM0w3NC42MjU0IDAuODYwMzUySDgyTDU3Ljk5NCAyNC44NDA1TDgwLjU2OSA1Ni4yOTE5SDYzLjIwMjlMNDcuMTk2MyAzNS42MjUzTDM4Ljg2MTMgNDMuOTUwMlY2LjA0ODlINS4yNTEzMlYxMC45MzY0SDMwLjQ2ODRWNTYuMjkxOUgxNS4zNjA1VjIwLjU3OTlIMjAuNjExOVoiIGZpbGw9IiNDQTY2MjciLz4KPC9zdmc+Cg==';

let me = '';
let curTem = null;      // tem Đúc đang mở
let curInfo = null;     // bavia_xh_thong_tin_ma của mã
let busy = false;

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function num(n){ return (Number(n) || 0).toLocaleString('vi-VN'); }
function dmy(d, sep){ if (!d) return ''; const s = String(d).slice(0, 10).split('-'); return s.length === 3 ? s[2] + (sep || '/') + s[1] + (sep || '/') + s[0] : String(d); }
function hm(ts){ return ts ? new Date(ts).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', hour12: false }) : ''; }
function todayVN(){ return new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10); }
function tenNguoi(s){ s = String(s || ''); const i = s.indexOf('_'); return i > 0 && /^\d+$/.test(s.slice(0, i)) ? s.slice(i + 1) : s; }
function lsGet(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
function parseTagNo(raw){ const s = String(raw || '').trim(); if (!s) return ''; return (s.includes('>') ? s.split('>')[0] : s).replace(/\s+/g, ''); }
let msgTimer = null;
function showMsg(t, kind){
  const el = document.getElementById('msg');
  el.className = 'msg show ' + (kind || 'ok'); el.textContent = t;
  clearTimeout(msgTimer);
  if (kind !== 'err') msgTimer = setTimeout(() => el.classList.remove('show'), 6000);
}

/* ── Quét tem Đúc ─────────────────────────────────────────────────────────── */
// Đầu đọc QR rời gõ cả chuỗi QR nhiều trường nối '>\n' → mỗi \n là 1 Enter.
// Lấy giá trị ở Enter đầu, xoá ô ngay, gộp các Enter liền nhau (giống truy-xuat-nguon-goc).
let scanBuf = '', scanTimer = null;
document.getElementById('scanInput').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const v = e.target.value; e.target.value = '';
  if (!scanBuf) scanBuf = v;
  clearTimeout(scanTimer);
  scanTimer = setTimeout(() => { const s = scanBuf; scanBuf = ''; moTem(s); }, 120);
});

async function moTem(raw){
  const tag = parseTagNo(raw);
  if (!tag) return;
  dongTem();
  const { data: t, error } = await sb.from('duc_tem').select('*').eq('tag_no', tag).maybeSingle();
  if (error) return showMsg('Lỗi đọc tem: ' + error.message, 'err');
  if (!t) return showMsg('Không tìm thấy tem ' + tag, 'err');
  const { data: info, error: e2 } = await sb.rpc('bavia_xh_thong_tin_ma', { p_ma_sp: t.ma_sp });
  if (e2) return showMsg('Lỗi đọc mã SP: ' + e2.message, 'err');
  curTem = t; curInfo = info; okSuaTay = false;

  const { data: loc } = await sb.from('cd_v_vi_tri_hien_tai').select('vi_tri_hien_tai').eq('tag_no', tag).maybeSingle();
  const kv = [
    ['Tag No', t.tag_no], ['Mã SP', t.ma_sp],
    ['Khách hàng', (info && info.ten_khach_hang) || '—'], ['SL/thùng', info && info.ok ? num(info.sl_thung) + ' pcs' : '—'],
    ['Còn trên tem', num(t.so_luong) + ' pcs'], ['Ngày đúc', dmy(t.ngay)],
    ['Máy', t.may_tt || t.may_duc_chi_thi || '—'], ['Khuôn', t.so_khuon || '—'],
    ['Vị trí', (loc && loc.vi_tri_hien_tai) || 'Đúc'], ['Mẫu tem', info && info.ok ? (info.mau === 'fcc' ? 'Phiếu QL lô FCC' : 'TEM HÀNG') : '—'],
  ];
  document.getElementById('temKv').innerHTML = kv.map(([k, v]) => '<div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div>').join('');

  let bad = '';
  if (t.trang_thai === 'Chờ đóng gói TP' || t.trang_thai === 'Đã đóng gói TP') bad = 'Đây là tem thành phẩm / tem xuất hàng — hãy quét tem Đúc.';
  else if (!info || !info.ok) bad = (info && info.error) || 'Mã SP không dùng tem xuất hàng Bavia.';
  else if (!(Number(t.so_luong) > 0)) bad = 'Tem đã hết số lượng (đã ghi nhận hết).';
  const badEl = document.getElementById('temBad');
  badEl.hidden = !bad; badEl.textContent = bad ? '⛔ ' + bad : '';
  document.getElementById('temForm').style.display = bad ? 'none' : '';
  document.getElementById('temBox').classList.add('show');
  if (bad) { showMsg(bad, 'err'); focusScan(); return; }

  document.getElementById('slOk').value = Number(t.so_luong) || 0;
  document.getElementById('ngRows').innerHTML = '';
  capNhatTong();
  if (document.getElementById('optAuto').checked) return ghiNhan();
  const ok = document.getElementById('slOk'); ok.focus(); ok.select();
}
function dongTem(){
  curTem = null; curInfo = null;
  document.getElementById('temBox').classList.remove('show');
}
function focusScan(){ setTimeout(() => document.getElementById('scanInput').focus(), 50); }

function themNg(){
  const d = document.createElement('div');
  d.className = 'ng-row';
  d.innerHTML = '<select class="ng-loai"><option value="">— Loại NG —</option>' + NG_TYPES.map(x => '<option>' + esc(x) + '</option>').join('') + '</select>' +
    '<input type="number" class="ng-sl" min="0" placeholder="SL" inputmode="numeric"><button type="button" title="Xoá dòng">✕</button>';
  d.querySelector('button').onclick = () => { d.remove(); capNhatTong(); };
  d.querySelector('.ng-sl').addEventListener('input', () => {
    // NG nhập thêm thì OK tự giảm tương ứng (giữ OK + NG = SL tem) nếu người dùng chưa sửa OK.
    capNhatTong(true);
  });
  document.getElementById('ngRows').appendChild(d);
  d.querySelector('select').focus();
}
function layNg(){
  return [...document.querySelectorAll('#ngRows .ng-row')].map(r => ({ loai: r.querySelector('.ng-loai').value, so_luong: Number(r.querySelector('.ng-sl').value) || 0 }))
    .filter(x => x.so_luong > 0 || x.loai);
}
let okSuaTay = false;
function capNhatTong(tuNg){
  if (!curTem) return;
  const con = Number(curTem.so_luong) || 0;
  const ng = layNg().reduce((s, x) => s + x.so_luong, 0);
  const okEl = document.getElementById('slOk');
  if (tuNg && !okSuaTay) okEl.value = Math.max(0, con - ng);
  const ok = Number(okEl.value) || 0;
  const du = con - ok - ng;
  document.getElementById('sumLine').innerHTML = 'OK <b>' + num(ok) + '</b> + NG <b>' + num(ng) + '</b> = <b>' + num(ok + ng) + '</b> / ' + num(con) + ' pcs' +

}

async function ghiNhan(){
  if (!curTem || busy) return;
  const ng = layNg();
  if (ng.some(x => x.so_luong > 0 && !x.loai)) return showMsg('Chọn loại NG cho mọi dòng có số lượng.', 'err');
  busy = true; document.getElementById('btnGhi').disabled = true;
  try {
    const { data, error } = await sb.rpc('bavia_xh_ghi_nhan', {
      p_tag_no: curTem.tag_no, p_sl_ok: Number(document.getElementById('slOk').value) || 0,
      p_ng: ng.filter(x => x.so_luong > 0), p_nguoi: me });
    if (error) throw new Error(error.message);
    if (!data || !data.ok) throw new Error((data && data.error) || 'Không ghi nhận được');
    const moi = data.tem_moi || [];
    showMsg('✅ ' + data.tag_no + ': OK ' + num(data.sl_ok) + (data.sl_ng ? ', NG ' + num(data.sl_ng) : '') +
      ' — mã ' + data.ma_sp + ' đang gom ' + num(data.gom) + '/' + num(data.sl_thung) +
      (moi.length ? ' · đã tạo ' + moi.length + ' thùng: ' + moi.join(', ') : '') +
      (data.id_tram ? '' : ' (chưa có trạm Bavia hôm nay cho mã này — sản lượng chưa vào báo cáo ca)'), data.id_tram ? 'ok' : 'warn');
    dongTem(); okSuaTay = false;
    if (moi.length && document.getElementById('optTuIn').checked) await inTem(moi);
    await taiLai();
  } catch (e) {
    showMsg(e.message, 'err');
  } finally {
    busy = false; document.getElementById('btnGhi').disabled = false; focusScan();
  }
}

async function taiLai(){
  const today = todayVN();
  const [gomR, scanR, temR] = await Promise.all([
    sb.from('bavia_xh_ghi_nhan').select('*').gt('sl_con_gom', 0).eq('da_huy', false).order('thoi_diem'),
    sb.from('bavia_xh_ghi_nhan').select('*').eq('ngay', today).order('thoi_diem', { ascending: false }).limit(300),
    sb.from('duc_tem').select('tag_no,ma_sp,ten_sp,so_luong_tt,ten_khach_hang,ghi_chu,ngay_gio_in,nguoi_tt')
      .eq('tram_cong_doan', 'Bavia').like('ghi_chu', 'Tem xuất hàng Bavia%')
      .gte('ngay_gio_in', today + 'T00:00:00+07:00').order('ngay_gio_in', { ascending: false }).limit(300),
  ]);
  renderGom(gomR.data || []);
  renderScans(scanR.data || []);
  renderTems(temR.data || []);
}

async function renderGom(rows){
  const el = document.getElementById('gomList');
  if (!rows.length) { el.innerHTML = '<div class="empty">Không có hàng đang gom.</div>'; return; }
  const by = {};
  rows.forEach(r => { (by[r.ma_sp] = by[r.ma_sp] || []).push(r); });
  const mas = Object.keys(by).sort();
  const infos = await Promise.all(mas.map(m => sb.rpc('bavia_xh_thong_tin_ma', { p_ma_sp: m }).then(r => r.data || {})));
  el.innerHTML = mas.map((m, i) => {
    const its = by[m], info = infos[i] || {};
    const gom = its.reduce((s, r) => s + Number(r.sl_con_gom), 0);
    const st = Number(info.sl_thung) || 0;
    const pct = st ? Math.min(100, gom / st * 100) : 0;
    return '<div class="gom"><div class="h"><span class="ma">' + esc(m) + '</span><span class="kh">' + esc(info.ten_khach_hang || '') + '</span>' +
        '<span class="n">' + num(gom) + ' / ' + (st ? num(st) : '?') + '</span></div>' +
      '<div class="bar"><i style="width:' + pct.toFixed(0) + '%"></i></div>' +
      its.map(r => '<div class="it"><span class="t">' + esc(r.tag_no) + '</span><span class="sp">' + num(r.sl_con_gom) +
          (Number(r.sl_con_gom) < Number(r.sl_ok) ? ' / ' + num(r.sl_ok) : '') + ' pcs · ' + hm(r.thoi_diem) + ' · ' + esc(tenNguoi(r.nguoi)) + '</span>' +
          (Number(r.sl_con_gom) === Number(r.sl_ok) ? '<button class="btn danger sm" type="button" data-huy="' + r.id + '" title="Huỷ lần quét này">✖</button>' : '') + '</div>').join('') +
      '<div style="margin-top:6px;text-align:right"><button class="btn sm" type="button" data-le="' + esc(m) + '">📦 Đóng thùng lẻ ' + num(gom) + ' pcs</button></div>' +

}

async function inTem(tags){
  if (!tags || !tags.length) return;
  const { data, error } = await sb.rpc('bavia_xh_du_lieu_in', { p_tags: tags });
  if (error) return showMsg('Không lấy được dữ liệu in: ' + error.message, 'err');
  const ban = Math.max(1, Math.min(6, Number(document.getElementById('optBan').value) || 1));
  const groups = { chung: [], fcc: [] };
  (data || []).forEach(t => { for (let i = 0; i < ban; i++) groups[t.mau === 'fcc' ? 'fcc' : 'chung'].push(t); });
  // In từng nhóm mẫu riêng (khổ giấy khác nhau: TEM HÀNG A4 ngang, phiếu FCC A4 dọc).
  for (const m of ['chung', 'fcc']) {
    const ds = groups[m]; if (!ds.length) continue;
    const per = m === 'fcc' ? 2 : 4;
    let pages = '';
    for (let i = 0; i < ds.length; i += per) pages += '<div class="pg">' + ds.slice(i, i + per).map(m === 'fcc' ? phieuFcc : temHang).join('') + '</div>';
    await inHtml('<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><title>Tem xuất hàng</title><style>' +
      '*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;color:#000;background:#fff}' + PRINT_CSS[m] +
      '</style></head><body>' + pages + '</body></html>');
  }
}
// In qua iframe ẩn (không bị trình duyệt chặn popup sau khi chờ RPC).
function inHtml(html){
  return new Promise(resolve => {
    const f = document.createElement('iframe');
    f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
    document.body.appendChild(f);
    const d = f.contentDocument; d.open(); d.write(html); d.close();
    setTimeout(() => {
      try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { showMsg('Không mở được hộp in: ' + e.message, 'err'); }
      setTimeout(() => { f.remove(); resolve(); }, 1500);
    }, 350);
  });
}

let qr = null, quet = false;
async function moCam(){
  if (typeof Html5Qrcode !== 'function') return showMsg('Lỗi tải thư viện đọc QR — kiểm tra mạng rồi tải lại trang.', 'err');
  document.getElementById('qrModal').classList.add('show');
  if (!qr) qr = new Html5Qrcode('qrReaderDiv');
  quet = true;
  try {
    await qr.start({ facingMode: 'environment' }, { fps: 8, qrbox: { width: 240, height: 240 } }, async txt => {
      if (!quet) return; quet = false; await dongCam(); moTem(txt);
    }, () => {});
  } catch (e) { quet = false; showMsg('Không mở được camera: ' + e, 'err'); }
}
async function dongCam(){
  document.getElementById('qrModal').classList.remove('show'); quet = false;
  if (qr && qr.isScanning) { try { await qr.stop(); } catch (e) {} }
}
document.getElementById('btnCam').onclick = moCam;
document.getElementById('btnCloseCam').onclick = () => { dongCam(); focusScan(); };
document.getElementById('btnFile').onclick = () => document.getElementById('qrFile').click();
document.getElementById('qrFile').onchange = ev => {
  const file = ev.target.files && ev.target.files[0]; if (!file) return;
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const c = document.getElementById('scanCanvas'), ctx = c.getContext('2d');
    c.width = img.width; c.height = img.height; ctx.drawImage(img, 0, 0); URL.revokeObjectURL(url);
    const code = jsQR(ctx.getImageData(0, 0, img.width, img.height).data, img.width, img.height);
    ev.target.value = '';
    if (code && code.data) { dongCam(); moTem(code.data); } else showMsg('Không đọc được mã QR trong ảnh.', 'err');
  };
  img.src = url;
};

  document.getElementById('mainUI').style.display = '';
  const auto = document.getElementById('optAuto'), tuIn = document.getElementById('optTuIn'), ban = document.getElementById('optBan');
  auto.checked = lsGet('bvxh_auto', '0') === '1';
  tuIn.checked = lsGet('bvxh_tuin', '1') === '1';
  ban.value = lsGet('bvxh_ban', '1');
  auto.onchange = () => lsSet('bvxh_auto', auto.checked ? '1' : '0');
  tuIn.onchange = () => lsSet('bvxh_tuin', tuIn.checked ? '1' : '0');
  ban.onchange = () => lsSet('bvxh_ban', String(Math.max(1, Math.min(6, Number(ban.value) || 1))));
  await taiLai();
  focusScan();
})();
</script>
