name: Record QC02 staging deployment

on:
  push:
    branches: [qc02-rebuild]
    paths:
      - .github/workflows/qc02-deployment.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: qc02-deployment-record
  cancel-in-progress: false

jobs:
  record:
    if: github.ref == 'refs/heads/qc02-rebuild'
    runs-on: ubuntu-latest
    environment:
      name: qc02
      url: https://mes-toyotaki.dangnaf.workers.dev/
    steps:
      - name: Record existing staging URL
        run: |
          echo 'QC02 staging is hosted at https://mes-toyotaki.dangnaf.workers.dev/' >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow records deployment metadata only. It does not upload code or modify Cloudflare, GitHub Pages, or Supabase.' >> "$GITHUB_STEP_SUMMARY"
