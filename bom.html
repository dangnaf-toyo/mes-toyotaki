<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOM sản phẩm — MES Toyotaki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"></noscript>

<style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#172033;--muted:#64748b;--line:#dbe2ea;--blue:#1267a8;--blue-soft:#eaf4fb;--green:#08765c;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,Arial,sans-serif}.page{max-width:1500px;margin:auto;padding:20px}.intro{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}.intro h1{font-size:22px;margin:0 0 5px}.intro p{margin:0;color:var(--muted)}.hint{background:#fff7e6;color:#875d12;border:1px solid #f2dba1;padding:9px 12px;border-radius:7px;font-size:12px;max-width:470px}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 3px #1720330d}.catalog-head{padding:14px;border-bottom:1px solid var(--line)}.catalog-head strong{display:block;margin-bottom:9px}.search,input,textarea{width:100%;border:1px solid #cbd5e1;border-radius:6px;padding:9px 10px;background:white;font:inherit;color:inherit}.search:focus,input:focus,textarea:focus{outline:2px solid #93c5fd;border-color:var(--blue)}.product-list{max-height:calc(100vh - 245px);overflow:auto;padding:6px}.product{width:100%;text-align:left;border:0;background:transparent;border-radius:7px;padding:10px;cursor:pointer;color:var(--ink)}.product:hover{background:#f1f5f9}.product.active{background:var(--blue-soft);color:#07558e}.product-code{font-weight:700;font-size:13px}.product-name{font-size:12px;color:var(--muted);margin-top:2px}.product.active .product-name{color:#39739d}.empty{padding:26px;color:var(--muted);text-align:center}.main{min-width:0}.product-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.product-head h2{font-size:19px;margin:0 0 4px}.product-head p{margin:0;color:var(--muted);font-size:13px}.version-tabs{display:flex;gap:7px;flex-wrap:wrap;padding:13px 20px;border-bottom:1px solid var(--line)}.version-tab{border:1px solid #bdcddd;color:#40576e;background:#fff;border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:700}.version-tab.active{border-color:var(--blue);background:var(--blue);color:#fff}.form{padding:20px}.section-title{font-size:14px;font-weight:800;margin:0 0 11px}.field-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.field label{display:block;color:#526477;font-weight:700;font-size:12px;margin-bottom:5px}.field small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.route{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:12px}.route-step{display:flex;align-items:center;gap:6px;border:1px solid #cbd5e1;border-radius:20px;background:white;padding:6px 10px;font-weight:600;font-size:12px;cursor:pointer}.route-step input{width:auto;margin:0;accent-color:var(--blue)}.arrow{color:#94a3b8;font-weight:700}.route-summary{color:var(--muted);font-size:12px;margin:8px 0 18px}.components{margin-top:24px}.component-table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px}.component-table{width:100%;border-collapse:collapse;min-width:730px}.component-table th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:#526477;background:#f8fafc;text-align:left;padding:9px}.component-table td{border-top:1px solid var(--line);padding:6px}.component-table input{padding:7px}.delete{color:var(--red);border:1px solid #fecaca;background:white;border-radius:5px;padding:6px 9px;cursor:pointer}.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:13px;flex-wrap:wrap}.btn{border:0;border-radius:6px;padding:10px 14px;font-weight:700;cursor:pointer;font:inherit}.btn.secondary{background:#eaf0f5;color:#385168}.btn.primary{background:var(--blue);color:white}.btn:disabled{opacity:.6;cursor:wait}.status{font-size:13px;min-height:19px}.status.ok{color:var(--green)}.status.err{color:var(--red)}.meta{margin-top:18px;color:var(--muted);font-size:12px;border-top:1px dashed var(--line);padding-top:12px}@media(max-width:850px){.page{padding:14px}.layout{grid-template-columns:1fr}.product-list{max-height:260px}.field-grid{grid-template-columns:1fr}.intro{display:block}.hint{margin-top:12px}.product-head{display:block}.version-tabs{padding:10px}.form{padding:14px}}

/* ── Chuẩn giao diện chung MES (theo duc-dashboard.html) ── */
:root{--bg-page:#EEF1F5;--bg-panel:#FFFFFF;--bg-sunken:#F5F7FA;--bg-header:#1E293B;--border:#D9DFE5;--border-strong:#B8C1CC;--text:#0F172A;--text-muted:#64748B;--text-dim:#94A3B8;--accent:#0F5FA5;--accent-hover:#0A4681;--run-fg:#047857;--run-bg:#ECFDF5;--warn-fg:#B45309;--warn-bg:#FFFBEB;--alarm-fg:#B91C1C;--alarm-bg:#FEF2F2;--shadow-sm:0 1px 2px rgba(15,23,42,0.04);--shadow-md:0 4px 12px rgba(15,23,42,0.08);--shadow-lg:0 12px 32px rgba(15,23,42,0.16);--bg:var(--bg-page);--panel:var(--bg-panel);--ink:var(--text);--line:var(--border);--blue:var(--accent);--green:var(--run-fg);--red:var(--alarm-fg);}
html,body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg-page);color:var(--text);font-size:13px;line-height:1.35;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit;font-size:13px}
header.mes-hdr{background:var(--bg-header);color:#F1F5F9;border-radius:8px;padding:6px 14px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-sm);flex-wrap:wrap;margin:6px 12px 0;position:static;border:none;font-size:13px;font-weight:400}
header.mes-hdr .brand{display:flex;flex-direction:column;line-height:1.2}
header.mes-hdr .brand .co{font-size:9px;letter-spacing:.08em;color:#94A3B8;text-transform:uppercase;font-weight:500}
header.mes-hdr .brand .title{font-size:14px;font-weight:700;letter-spacing:-.01em;color:#FFF}
header.mes-hdr .btn-ghost{background:transparent;color:#F1F5F9;border:1px solid #475569;border-radius:5px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
header.mes-hdr .btn-ghost:hover{background:#334155}
header.mes-hdr .btn-ghost.active{background:var(--accent);border-color:var(--accent)}
header.mes-hdr .header-user{font-size:11px;color:#94A3B8;margin-left:auto}
header.mes-hdr .header-clock{display:flex;flex-direction:column;align-items:flex-end;padding:0 10px;line-height:1.15}
header.mes-hdr .header-clock .date{font-size:10px;color:#94A3B8}
header.mes-hdr .header-clock .time{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:#FFF;letter-spacing:-.02em}
.page{max-width:none;margin:0;padding:6px 12px 60px}
.btn-primary,.btn.primary{background:var(--accent);color:#fff}
</style>
</head>
<body>
<header class="mes-hdr">
  <div class="brand"><span class="co">Toyotaki</span><span class="title">BOM Sản Phẩm</span></div>
  <span class="header-user"></span>
  <div class="header-clock"><span class="date" id="hdrDate">—</span><span class="time" id="hdrTime">--:--:--</span></div>
</header>
<main class="page">
  <section class="intro">
    <div><p>Mỗi model có ba phiên bản BOM độc lập. Chọn model, sau đó chọn phiên bản để xem hoặc cập nhật.</p></div>
    <div class="hint">Định mức nhôm được nhập theo <b>kg/pcs</b>. Linh kiện được khai báo riêng theo định mức cho mỗi sản phẩm.</div>
  </section>
  <section class="layout">
    <aside class="card"><div class="catalog-head"><strong>Model sản phẩm</strong><input class="search" id="search" placeholder="Tìm mã hoặc tên model"></div><div class="product-list" id="productList"></div></aside>
    <section class="card main" id="editor"><div class="empty">Đang nạp danh mục sản phẩm…</div></section>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="shared/supabase-client.js"></script>
<script src="shared/navbar.js"></script>
<script>
const ROUTES=['Đúc','Bavia','Gia công CNC','Sơn'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let products=[], versions=[], selectedProduct=null, selectedVersion=1, identity='';
const $=id=>document.getElementById(id);

async function init(){
  await MesAuth.requireAuth(); identity=await MesAuth.getCurrentUserIdentity()||'';
  const [p,b]=await Promise.all([
    sb.from('master_products').select('ma_sp,ten_sp,nguyen_lieu,quy_trinh_cong_doan').order('ma_sp'),
    sb.from('bom_versions').select('id,ma_sp,version_no,ma_nhom,dinh_muc_nhom_kg_moi_pcs,quy_trinh_cong_doan,ghi_chu,updated_at,updated_by,bom_components(id,ma_linh_kien,ten_linh_kien,dinh_muc_moi_pcs,don_vi_tinh,ghi_chu)').order('version_no')
  ]);
  if(p.error)return showFatal('Không tải được danh mục model: '+p.error.message);
  if(b.error)return showFatal('Chưa có dữ liệu BOM. Hãy chạy migration <b>migration_phase_T61_bom_versions.sql</b> trong Supabase SQL Editor, rồi tải lại trang.');
  products=p.data||[];versions=b.data||[];selectedProduct=products[0]||null;renderProducts();renderEditor();
}
function showFatal(msg){$('editor').innerHTML='<div class="empty">'+msg+'</div>';}
function renderProducts(){const q=$('search').value.trim().toLowerCase();const rows=products.filter(p=>(p.ma_sp+' '+(p.ten_sp||'')).toLowerCase().includes(q));$('productList').innerHTML=rows.length?rows.map(p=>'<button class="product '+(selectedProduct?.ma_sp===p.ma_sp?'active':'')+'" data-code="'+esc(p.ma_sp)+'"><div class="product-code">'+esc(p.ma_sp)+'</div><div class="product-name">'+esc(p.ten_sp||'Chưa có tên')+'</div></button>').join(''):'<div class="empty">Không tìm thấy model</div>';document.querySelectorAll('.product').forEach(x=>x.onclick=()=>{selectedProduct=products.find(p=>p.ma_sp===x.dataset.code);selectedVersion=1;renderProducts();renderEditor()})}
function currentBom(){return versions.find(x=>x.ma_sp===selectedProduct?.ma_sp&&Number(x.version_no)===selectedVersion)}
function fmt(v){return v===null||v===undefined||v===''?'':Number(v).toLocaleString('vi-VN',{maximumFractionDigits:6})}
function renderEditor(){if(!selectedProduct)return showFatal('Danh mục sản phẩm đang trống.');const b=currentBom();if(!b)return showFatal('Model này chưa được tạo 3 phiên bản BOM. Hãy chạy migration T61.');const comps=b.bom_components||[];const route=b.quy_trinh_cong_doan?.length?b.quy_trinh_cong_doan:ROUTES;$('editor').innerHTML=`
  <div class="product-head"><div><h2>${esc(selectedProduct.ma_sp)}</h2><p>${esc(selectedProduct.ten_sp||'Chưa có tên sản phẩm')} · BOM phiên bản ${selectedVersion}</p></div><p>Người cập nhật: ${esc(b.updated_by||'—')}<br>${b.updated_at?'Lúc: '+new Date(b.updated_at).toLocaleString('vi-VN',{hour12:false}):'Chưa cập nhật'}</p></div>
  <div class="version-tabs">${[1,2,3].map(v=>`<button class="version-tab ${v===selectedVersion?'active':''}" data-version="${v}">BOM V${v}</button>`).join('')}</div>
  <div class="form">
    <h3 class="section-title">Nguyên liệu nhôm</h3><div class="field-grid"><div class="field"><label>Mã nhôm</label><input id="aluminumCode" value="${esc(b.ma_nhom||selectedProduct.nguyen_lieu||'')}" placeholder="Ví dụ: ADC12-CHT"><small>Mã nguyên liệu nhôm dùng cho model ở phiên bản này.</small></div><div class="field"><label>Định mức tiêu hao (kg/pcs)</label><input id="aluminumQty" type="number" min="0" step="0.000001" value="${esc(b.dinh_muc_nhom_kg_moi_pcs??'')}" placeholder="Ví dụ: 0.125"><small>Khối lượng nhôm tiêu hao cho 1 sản phẩm.</small></div></div>
    <h3 class="section-title" style="margin-top:24px">Luồng chạy sản phẩm</h3><div class="route">${ROUTES.map((r,i)=>`<label class="route-step"><input type="checkbox" class="route-check" value="${r}" ${route.includes(r)?'checked':''}>${r}</label>${i<ROUTES.length-1?'<span class="arrow">→</span>':''}`).join('')}</div><div class="route-summary" id="routeSummary"></div>
    <section class="components"><h3 class="section-title">Linh kiện sử dụng</h3><div class="component-table-wrap"><table class="component-table"><thead><tr><th>Mã linh kiện</th><th>Tên linh kiện</th><th>Định mức / pcs</th><th>Đơn vị</th><th>Ghi chú</th><th></th></tr></thead><tbody id="componentRows">${comps.map(componentRow).join('')}</tbody></table></div><div class="actions"><button class="btn secondary" id="addComponent" type="button">+ Thêm linh kiện</button><span class="status" id="status"></span><button class="btn primary" id="save" type="button">Lưu BOM V${selectedVersion}</button></div></section>
    <div class="field" style="margin-top:22px"><label>Ghi chú phiên bản BOM</label><textarea id="note" rows="3" placeholder="Ghi chú thay đổi, ngày hiệu lực…">${esc(b.ghi_chu||'')}</textarea></div><div class="meta">BOM V1, V2 và V3 được quản lý tách biệt. Chỉ tài khoản Admin mới có quyền lưu thay đổi.</div>
  </div>`;
  document.querySelectorAll('.version-tab').forEach(x=>x.onclick=()=>{selectedVersion=Number(x.dataset.version);renderEditor()});
  document.querySelectorAll('.route-check').forEach(x=>x.onchange=updateRouteSummary);updateRouteSummary();$('addComponent').onclick=()=>{$('componentRows').insertAdjacentHTML('beforeend',componentRow({}));wireDeleteRows()};wireDeleteRows();$('save').onclick=save;
}
function componentRow(c){return `<tr><td><input class="c-code" value="${esc(c.ma_linh_kien||'')}" placeholder="Mã linh kiện"></td><td><input class="c-name" value="${esc(c.ten_linh_kien||'')}" placeholder="Tên linh kiện"></td><td><input class="c-qty" type="number" min="0" step="0.000001" value="${esc(c.dinh_muc_moi_pcs??1)}"></td><td><input class="c-uom" value="${esc(c.don_vi_tinh||'pcs')}" placeholder="pcs"></td><td><input class="c-note" value="${esc(c.ghi_chu||'')}" placeholder="Ghi chú"></td><td><button class="delete" type="button" title="Xóa dòng">×</button></td></tr>`}
function wireDeleteRows(){document.querySelectorAll('.delete').forEach(x=>x.onclick=()=>x.closest('tr').remove())}
function updateRouteSummary(){const r=[...document.querySelectorAll('.route-check:checked')].map(x=>x.value);$('routeSummary').textContent=r.length?'Luồng đang dùng: '+r.join(' → '):'Chưa chọn công đoạn nào.'}
function message(text,error=false){const e=$('status');e.textContent=text;e.className='status '+(error?'err':'ok')}
async function save(){const b=currentBom(),components=[];let invalid=false;document.querySelectorAll('#componentRows tr').forEach(row=>{const code=row.querySelector('.c-code').value.trim();if(!code)return;const qty=Number(row.querySelector('.c-qty').value);if(!Number.isFinite(qty)||qty<0){invalid=true;return}components.push({ma_linh_kien:code,ten_linh_kien:row.querySelector('.c-name').value.trim(),dinh_muc_moi_pcs:qty,don_vi_tinh:row.querySelector('.c-uom').value.trim()||'pcs',ghi_chu:row.querySelector('.c-note').value.trim()})});if(invalid)return message('Định mức linh kiện phải là số không âm.',true);const aluminum=$('aluminumQty').value===''?null:Number($('aluminumQty').value);if(aluminum!==null&&(!Number.isFinite(aluminum)||aluminum<0))return message('Định mức nhôm phải là số không âm.',true);const btn=$('save');btn.disabled=true;message('Đang lưu…');const {error}=await sb.rpc('bom_save_version',{p_id:b.id,p_ma_nhom:$('aluminumCode').value.trim(),p_dinh_muc_nhom_kg_moi_pcs:aluminum,p_quy_trinh_cong_doan:[...document.querySelectorAll('.route-check:checked')].map(x=>x.value),p_ghi_chu:$('note').value.trim(),p_components:components,p_updated_by:identity});btn.disabled=false;if(error)return message(error.message,true);message('Đã lưu BOM V'+selectedVersion+'.');const {data, error:reloadError}=await sb.from('bom_versions').select('id,ma_sp,version_no,ma_nhom,dinh_muc_nhom_kg_moi_pcs,quy_trinh_cong_doan,ghi_chu,updated_at,updated_by,bom_components(id,ma_linh_kien,ten_linh_kien,dinh_muc_moi_pcs,don_vi_tinh,ghi_chu)').eq('id',b.id).single();if(!reloadError){versions=versions.map(x=>x.id===b.id?data:x);renderEditor()}}
$('search').oninput=renderProducts;init();
</script>
<script>
(function(){function t(){var d=new Date(),p=n=>String(n).padStart(2,"0");document.getElementById("hdrTime").textContent=p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());document.getElementById("hdrDate").textContent=["CN","T2","T3","T4","T5","T6","T7"][d.getDay()]+", "+p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear();}t();setInterval(t,1000);})();
</script>
</body>
</html>
