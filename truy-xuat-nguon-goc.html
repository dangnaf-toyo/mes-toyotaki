<!DOCTYPE html>
<html lang="vi" spellcheck="false">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Truy xuất nguồn gốc — TOYOTAKI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"></noscript>
<!--
  truy-xuat-nguon-goc.html — nhập/quét 1 Tag No, hiện phả hệ dạng SƠ ĐỒ NHÁNH (T288,
  renderMap): tem đang tra ở đầu, tem nguồn toả nhánh sang phải.
  - "Nguồn gốc" (ngược): tem này được TÁCH TỪ hoặc GỘP TỪ những tem nào.
  - "Đã dùng để tạo" (xuôi): tem này đã bị TÁCH RA hoặc DÙNG ĐỂ ĐÓNG GÓI
    thành những tem nào.
  Dữ liệu lấy từ RPC đệ quy cd_truy_xuat_pha_he (gộp duc_tem_tach +
  cd_tem_nguon), xem supabase/migration_phase_T5_truy_xuat_pha_he.sql.
  Đọc công khai, không có thao tác ghi nào ở trang này.

  Mỗi tem cha/con trong cây (renderNodeDetail) hiện ĐẦY ĐỦ thông tin
  (duc_tem select('*') + vị trí hiện tại), không chỉ mã SP/số lượng tóm tắt
  như trước — đối chiếu nhanh khi có khiếu nại chất lượng cần biết ai/máy
  nào/khi nào làm ra tem nguồn.
-->
<style>
:root{--bg-page:#EEF1F5;--bg-panel:#FFFFFF;--bg-sunken:#F5F7FA;--bg-header:#1E293B;--border:#D9DFE5;--border-strong:#B8C1CC;--text:#0F172A;--text-muted:#64748B;--text-dim:#94A3B8;--accent:#0F5FA5;--accent-hover:#0A4681;--run-fg:#047857;--run-bg:#ECFDF5;--warn-fg:#B45309;--warn-bg:#FFFBEB;--alarm-fg:#B91C1C;--alarm-bg:#FEF2F2;--shadow-sm:0 1px 2px rgba(15,23,42,0.04);--shadow-md:0 4px 12px rgba(15,23,42,0.08);--shadow-lg:0 12px 32px rgba(15,23,42,0.16);}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg-page);color:var(--text);font-size:13px;line-height:1.35;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:0 12px 60px}
.wrap{max-width:none;margin:0}
header{background:var(--bg-header);color:#F1F5F9;border-radius:8px;padding:6px 14px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-sm);flex-wrap:wrap;max-width:none;margin:6px 0 0}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand .co{font-size:11px;letter-spacing:.08em;color:#94A3B8;text-transform:uppercase;font-weight:500}
.brand .title{font-size:14px;font-weight:700;letter-spacing:-.01em;color:#FFF}
.header-group{display:flex;align-items:center;gap:6px}
.header-label{font-size:11px;color:#94A3B8;text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.header-select,.header-input{background:#334155;color:#F1F5F9;border:1px solid #475569;border-radius:5px;padding:4px 8px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;outline:none}
.header-select:hover{background:#3F5266}
.header-clock{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;padding:0 10px;line-height:1.15}
.header-clock .date{font-size:11px;color:#94A3B8}
.header-clock .time{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:#FFF;letter-spacing:-.02em}
.btn-ghost{background:transparent;color:#F1F5F9;border:1px solid #475569}
.btn-ghost:hover{background:#334155}
.auth-info{font-size:11.5px;color:var(--text-muted)}
.auth-info a{color:var(--accent);text-decoration:none;font-weight:600}
.card{background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-sm);padding:16px;margin-bottom:14px}
.card h2{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fg label{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px}
.fg input{border:1.5px solid var(--border);border-radius:7px;padding:9px 11px;font-size:13px;font-family:inherit;width:100%;background:var(--bg-panel);color:var(--text)}
.fg input:focus{outline:none;border-color:var(--accent)}
.btn{border:none;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;width:100%;font-family:inherit}
.btn:hover{background:var(--accent-hover)}
.sr{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--border);font-size:13px;gap:10px}
.sr:last-child{border-bottom:none}
.sr .k{color:var(--text-muted);font-weight:700;flex-shrink:0}
.sr .v{text-align:right;font-weight:700;font-family:'JetBrains Mono',monospace}
.badge-loc{display:inline-block;background:var(--run-bg);color:var(--run-fg);border:1px solid #A7F3D0;border-radius:100px;padding:2px 9px;font-size:11px;font-weight:700}
ul.tree{list-style:none;margin-left:16px;padding-left:14px;border-left:2px solid var(--border)}
ul.tree.root{margin-left:0;padding-left:0;border-left:none}
ul.tree li{margin:6px 0;font-size:12.5px}
.tag-chip{font-family:'JetBrains Mono',monospace;font-weight:700;background:var(--bg-sunken);border-radius:5px;padding:1px 6px}
.rel-tach{color:var(--warn-fg)}
.rel-dong_goi{color:var(--run-fg)}
.node-meta{color:var(--text-dim);font-size:11px}
.node-head{margin-bottom:4px}
.node-detail{background:var(--bg-sunken);border-radius:7px;padding:4px 10px;margin:4px 0 6px}
.node-detail .sr{font-size:11.5px;padding:3px 0}
.node-detail .missing{color:var(--text-dim);font-style:italic;font-size:11px;padding:4px 0}
.empty{color:var(--text-dim);font-style:italic;font-size:12.5px;padding:6px 0}
#msg{max-width:none;margin:12px 0 12px;padding:11px 14px;border-radius:9px;font-size:13px;font-weight:600;display:none}
.err{background:var(--alarm-bg);color:var(--alarm-fg);border:1px solid #FECACA;display:block!important}
.ok{background:var(--run-bg);color:var(--run-fg);border:1px solid #A7F3D0;display:block!important}
.qr-modal{position:fixed;inset:0;background:#000;z-index:9999;display:none;flex-direction:column}
.qr-modal.show{display:flex}
.qr-modal-hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:rgba(0,0,0,.7);flex-shrink:0}
.qr-modal-hdr span{color:#fff;font-size:13px;font-weight:700}
.qr-modal-close{background:var(--alarm-fg);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
#qrReaderDiv{position:relative;flex:1;overflow:hidden}
#qrReaderDiv video{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important}
.hist-item{font-size:12px;padding:5px 0;border-bottom:1px dashed var(--border)}
.hist-note{color:var(--text-muted);margin-top:2px;font-style:italic}
.hist-item .hh{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.hist-item .phieu{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim)}
.hist-item .st{font-size:11px;font-weight:700;padding:1px 6px;border-radius:9px;background:var(--bg-sunken);color:var(--text-muted)}
.hist-item .st.ok{background:var(--run-bg);color:var(--run-fg)}
.hist-item .st.cho{background:var(--warn-bg);color:var(--warn-fg)}
.hist-item .st.tc{background:var(--alarm-bg);color:var(--alarm-fg)}
.hist-item .gn{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:2px 14px;margin-top:3px}
.hist-item .gn .k{color:var(--text-muted)}
.hist-item .gn b{font-weight:600}
.hist-item .tc-ly{color:var(--alarm-fg);margin-top:2px}
.node-hist{margin:0 0 6px;padding:2px 10px;border-left:3px solid var(--border)}
.node-hist .ttl{font-size:11px;font-weight:700;color:var(--text-muted);margin-top:2px}
.node-hist .hist-item{font-size:11.5px;padding:3px 0}
.info{cursor:help;color:var(--text-dim);font-weight:400;text-transform:none}
/* Sơ đồ nhánh (T288) */
.mm{overflow-x:auto;padding:4px 2px 8px;-webkit-overflow-scrolling:touch}
/* Neo nhánh ở dòng tiêu đề ô (cách mép trên --y) để tem đang tra nằm trên cùng */
.mm{--y:14px;--wn:220px;--wr:240px;--we:160px;--wm:170px}
.mm-hd{display:flex;align-items:flex-end;width:max-content;margin-bottom:8px}
.mm-hc{flex-shrink:0;font-size:12px;font-weight:700;padding:2px 8px;border-bottom:2px solid var(--border-strong);line-height:1.4}
.mm-hc .sep{color:var(--text-dim);font-weight:400}
.mm-hs{flex-shrink:0;width:calc(14px + var(--we));text-align:center;color:var(--text-dim);font-size:12px;padding-bottom:3px}
.mm-b{display:flex;align-items:flex-start;width:max-content}
.mm-kids{display:flex;flex-direction:column;position:relative;padding-left:14px}
.mm-kids::before{content:'';position:absolute;left:0;top:var(--y);width:14px;border-top:2px solid var(--border-strong)}
.mm-k{display:flex;align-items:flex-start;position:relative;padding:0 0 12px}
.mm-k:last-child{padding-bottom:0}
.mm-k::before{content:'';position:absolute;left:0;top:0;bottom:0;border-left:2px solid var(--border-strong)}
.mm-k:first-child::before{top:var(--y)}
.mm-k:last-child::before{bottom:auto;height:var(--y)}
.mm-k:only-child::before{display:none}
.mm-e{position:relative;width:var(--we);flex-shrink:0;padding:0 6px 0 12px}
.mm-e::before{content:'';position:absolute;left:0;right:0;top:var(--y);border-top:2px solid var(--c,var(--border-strong))}
.mm-e::after{content:'';position:absolute;left:0;top:var(--y);margin-top:-4px;border:5px solid transparent;border-right:7px solid var(--c,var(--border-strong));border-left:none}
.mm.xuoi .mm-e::after{left:auto;right:0;border-right:none;border-left:7px solid var(--c,var(--border-strong))}
.mm-e.tach{--c:var(--warn-fg)}
.mm-e.dong_goi{--c:var(--run-fg)}
.mm-el{position:relative;z-index:1;margin-top:calc(var(--y) - 10px);background:var(--bg-panel);border:1px solid var(--c);border-radius:7px;padding:3px 6px;font-size:11px;max-width:100%}
.mm-el b{color:var(--c);white-space:nowrap}
.mm-cv{margin-top:2px}
.mm-cv summary{cursor:pointer;color:var(--text-muted);list-style:none;line-height:1.35}
.mm-cv summary::-webkit-details-marker{display:none}
.mm-cv .st{white-space:nowrap;font-size:11px;font-weight:700;padding:0 5px;border-radius:9px;background:var(--bg-sunken);color:var(--text-muted)}
.mm-cv .st.ok{background:var(--run-bg);color:var(--run-fg)}
.mm-cv .st.cho{background:var(--warn-bg);color:var(--warn-fg)}
.mm-cv .st.tc{background:var(--alarm-bg);color:var(--alarm-fg)}
.mm-cv .hist-item{font-size:11px;border-bottom:none;padding:3px 0 0}
.mm-cv .hist-item .gn{grid-template-columns:1fr}
.mm-n{width:var(--wn);flex-shrink:0;background:var(--bg-panel);border:1px solid var(--border);border-left:4px solid var(--cd,var(--border-strong));border-radius:8px;padding:6px 8px;box-shadow:var(--shadow-sm);font-size:11.5px}
.mm-n.root{width:var(--wr);border-color:var(--accent);border-left-color:var(--cd,var(--accent));box-shadow:0 0 0 2px rgba(15,95,165,.15)}
.mm-n.mini{width:var(--wm)}
.mm-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.mm-cd{font-weight:700;color:var(--cd);font-size:12px}
.mm-sl{color:var(--text-muted);font-size:11px;white-space:nowrap}
.mm-tag{margin:2px 0 4px}
.mm-r{display:flex;justify-content:space-between;gap:8px;padding:1px 0;border-top:1px dashed var(--border)}
.mm-r .k{color:var(--text-muted);flex-shrink:0}
.mm-r .v{font-weight:600;text-align:right;word-break:break-word}
.mm-miss{color:var(--text-dim);font-style:italic}
.mm-cvs{margin-top:4px;padding-top:3px;border-top:1px solid var(--border)}
/* T312: dao trên máy Gia công lúc thùng Xong */
.mm-dao{font-size:11px;line-height:1.4;padding:2px 0 0}
.mm-dao .dr{display:flex;gap:6px;justify-content:space-between}
.mm-dao .p{font-weight:700;white-space:nowrap}
.mm-dao .p.v{color:var(--warn-fg)} .mm-dao .p.d{color:var(--alarm-fg)}
@media (max-width:600px){.mm{--wn:190px;--wr:200px;--we:130px;--wm:150px}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="co">Toyotaki</span>
    <span class="title">Truy xuất nguồn gốc</span>
  </div>
  <div class="header-clock">
    <span class="date" id="hdrDate"></span>
    <span class="time" id="hdrTime"></span>
  </div>
</header>

<div id="msg"></div>

<div class="wrap">
  <div class="card">
    <h2>Tra cứu Tag No</h2>
    <div class="fg">
      <label>Tag No</label>
      <input type="text" autocomplete="off" id="searchTag" placeholder="Gõ Tag No hoặc dùng đầu đọc QR rời rồi Enter">
    </div>
    <div style="display:flex;gap:8px">
      <button type="button" class="btn" id="btnSearch" style="flex:1">Tra cứu</button>
      <button type="button" class="btn" id="btnScan" style="flex:1;background:var(--bg-panel);border:1.5px solid var(--accent);color:var(--accent)">Quét QR</button>
    </div>
    <input type="file" id="qrFileInput" accept="image/*" capture="environment" style="display:none">
  </div>

  <div id="resultArea" style="display:none">
    <div class="card">
      <h2>Sơ đồ nguồn gốc <span class="info" title="Ô đầu (viền xanh) = tem đang tra. Nhánh sang phải = tem nguồn ở công đoạn trước. Trên đường nối: Tách/Gộp + số lượng + chuyển công đoạn (bấm 🚚 xem người giao/nhận). 🔧 Dao = dao trên máy Gia công lúc thùng Xong, % tuổi thọ lúc đó. Thông tin giống tem nguồn chỉ hiện ở tem nguồn.">ⓘ</span></h2>
      <div id="mapNguoc"></div>
    </div>

    <div class="card" id="cardXuoi" style="display:none">
      <h2>Đã dùng để tạo <span class="info" title="Các tem được tách/đóng gói từ tem đang tra.">ⓘ</span></h2>
      <div id="mapXuoi"></div>
    </div>
  </div>
</div>

<canvas id="scanCanvas" style="display:none"></canvas>
<div class="qr-modal" id="qrModal">
  <div class="qr-modal-hdr">
    <span>📷 Đưa mã QR trên tem vào giữa khung hình</span>
    <button type="button" class="qr-modal-close" id="btnCloseQrModal">Đóng</button>
  </div>
  <div id="qrReaderDiv"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="shared/supabase-client.js"></script>
<script src="shared/navbar.js?v=T361"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtNum(n){ return (Number(n) || 0).toLocaleString('vi-VN'); }
function showMsg(text, cls){ const el = document.getElementById('msg'); el.textContent = text; el.className = cls; }
function fmtDateVN(d){ return d ? String(d).split('-').reverse().join('/') : ''; }
function parseTagNo(raw){
  const s = String(raw || '').trim();
  if (!s) return '';
  const first = s.includes('>') ? s.split('>')[0] : s;
  return first.replace(/\s+/g, '');
}

document.getElementById('btnSearch').addEventListener('click', () => search(document.getElementById('searchTag').value));
// Đầu đọc QR rời gõ nguyên chuỗi QR (nhiều trường nối bằng '>\n', xem
// intem.html) thẳng vào ô Tag No: mỗi \n giữa các trường bị trình duyệt hiểu
// là 1 lần Enter riêng. Phải xoá ô NGAY khi Enter đầu tiên tới (không để
// search() ghi đè lại giá trị đã tách vào ô — làm ký tự các trường sau nối
// lẫn vào Tag No) + debounce gộp các lần Enter liền nhau (giống
// ghi-nhan-tem-thanh-pham.html/chuyencongdoan.html).
let lastScanSubmitAt = 0;
document.getElementById('searchTag').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const v = e.target.value;
  e.target.value = '';
  if (!v.replace(/\s+/g, '')) return;
  const now = Date.now();
  if (now - lastScanSubmitAt < 1500) return;
  lastScanSubmitAt = now;
  search(v);
});

async function search(raw){
  const tagNo = parseTagNo(raw);
  if (!tagNo) return showMsg('Nhập hoặc quét Tag No trước.', 'err');
  document.getElementById('searchTag').value = tagNo;
  showMsg('⏳ Đang tra cứu ' + tagNo + '...', 'ok');
  document.getElementById('resultArea').style.display = 'none';

  const [temRes, edgeRes, locRes, histRes] = await Promise.all([
    sb.from('duc_tem').select('*').eq('tag_no', tagNo).maybeSingle(),
    sb.rpc('cd_truy_xuat_pha_he', { p_tag_no: tagNo }),
    sb.from('cd_v_vi_tri_hien_tai').select('vi_tri_hien_tai').eq('tag_no', tagNo).maybeSingle(),
    sb.from('cd_chuyen_cong_doan_log').select('*').eq('tag_no', tagNo).order('thoi_gian_chuyen'),
  ]);

  if (temRes.error || !temRes.data){ showMsg('Không tìm thấy tem ' + tagNo + ' trong hệ thống.', 'err'); return; }
  if (edgeRes.error){ showMsg('Lỗi tra phả hệ: ' + edgeRes.error.message, 'err'); return; }

  const edges = (edgeRes.data || []).map(e => ({ huong: e.huong, cap: e.cap, tu: e.tag_cha, den: e.tag_con, so_luong: e.so_luong, loai: e.loai }));
  const allTags = new Set([tagNo]);
  edges.forEach(e => { allTags.add(e.tu); allTags.add(e.den); });

  const otherTags = [...allTags].filter(t => t !== tagNo);
  const [{ data: temList }, { data: locList }, { data: nodeHist }] = await Promise.all([
    sb.from('duc_tem').select('*').in('tag_no', [...allTags]),
    sb.from('cd_v_vi_tri_hien_tai').select('tag_no,vi_tri_hien_tai').in('tag_no', [...allTags]),
    otherTags.length ? sb.from('cd_chuyen_cong_doan_log').select('*').in('tag_no', otherTags).order('thoi_gian_chuyen') : Promise.resolve({ data: [] }),
  ]);
  // Lịch sử chuyển công đoạn của từng tem cha/con trong cây (giao/nhận ở tem nguồn).
  const tagHist = {};
  (nodeHist || []).forEach(r => { (tagHist[r.tag_no] = tagHist[r.tag_no] || []).push(r); });
  const tagInfo = {};
  (temList || []).forEach(t => { tagInfo[t.tag_no] = t; });
  tagInfo[tagNo] = temRes.data;
  const tagLoc = {};
  (locList || []).forEach(l => { tagLoc[l.tag_no] = l.vi_tri_hien_tai; });
  if (locRes.data) tagLoc[tagNo] = locRes.data.vi_tri_hien_tai;

  document.getElementById('resultArea').style.display = 'block';
  laTemGoc = tag => !edges.some(e => e.huong === 'nguoc' && e.den === tag);
  // Ca + khoảng giờ đúc thực của các tem gốc có máy (T287b).
  khoangSx = {};
  const temGocMay = [...allTags].filter(tag => laTemGoc(tag) && tagInfo[tag] && tagInfo[tag].may_tt);
  if (temGocMay.length){
    const { data: ks } = await sb.rpc('duc_tem_khoang_sx', { p_tags: temGocMay });
    (ks || []).forEach(k => { khoangSx[k.tag_no] = k; });
  }
  tagHist[tagNo] = histRes.data || [];
  // T312: dao đang lắp trên máy Gia công lúc từng thùng Xong.
  daoTheoTem = {};
  const { data: daoRows } = await sb.rpc('gc_tem_dao', { p_tags: [...allTags] });
  (daoRows || []).forEach(r => {
    const k = r.buoc + '|' + r.ma_may + '|' + r.xong_luc;
    const m = (daoTheoTem[r.tag_no] = daoTheoTem[r.tag_no] || {});
    (m[k] = m[k] || { buoc: r.buoc, may: r.ma_may, luc: r.xong_luc, sl: r.sl_ra, dao: [] }).dao.push(r);
  });
  renderMap(tagNo, edges, tagInfo, tagLoc, tagHist, tinhGioSxGoc(tagNo, edges, tagInfo));
  showMsg('✅ Đã tra cứu ' + tagNo, 'ok');
}

// Giờ SX thực của tem GỐC (không tách/gộp từ tem nào): giờ SX thực tế đã sửa
// (ngay_gio_ghi_nhan, T31) → thời điểm SX → giờ in tem. Tem tách/đóng gói có
// ngay_gio_in = lúc tách/đóng gói, KHÔNG phải lúc sản xuất → lấy từ tem gốc.
// Tem đúc có máy: lấy ca + khoảng đúc từ duc_tem_khoang_sx (từ tem trước cùng
// máy/mã SP hoặc đầu ca → lúc đầy thùng); "ngay" trên tem là ngày lịch lúc in
// nên tem in sau 0h thuộc Ca đêm của ngày hôm trước.
let laTemGoc = () => true;
let daoTheoTem = {};
// T312: mỗi bước Gia công đã Xong = 1 dòng gọn, bấm mở danh sách dao lúc đó.
function daoHtml(tag){
  const m = daoTheoTem[tag];
  if (!m) return '';
  return Object.values(m).map(g => {
    const max = Math.max(...g.dao.map(d => Number(d.pct) || 0));
    const cls = max >= 100 ? 'd' : max >= 80 ? 'v' : '';
    return '<details class="mm-cv"><summary>🔧 Dao B' + g.buoc + ' · ' + escapeHtml(g.may) + '<br>' + escapeHtml(fmtNgan(g.luc)) +
      ' · ' + g.dao.length + ' dao' + (cls ? ' <span class="st ' + (cls === 'd' ? 'tc' : 'cho') + '">' + max + '%</span>' : '') + '</summary>' +
      '<div class="mm-dao">' + g.dao.map(d => {
        const p = d.pct == null ? '—' : d.pct + '%';
        const c = Number(d.pct) >= 100 ? ' d' : Number(d.pct) >= 80 ? ' v' : '';
        return '<div class="dr"><span>' + escapeHtml(d.vi_tri) + ' · ' + escapeHtml(d.ma_dao) +
          (Number(d.so_canh) > 1 ? ' · C' + d.canh + '/' + d.so_canh : '') + '</span><span class="p' + c + '">' + p + '</span></div>';
      }).join('') + '</div></details>';
  }).join('');
}
let khoangSx = {};
function nhanCa(k){ return k && k.ca ? k.ca + ' ' + fmtDateVN(k.ngay_ca).slice(0, 5) : ''; }
function gioSxTemGoc(t){
  if (!t) return null;
  const k = khoangSx[t.tag_no];
  if (k) return { ts: k.moc, tu: k.tu, ca: nhanCa(k), tuGioIn: false };
  if (t.ngay_gio_ghi_nhan) return { ts: t.ngay_gio_ghi_nhan, tuGioIn: false };
  if (t.thoi_diem_san_xuat) return { ts: t.thoi_diem_san_xuat, tuGioIn: false };
  if (t.ngay_gio_in) return { ts: t.ngay_gio_in, tuGioIn: true };
  return null;
}
// "18:00 → 01:13 15/11" (cùng ngày thì chỉ ghi ngày ở cuối)
function fmtGio(v){ const d = new Date(v); return d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', hour12: false }); }
function fmtNgayNgan(v){ const d = new Date(v); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'); }
function fmtKhoang(tu, den){
  if (!tu || new Date(tu) >= new Date(den)) return fmtGio(den) + ' ' + fmtNgayNgan(den);
  return fmtGio(tu) + (fmtNgayNgan(tu) !== fmtNgayNgan(den) ? ' ' + fmtNgayNgan(tu) : '') + ' → ' + fmtGio(den) + ' ' + fmtNgayNgan(den);
}
function fmtGioSxGoc(g){
  if (!g) return '';
  return (g.ca ? g.ca + ' · ' : '') + fmtKhoang(g.tu, g.ts) + (g.tuGioIn ? ' (giờ in tem)' : '');
}
function tinhGioSxGoc(tagNo, edges, tagInfo){
  const nguoc = edges.filter(e => e.huong === 'nguoc');
  const goc = new Set(), seen = new Set([tagNo]);
  const stack = [tagNo];
  while (stack.length){
    const tag = stack.pop();
    const cha = nguoc.filter(e => e.den === tag).map(e => e.tu);
    if (!cha.length){ goc.add(tag); continue; }
    cha.forEach(c => { if (!seen.has(c)){ seen.add(c); stack.push(c); } });
  }
  const ds = [...goc].map(tag => ({ tag, t: tagInfo[tag], g: gioSxTemGoc(tagInfo[tag]) })).filter(x => x.g);
  if (!ds.length) return null;
  ds.sort((a, b) => new Date(a.g.tu || a.g.ts) - new Date(b.g.tu || b.g.ts));
  const may = [...new Set(ds.map(x => x.t.may_tt || x.t.may_duc_chi_thi || x.t.tram_cong_doan).filter(Boolean))];
  const ca = [...new Set(ds.map(x => x.g.ca).filter(Boolean))];
  const den = ds.reduce((m, x) => new Date(x.g.ts) > new Date(m) ? x.g.ts : m, ds[0].g.ts);
  return { tu: ds[0].g.tu || ds[0].g.ts, den, ca, soTem: ds.length, may, tuGioIn: ds.some(x => x.g.tuGioIn), chinhNo: goc.has(tagNo) };
}
function fmtGioSx(g){
  if (!g) return '—';
  return escapeHtml(fmtKhoang(g.tu, g.den)) + (g.tuGioIn ? ' <span class="node-meta">(giờ in tem)</span>' : '');
}

// Một lần chuyển công đoạn: công đoạn nhận quét tem (người nhận + thoi_gian_chuyen)
// → công đoạn giao xác nhận (người giao + ngay_gio_xac_nhan, chuỗi "HH:mm:ss dd/MM/yyyy").
function fmtTs(v){ return v ? new Date(v).toLocaleString('vi-VN', { hour12: false }) : ''; }
function histItemHtml(r){
  const st = r.trang_thai_xac_nhan || '';
  const cls = /từ chối/i.test(st) ? 'tc' : /^Đã xác nhận/i.test(st) ? 'ok' : /^Chờ/i.test(st) ? 'cho' : '';
  const daXn = cls === 'ok' || cls === 'tc';
  const sl = fmtNum(r.sl_thuc_chuyen) + ' sp' +
    (Number(r.chenh_lech) ? ' (tem ' + fmtNum(r.sl_tren_tem) + ', lệch ' + fmtNum(r.chenh_lech) + ')' : '');
  return '<div class="hist-item"><div class="hh"><b>' + escapeHtml(r.cong_doan_giao) + '</b> → <b>' + escapeHtml(r.cong_doan_nhan) + '</b>' +
      '<span>' + sl + '</span>' + (st ? '<span class="st ' + cls + '">' + escapeHtml(st) + '</span>' : '') +
      (r.id_phieu ? '<span class="phieu">' + escapeHtml(r.id_phieu) + '</span>' : '') + '</div>' +
    '<div class="gn">' +
      '<div><span class="k">📥 Nhận:</span> <b>' + escapeHtml(r.nguoi_nhan || '—') + '</b> · ' + escapeHtml(fmtTs(r.thoi_gian_chuyen) || '—') + '</div>' +
      '<div><span class="k">📤 Giao:</span> <b>' + escapeHtml(r.nguoi_giao || (daXn ? '—' : 'chưa xác nhận')) + '</b>' +
        (r.ngay_gio_xac_nhan ? ' · ' + escapeHtml(r.ngay_gio_xac_nhan) : '') + '</div>' +
    '</div>' +
    (r.ly_do_tu_choi ? '<div class="tc-ly">✖ Lý do từ chối: ' + escapeHtml(r.ly_do_tu_choi) + '</div>' : '') +
    (r.ghi_chu ? '<div class="hist-note">📝 ' + escapeHtml(r.ghi_chu) + '</div>' : '') + '</div>';
}
/* ---------- Sơ đồ nhánh (T288) ----------
   Tem đang tra ở đầu (trái); các tem nguồn (công đoạn trước) toả nhánh sang
   phải. Đường nối = quan hệ tách/gộp + số lượng + các lần chuyển công đoạn của
   tem phía trước. Mỗi ô = thông tin riêng công đoạn đó; trường giống hệt tem
   nguồn (kế thừa khi tách) chỉ hiện ở tem nguồn; Mã SP/Tên SP chỉ ở tem đang
   tra (tem khác chỉ hiện khi khác). */
const MM_STAGE_COLOR = { 'Đúc': '#0F5FA5', 'Bavia': '#B45309', 'Gia công': '#7C3AED', 'Sơn': '#DB2777', 'OQC': '#047857', 'Kho TP': '#047857' };
const MM_DEDUPE = [['may_tt', 'Máy'], ['so_khuon', 'Khuôn'], ['nguyen_lieu', 'NVL'], ['nguoi_tt', 'Người']];
function fmtNgan(v){ return v ? fmtGio(v) + ' ' + fmtNgayNgan(v) : ''; }
function congDoanTem(t){
  if (!t) return '—';
  if (t.tram_cong_doan) return t.tram_cong_doan;
  if (t.trang_thai === 'Đã làm Bavia') return 'Bavia'; // T367: tem con tách ở Bavia
  if (t.may_tt) return 'Đúc';
  return t.trang_thai || '—';
}
function mauCongDoan(cd){
  const k = Object.keys(MM_STAGE_COLOR).find(x => String(cd).toLowerCase().startsWith(x.toLowerCase()));
  return k ? MM_STAGE_COLOR[k] : '#64748B';
}
function trangThaiNgan(st){
  if (/từ chối/i.test(st)) return ['tc', 'Từ chối'];
  if (/^Đã xác nhận/i.test(st)) return ['ok', 'Đã nhận'];
  if (/^Chờ/i.test(st)) return ['cho', 'Chờ'];
  return ['', st || ''];
}
// 1 lần chuyển công đoạn: 1 dòng gọn, bấm mở chi tiết (người giao/nhận, phiếu...).
function chuyenHtml(r){
  const [cls, nhan] = trangThaiNgan(r.trang_thai_xac_nhan);
  return '<details class="mm-cv"><summary>🚚 ' + escapeHtml(r.cong_doan_giao) + '→' + escapeHtml(r.cong_doan_nhan) +
    ' ' + fmtNum(r.sl_thuc_chuyen) + (r.thoi_gian_chuyen ? '<br>' + escapeHtml(fmtNgan(r.thoi_gian_chuyen)) : '') +
    (nhan ? ' <span class="st ' + cls + '">' + escapeHtml(nhan) + '</span>' : '') + '</summary>' + histItemHtml(r) + '</details>';
}
function mmRow(k, v, raw){ return '<div class="mm-r"><span class="k">' + escapeHtml(k) + '</span><span class="v">' + (raw ? v : escapeHtml(v)) + '</span></div>'; }

// ctx: { edges(nguoc), tagInfo, tagLoc, tagHist, root, rootInfo, gRoot }
function mmNode(tag, ctx, opts){
  const info = ctx.tagInfo[tag];
  const isRoot = tag === ctx.root;
  if (!info) return '<div class="mm-n"><div class="mm-h"><span class="tag-chip">' + escapeHtml(tag) + '</span></div><div class="mm-miss">Không có dữ liệu tem</div></div>';
  const cd = congDoanTem(info);
  const nguon = ctx.edges.filter(e => e.den === tag);
  const nguonInfo = nguon.map(e => ctx.tagInfo[e.tu]).filter(Boolean);
  const rows = [];
  if (isRoot){
    rows.push(mmRow('Mã SP', info.ma_sp || '—'));
    if (info.ten_sp) rows.push(mmRow('Tên SP', info.ten_sp));
    const g = ctx.gRoot;
    if (g && g.ca.length) rows.push(mmRow('Ca SX', g.ca.join(', ')));
    rows.push(mmRow('Giờ SX', fmtGioSx(g), true));
  } else {
    if (info.ma_sp && info.ma_sp !== ctx.rootInfo.ma_sp) rows.push(mmRow('Mã SP', info.ma_sp));
    if (laTemGoc(tag)){
      const g = gioSxTemGoc(info);
      if (g) rows.push(mmRow('Giờ SX', fmtGioSxGoc(g)));
    }
  }
  if (nguon.length && info.ngay_gio_in){
    rows.push(mmRow(nguon.some(e => e.loai === 'dong_goi') ? 'Đóng gói' : 'Tách lúc', fmtNgan(info.ngay_gio_in)));
  }
  MM_DEDUPE.forEach(([f, k]) => {
    const v = info[f];
    if (v === null || v === undefined || v === '') return;
    if (nguonInfo.some(p => p[f] === v)) return; // kế thừa từ tem nguồn → đã hiện ở đó
    if (opts && opts.cha && opts.cha[f] === v) return;
    rows.push(mmRow(k, v));
  });
  if (isRoot && info.trang_thai) rows.push(mmRow('Trạng thái', info.trang_thai));
  // Vị trí: chỉ tem đang tra + tem còn hàng (tem đã hết 0 sp thì vị trí không còn ý nghĩa).
  const loc = (isRoot || Number(info.so_luong) > 0) ? ctx.tagLoc[tag] : '';
  if (loc) rows.push(mmRow('Vị trí', '<span class="badge-loc">' + escapeHtml(loc) + '</span>', true));
  else if (isRoot) rows.push(mmRow('Vị trí', '<span class="node-meta">Chưa chuyển CĐ</span>', true));
  const cv = daoHtml(tag) + ((opts && opts.hienChuyen) ? (ctx.tagHist[tag] || []).map(chuyenHtml).join('') : '');
  return '<div class="mm-n' + (isRoot ? ' root' : '') + '" style="--cd:' + mauCongDoan(cd) + '">' +
    '<div class="mm-h"><span class="mm-cd">' + escapeHtml(cd) + '</span><span class="mm-sl">còn ' + fmtNum(info.so_luong) + '</span></div>' +
    '<div class="mm-tag"><span class="tag-chip">' + escapeHtml(tag) + '</span></div>' +
    rows.join('') + (cv ? '<div class="mm-cvs">' + cv + '</div>' : '') + '</div>';
}
function mmEdge(e, ctx, hienChuyen){
  const lbl = e.loai === 'tach' ? '✂ Tách' : '📦 Gộp';
  const cv = hienChuyen ? (ctx.tagHist[e.tu] || []).map(chuyenHtml).join('') : '';
  return '<div class="mm-e ' + e.loai + '"><div class="mm-el"><b>' + lbl + ' ' + fmtNum(e.so_luong) + '</b>' + cv + '</div></div>';
}
// Nhánh ngược: tag → các tem nguồn của nó.
function mmNguoc(tag, ctx, visited){
  const kids = ctx.edges.filter(e => e.den === tag);
  const node = mmNode(tag, ctx, { hienChuyen: tag === ctx.root });
  if (!kids.length) return '<div class="mm-b">' + node + '</div>';
  return '<div class="mm-b">' + node + '<div class="mm-kids">' + kids.map(e => {
    const body = visited.has(e.tu)
      ? '<div class="mm-n"><span class="tag-chip">' + escapeHtml(e.tu) + '</span> <span class="node-meta">(đã hiện ở nhánh khác)</span></div>'
      : mmNguoc(e.tu, ctx, new Set([...visited, e.tu]));
    return '<div class="mm-k">' + mmEdge(e, ctx, true) + body + '</div>';
  }).join('') + '</div></div>';
}
// Nhánh xuôi: tag → các tem đã tạo từ nó (tem đang tra hiện gọn ở đầu).
function mmXuoi(tag, ctx, xEdges, visited){
  const kids = xEdges.filter(e => e.tu === tag);
  const node = tag === ctx.root
    ? '<div class="mm-n root mini"><span class="tag-chip">' + escapeHtml(tag) + '</span></div>'
    : mmNode(tag, Object.assign({}, ctx, { edges: [] }), { hienChuyen: !kids.length, cha: ctx.tagInfo[xEdges.find(e => e.den === tag)?.tu] });
  if (!kids.length) return '<div class="mm-b">' + node + '</div>';
  return '<div class="mm-b">' + node + '<div class="mm-kids">' + kids.map(e => {
    const body = visited.has(e.den)
      ? '<div class="mm-n"><span class="tag-chip">' + escapeHtml(e.den) + '</span> <span class="node-meta">(đã hiện ở nhánh khác)</span></div>'
      : mmXuoi(e.den, ctx, xEdges, new Set([...visited, e.den]));
    return '<div class="mm-k">' + mmEdge(e, ctx, e.tu !== ctx.root) + body + '</div>';
  }).join('') + '</div></div>';
}
// Hàng tiêu đề công đoạn: mỗi cột (độ sâu) của sơ đồ → các công đoạn của tem ở cột đó.
function mmTieuDe(tagNo, edges, tagInfo, xuoi){
  const cot = [];
  let lop = [tagNo];
  const da = new Set(lop);
  while (lop.length){
    const cds = [...new Set(lop.map(t => congDoanTem(tagInfo[t])))];
    cot.push(cds);
    const ke = [];
    lop.forEach(t => edges.filter(e => (xuoi ? e.tu : e.den) === t).forEach(e => {
      const k = xuoi ? e.den : e.tu;
      if (!da.has(k)){ da.add(k); ke.push(k); }
    }));
    lop = ke;
  }
  return '<div class="mm-hd">' + cot.map((cds, i) => {
    const w = i === 0 ? (xuoi ? 'var(--wm)' : 'var(--wr)') : 'var(--wn)';
    const mau = cds.length === 1 ? mauCongDoan(cds[0]) : 'var(--border-strong)';
    const txt = cds.map(c => '<span style="color:' + mauCongDoan(c) + '">' + escapeHtml(c) + '</span>').join('<span class="sep"> · </span>');
    return (i ? '<div class="mm-hs">' + (xuoi ? '→' : '←') + '</div>' : '') +
      '<div class="mm-hc" style="width:' + w + ';border-bottom-color:' + mau + '">' + txt + '</div>';
  }).join('') + '</div>';
}
function renderMap(tagNo, edges, tagInfo, tagLoc, tagHist, gRoot){
  const nguoc = edges.filter(e => e.huong === 'nguoc');
  const xuoi = edges.filter(e => e.huong === 'xuoi');
  const ctx = { edges: nguoc, tagInfo, tagLoc, tagHist, root: tagNo, rootInfo: tagInfo[tagNo] || {}, gRoot };
  document.getElementById('mapNguoc').innerHTML = '<div class="mm">' + mmTieuDe(tagNo, nguoc, tagInfo, false) + mmNguoc(tagNo, ctx, new Set([tagNo])) + '</div>' +
    (nguoc.length ? '' : '<div class="empty">Tem gốc — không tách/gộp từ tem nào.</div>');
  const cardX = document.getElementById('cardXuoi');
  cardX.style.display = xuoi.length ? '' : 'none';
  document.getElementById('mapXuoi').innerHTML = xuoi.length ? '<div class="mm xuoi">' + mmTieuDe(tagNo, xuoi, tagInfo, true) + mmXuoi(tagNo, ctx, xuoi, new Set([tagNo])) + '</div>' : '';
}


/* ---------- Quét QR camera (giống chuyencongdoan.html) ---------- */
let html5QrCode = null;
let scanningActive = false;
function getScanner(){ if (!html5QrCode) html5QrCode = new Html5Qrcode("qrReaderDiv"); return html5QrCode; }

async function openCamera(){
  if (typeof Html5Qrcode !== "function"){ showMsg("Lỗi tải thư viện đọc QR — kiểm tra mạng rồi tải lại trang.", "err"); return; }
  document.getElementById("qrModal").classList.add("show");
  const scanner = getScanner();
  scanningActive = true;
  try {
    await scanner.start({ facingMode: "environment" }, { fps: 8, qrbox: { width: 260, height: 260 } }, onScanSuccess, () => {});
  } catch(e){
    scanningActive = false;
    await closeQrModal();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      document.getElementById("qrFileInput").click();
      return;
    }
    showMsg("Không mở được camera: " + e, "err");
  }
}
async function closeQrModal(){
  document.getElementById("qrModal").classList.remove("show");
  scanningActive = false;
  if (html5QrCode && html5QrCode.isScanning){ try { await html5QrCode.stop(); } catch(e){} }
}
async function onScanSuccess(decodedText){
  if (!scanningActive) return;
  scanningActive = false;
  await closeQrModal();
  search(decodedText);
}
function onFileChosen(evt){
  const file = evt.target.files && evt.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const canvas = document.getElementById("scanCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = img.width; canvas.height = img.height;
    ctx.drawImage(img, 0, 0, img.width, img.height);
    URL.revokeObjectURL(url);
    const data = ctx.getImageData(0, 0, img.width, img.height);
    const code = jsQR(data.data, data.width, data.height);
    if (code && code.data) search(code.data);
    else showMsg("Không đọc được mã QR trong ảnh.", "err");
    evt.target.value = "";
  };
  img.src = url;
}

function tickClock(){
  const now = new Date();
  const d = document.getElementById('hdrDate');
  const t = document.getElementById('hdrTime');
  if (d) d.textContent = now.toLocaleDateString('vi-VN', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' });
  if (t) t.textContent = now.toLocaleTimeString('vi-VN', { hour12: false });
}
tickClock();
setInterval(tickClock, 1000);

document.getElementById('btnScan').addEventListener('click', openCamera);
document.getElementById('btnCloseQrModal').addEventListener('click', closeQrModal);
document.getElementById('qrFileInput').addEventListener('change', onFileChosen);
// Mở thẳng: truy-xuat-nguon-goc.html?tag=<Tag No>
const tagUrl = new URLSearchParams(location.search).get('tag');
if (tagUrl) search(tagUrl);

</script>
